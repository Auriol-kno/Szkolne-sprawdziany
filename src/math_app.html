<body>
<title>Matma Franka</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
/* Layout: zeszyt w kratkę — jedna kolumna kartek z zadaniami, nagłówek z zakładkami, czerwony długopis nauczyciela do ocen */
:root{
  --paper:#F5F8FB; --grid:#DCE6F0; --card:#FFFFFF; --fg:#1C2430; --muted:#5B697C; --line:#CAD6E4;
  --ink:#22477F; --ink-soft:#E4ECF8; --on-ink:#FFFFFF;
  --red:#C3352B; --red-soft:#FBE6E3; --green:#1D7A4C; --green-soft:#DFF2E6; --amber:#A86C12; --amber-soft:#FBEFD6;
  --hl:#FFE47D; --shadow:rgba(34,71,127,.13); --shadow-strong:rgba(34,71,127,.35);
  --bar:#1F3F70; --bar-fg:#DCE7F7; --bar-line:rgba(255,255,255,.3); --bar-on:#FFD65A; --bar-on-fg:#1C2430;
  --display:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body:'Nunito', 'Segoe UI', system-ui, sans-serif;
  --hand:'Caveat', 'Comic Sans MS', cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111722; --grid:#1A2331; --card:#18202D; --fg:#E6EBF2; --muted:#98A6B8; --line:#2B384C;
  --ink:#8FB6F4; --ink-soft:#21314A; --on-ink:#0E1522;
  --red:#FF8B80; --red-soft:#3A1F22; --green:#6CD29A; --green-soft:#16321F; --amber:#F0BC5A; --amber-soft:#382B15;
  --hl:#5E5014; --shadow:rgba(0,0,0,.45); --shadow-strong:rgba(0,0,0,.6); --bar:#1D3457; --bar-fg:#C9D8EE; --bar-line:rgba(255,255,255,.2); --bar-on:#F2C14E; --bar-on-fg:#111722; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#111722; --grid:#1A2331; --card:#18202D; --fg:#E6EBF2; --muted:#98A6B8; --line:#2B384C;
  --ink:#8FB6F4; --ink-soft:#21314A; --on-ink:#0E1522;
  --red:#FF8B80; --red-soft:#3A1F22; --green:#6CD29A; --green-soft:#16321F; --amber:#F0BC5A; --amber-soft:#382B15;
  --hl:#5E5014; --shadow:rgba(0,0,0,.45); --shadow-strong:rgba(0,0,0,.6); --bar:#1D3457; --bar-fg:#C9D8EE; --bar-line:rgba(255,255,255,.2); --bar-on:#F2C14E; --bar-on-fg:#111722; color-scheme:dark }

*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);border-bottom:1px solid var(--bar)}
.top-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:800;font-size:1.2rem;color:#FFFFFF;line-height:1;display:flex;align-items:baseline;gap:6px;margin-right:auto}
.brand small{font-family:var(--body);font-weight:700;font-size:.72rem;color:var(--bar-fg);letter-spacing:.06em;text-transform:uppercase}
.nav{display:grid;grid-template-columns:repeat(5,auto);gap:8px}
.nav button{border:2px solid var(--bar-line);background:transparent;padding:9px 14px;border-radius:12px;font-family:var(--display);font-weight:700;font-size:1.02rem;line-height:1.2;color:var(--bar-fg)}
.nav button:hover{border-color:var(--bar-fg);color:#FFFFFF}
.nav button.on{background:var(--bar-on);border-color:var(--bar-on);color:var(--bar-on-fg);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.nav button:focus-visible{outline-color:var(--bar-on)}
@media (max-width:620px){.nav{width:100%;grid-template-columns:repeat(5,1fr);gap:5px}.nav button{padding:10px 0;font-size:.72rem;border-radius:10px;letter-spacing:-.02em}}
.top{box-shadow:0 2px 10px var(--shadow)}

/* duże pole zadania */
.task{border:2px solid var(--ink);border-radius:18px;padding:clamp(20px,4vw,34px);box-shadow:0 6px 22px var(--shadow)}
.task .tn{font-size:1.45rem}
.task .tag{font-size:.85rem;padding:4px 12px}
.task .q-text{font-size:clamp(1.18rem,3.6vw,1.4rem);line-height:1.5}
.task .expr{font-size:clamp(2.1rem,8vw,3rem);margin:14px 0 4px}
.task .fields{gap:16px 28px;margin-top:20px}
.task .fld{font-size:1rem}
.task .fld input{font-size:2.1rem;width:7.5ch;padding:6px 12px;border-bottom-width:4px}
.task .acts{margin-top:24px}
.task .acts .primary,.task .acts .ghost{font-size:1.12rem;padding:13px 26px}
.task .fb{padding:18px 20px}
.task .fb-v{font-size:2.1rem}
.task .expl{font-size:1.05rem}
.task .hint{font-size:1.05rem}

main{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:800}
h2{font-size:1.3rem;font-weight:700}
p{margin:0}
.lead{color:var(--muted);max-width:60ch}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.primary,.ghost,.soft{border-radius:10px;padding:10px 18px;font-weight:800;border:2px solid var(--ink)}
.primary{background:var(--ink);color:var(--on-ink)}
.primary:hover{filter:brightness(1.08)}
.primary:disabled{opacity:.45;cursor:not-allowed}
.ghost{background:transparent;color:var(--ink)}
.ghost:hover{background:var(--ink-soft)}
.soft{border-color:var(--line);background:var(--card);color:var(--fg);padding:6px 12px;font-size:.9rem}
.soft:hover{border-color:var(--ink);color:var(--ink)}
.danger{border-color:var(--red);background:var(--red);color:var(--on-ink)}

/* task */
.task-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-bottom:10px}
.tn{font-family:var(--display);font-weight:800;font-size:1.15rem}
.pts{color:var(--muted);font-variant-numeric:tabular-nums}
.pts .got{font-family:var(--hand);font-size:1.5rem;color:var(--red);line-height:1}
.tag{margin-left:auto;font-size:.78rem;font-weight:700;color:var(--ink);background:var(--ink-soft);padding:2px 10px;border-radius:999px}
.q-text{font-size:1.08rem;max-width:62ch}
.expr{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,6vw,2.2rem);margin:10px 0 2px;font-variant-numeric:tabular-nums;letter-spacing:.01em;overflow-wrap:anywhere}
.expr sup,.q-text sup{font-size:.6em}
.box{display:inline-block;min-width:1.3em;height:1.05em;border:2px dashed var(--ink);border-radius:4px;vertical-align:-.12em;color:transparent;line-height:1}
.fields{display:flex;flex-wrap:wrap;gap:12px 22px;margin-top:14px}
.fld{display:flex;flex-direction:column;gap:2px;font-size:.85rem;font-weight:700;color:var(--muted)}
.fld input{width:8.5ch;font-family:var(--display);font-weight:700;font-size:1.5rem;padding:2px 8px;border:0;border-bottom:3px solid var(--ink);
  background:var(--ink-soft);border-radius:8px 8px 0 0;color:var(--fg);font-variant-numeric:tabular-nums}
.symbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:10px}.symbar span{font-size:.8rem;font-weight:800;color:var(--muted)}.symbar button{min-width:2.4rem;height:2.4rem;border:2px solid var(--line);border-radius:10px;background:var(--card);font:700 1.2rem var(--display);color:var(--ink)}.symbar button:active{background:var(--ink-soft)}
.fld.wide input.sf{width:100%;max-width:22rem}.fld input.txt{font-size:1.1rem;font-family:var(--body)}
.fld input:focus{outline:none;background:var(--hl)}
.fld input.ok,.fld select.ok{border-color:var(--green);background:var(--green-soft)}
.fld input.bad,.fld select.bad{border-color:var(--red);background:var(--red-soft)}
.fld input:disabled,.fld select:disabled{opacity:1;-webkit-text-fill-color:var(--fg)}
.fld select{font-family:var(--body);font-weight:800;font-size:1.05rem;padding:8px 10px;border:0;border-bottom:3px solid var(--ink);background:var(--ink-soft);border-radius:8px 8px 0 0;color:var(--fg);max-width:100%}
.fld.wide{flex:1 1 100%}
.fld.wide span{font-size:.95rem;color:var(--fg);font-weight:700}

      path:[{label:`Ile razem dają ${f(x)} i ${f(y)}?`,ans:tot}],
      hint:`Poszukaj dwóch par liczb, które razem dają ${f(tot)}.`,
      expl:`Łączymy składniki w pary: (${f(x)} + ${f(y)}) + (${f(z)} + ${f(w)}) = ${f(tot)} + ${f(tot)} = ${f(s)}.`};
  }

      hint:'Gdy są tylko dodawanie i odejmowanie, liczysz po kolei od lewej.',
      expl:`${f(a)} + ${f(b)} = ${f(s1)}, potem ${f(s1)} − ${f(c)} = ${f(s1-c)}.`};
  }

  else{if(add){a=R(1050,6999);b=R(1050,9999-a)}else{a=R(3000,9999);b=R(1050,a-100)}}
  const res=add?a+b:a-b,op=add?'+':'−',u=L===1?10:L===2?100:1000,bt=b-b%u,m=add?a+bt:a-bt;

    path:split?[{label:`Najpierw ${op==='+'?'dodaj':'odejmij'} samą ${L===1?'liczbę dziesiątek':L===2?'liczbę setek':'liczbę tysięcy'}: ${f(a)} ${op} ${f(bt)} =`,ans:m}]:[],
    hint:add?'Dodawaj osobno tysiące, setki, dziesiątki i jedności.':'Możesz odjąć najpierw pełne setki lub dziesiątki, a potem resztę.',expl};

function kOpts(correct,wrongs,unit){
  const set=[correct];

  for(let k=1;set.length<5;k++){for(const c of [correct+k,correct-k]){if(set.length<5&&c>=0&&!set.includes(c))set.push(c)}}
  set.sort((a,b)=>a-b);

  return{html:`<div class="kopts">${set.map((v,i)=>`<span><b>${LET[i]}</b>${f(v)}${u}</span>`).join('')}</div>`,ans:LET[set.indexOf(correct)],show:`${LET[set.indexOf(correct)]}) ${f(correct)}${u}`};
}

/* ---------- storage ---------- */
const KEY='lid4-v1';
function blank(){return{v:1,name:'Franek',topics:{},levels:{},sessions:[],days:[],daily:{},count:0}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)return Object.assign(blank(),s)}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
const tst=id=>S.topics[id]||(S.topics[id]={att:0,ok:0,recent:[],st:0,wr:0});
const lvl=id=>S.levels[id]||1;
function acc(id){const t=S.topics[id];if(!t||!t.recent.length)return null;return t.recent.reduce((a,b)=>a+b,0)/t.recent.length}
function chAcc(ch){const all=topicsOf(ch).flatMap(t=>(S.topics[t.id]||{recent:[]}).recent);return all.length?all.reduce((a,b)=>a+b,0)/all.length:null}
function status(a){if(a==null)return['new','nowy'];if(a<.5)return['low','do poprawy'];if(a<.8)return['mid','ćwicz dalej'];return['top','opanowane']}
function record(q,pts,max,adapt){
  const t=tst(q.topic),fr=pts/max;t.att++;t.ok+=fr;t.recent.push(fr);if(t.recent.length>20)t.recent.shift();
  S.count++;const d=today();if(!S.days.includes(d))S.days.push(d);S.daily[d]=(S.daily[d]||0)+1;
  let msg='';
  if(adapt){
    if(fr===1){t.st++;t.wr=0}else if(fr<.5){t.wr++;t.st=0}else{t.st=0;t.wr=0}
    const L=lvl(q.topic);
    if(t.st>=3&&L<3){S.levels[q.topic]=L+1;t.st=0;msg=`Trzy razy pod rząd bez błędu. Temat „${T[q.topic].name}” przechodzi na poziom ${LV[L+1]}.`}
    else if(t.wr>=2&&L>1){S.levels[q.topic]=L-1;t.wr=0;msg=`Wracamy na chwilę do łatwiejszych zadań z tego tematu (poziom ${LV[L-1]}).`}
  }
  save();return msg;
}
function streak(){const set=new Set(S.days);const d=new Date();if(!set.has(ymd(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}
function gradeOf(p){if(p>=98)return[6,'cel'];if(p>=90)return[5,'bdb'];if(p>=75)return[4,'db'];if(p>=60)return[3,'dst'];if(p>=40)return[2,'dop'];return[1,'ndst']}
function weakTopics(){
  const pr=TOPICS.filter(t=>acc(t.id)!=null&&t.id!=='kang').sort((a,b)=>acc(a.id)-acc(b.id)).slice(0,3).map(t=>t.id);
  const rest=shuffle(topicsOf('c1').map(t=>t.id).filter(id=>!pr.includes(id)));
  return pr.concat(rest).slice(0,3);
}

/* ---------- questions ---------- */
function makeQ(id,L,seen,wp){
  let q;for(let k=0;k<8;k++){q=G[id](L);if(!seen||!seen.has(q.html))break}
  q.topic=id;q.level=L;q.path=q.path||[];q.hasPath=!!(wp&&q.path.length);
  if(q.hasPath)q.fields=q.path.map(p=>Object.assign({},p,{path:true})).concat(q.fields);
  q.max=q.fields.length;seen&&seen.add(q.html);return q;
}
function parseNum(v){if(v==null)return null;const s=String(v).replace(/[\s .]/g,'').replace(/^[−–]/,'-');if(!/^-?\d+$/.test(s))return null;return parseInt(s,10)}
function isEmpty(q,vals){return q.fields.some((fd,k)=>fd.mark?vals[k]==null:!String(vals[k]??'').trim())}
function gradeQ(q,vals){const ok=q.fields.map((fd,k)=>fd.mark?vals[k]===fd.ans:fd.kind==='sel'?vals[k]===fd.ans:parseNum(vals[k])===fd.ans);return{ok,pts:ok.filter(Boolean).length,max:q.max}}
function selLabel(fd,v){const o=(fd.opts||[]).find(x=>x[0]===v);return o?o[1]:(v||'—')}
function ansText(fd){
  if(fd.mark)return`liczba ${fd.show} (zielona kreska)`;
  const l=fd.label||'wynik';
  if(fd.kind==='sel')return`${l}: <b>${fd.show||selLabel(fd,fd.ans)}</b>`;
  return /[=?]$/.test(l)?`${l} <b>${f(fd.ans)}</b>`:`${l}: <b>${f(fd.ans)}</b>`;
}

function lineSVG(q,ns,vals,locked,show){
  const L=q.line,x0=34,g=54,y=52;let s=`<svg viewBox="0 0 620 100" role="img" aria-label="Oś liczbowa">`;
  s+=`<line x1="8" y1="${y}" x2="604" y2="${y}" class="ax"/><path d="M604 ${y-7} L616 ${y} L604 ${y+7} Z" class="axh"/>`;
  for(let i=0;i<=10;i++){const x=x0+i*g;s+=`<line x1="${x}" y1="${y-9}" x2="${x}" y2="${y+9}" class="tk"/>`}
  L.labels.forEach(([i,v])=>{s+=`<text x="${x0+i*g}" y="${y+34}" class="lb">${f(v)}</text>`});
  const fa=q.fields.find(fd=>!fd.path&&!fd.mark);
  if(L.point!=null){const x=x0+L.point*g;s+=`<circle cx="${x}" cy="${y}" r="7" class="pt"/><text x="${x}" y="${y-17}" class="pl">A</text>`;
    if(show&&fa)s+=`<text x="${x}" y="${y+34}" class="lb ans">${fa.ans}</text>`}
  const k=q.fields.findIndex(fd=>fd.mark);
  if(k>=0){const sel=vals[k],ans=q.fields[k].ans;
    for(let i=0;i<=10;i++){const x=x0+i*g;let c='hit';if(sel===i)c+=' sel';if(show&&i===ans)c+=' right';if(show&&sel===i&&sel!==ans)c+=' wrong';
      const at=locked?'':` data-act="tick" data-ns="${ns}" data-k="${k}" data-t="${i}" tabindex="0" role="button" aria-label="Kreska numer ${i}"`;
      s+=`<g class="${c}"${at}><rect x="${x-26}" y="${y-30}" width="52" height="58" fill="transparent"/><circle cx="${x}" cy="${y}" r="8" class="mk"/></g>`}
    if(show)s+=`<text x="${x0+ans*g}" y="${y+34}" class="lb ans">${q.fields[k].show}</text>`}
  return s+'</svg>';
}
function fieldHTML(fd,k,ns,vals,res){
  if(fd.mark)return'';
  const locked=!!res,cls=locked?` ${res.ok[k]?'ok':'bad'}`:'';
  if(fd.kind==='sel'){
    return`<label class="fld${fd.path?'':' '}" for="${ns}-${k}"><span>${fd.label||'Wybierz'}</span><select id="${ns}-${k}" data-ns="${ns}" data-k="${k}"${locked?` disabled class="${res.ok[k]?'ok':'bad'}"`:''}>${fd.opts.map(([v,l])=>`<option value="${v}"${vals[k]===v?' selected':''}>${l}</option>`).join('')}</select></label>`;
  }
  return`<label class="fld${fd.path&&fd.label&&fd.label.length>34?' wide':''}" for="${ns}-${k}"><span>${fd.label||'Wynik'}</span><input id="${ns}-${k}" data-ns="${ns}" data-k="${k}" inputmode="${KBSYS?'decimal':'none'}" enterkeyhint="next" autocomplete="off" autocorrect="off" spellcheck="false" value="${esc(vals[k]??'')}"${locked?` disabled class="${res.ok[k]?'ok':'bad'}"`:''}></label>`;
}
let KBSYS=false;
let LASTIN=null;
function qBody(q,ns,vals,res){
  const locked=!!res;let h=q.kang?q.html:`<div class="q-text">${q.html}</div>`;
  if(q.line)h+=`<div class="axis">${lineSVG(q,ns,vals,locked,locked)}</div>`;
  const pi=[],fi=[];q.fields.forEach((fd,k)=>(fd.path?pi:fi).push([fd,k]));
  if(pi.length)h+=`<div class="path"><span class="lbl">Droga do wyniku <small>(zapisz kolejne kroki, są oceniane)</small></span><div class="fields">${pi.map(([fd,k])=>fieldHTML(fd,k,ns,vals,res)).join('')}</div></div>`;
  const fin=fi.map(([fd,k])=>fieldHTML(fd,k,ns,vals,res)).join('');
  if(fin)h+=`${pi.length?'<span class="lbl final-l">Odpowiedź</span>':''}<div class="fields">${fin}</div>`;
  return h;
}
function fbHTML(q,res){
  const all=res.pts===res.max,c=all?'ok':res.pts?'part':'bad';
  const wrong=q.fields.filter((fd,k)=>!res.ok[k]);
  const pathBad=q.fields.some((fd,k)=>fd.path&&!res.ok[k]),finBad=q.fields.some((fd,k)=>!fd.path&&!res.ok[k]);
  return`<div class="fb ${c}" role="status"><p class="fb-v">${res.verdict}</p>${wrong.length?`<p>Poprawnie: ${wrong.map(ansText).join('; ')}.</p>`:''}${pathBad&&!finBad?'<p class="pathmsg">Wynik końcowy dobry, ale droga do niego nie. Na sprawdzianie ocenia się też kolejne kroki.</p>':''}<p class="expl">${q.expl}</p>${res.lvMsg?`<p class="lvmsg">${res.lvMsg}</p>`:''}</div>`;
}
const verdict=r=>r.pts===r.max?P(['Dobrze!','Świetnie!','Brawo!','Tak jest!','Bez błędu!']):r.pts?'Prawie. Część jest dobrze.':P(['Jeszcze nie.','Spróbuj zrozumieć sposób:']);

/* ---------- state ---------- */
let VIEW='home',RUN=null,WARM=null,TIMER=null,CONFIRM_RESET=false,CHV='c1';
const TRAIN={topics:new Set(topicsOf('c1').map(t=>t.id)),level:'auto',n:10,path:true};
const TEST={level:2,timer:false,chs:new Set(['c1'])};
const $=s=>document.querySelector(s);
const testTopics=()=>CH.filter(c=>TEST.chs.has(c.id)).flatMap(c=>topicsOf(c.id));
const testCount=()=>testTopics().reduce((a,t)=>a+(t.id==='kang'?5:1),0);
const testMin=n=>Math.max(45,Math.ceil(n*3.5/5)*5);

function newWarm(){const pool=TOPICS.filter(t=>t.id!=='kang'&&t.ch==='c1'||acc(t.id)!=null&&t.id!=='kang');const id=P(pool).id;WARM={q:makeQ(id,lvl(id),null,false),vals:[],res:null,hint:false,msg:''}}

function startRun(mode,o){
  clearInterval(TIMER);
  const seen=new Set(),wp=mode==='test'?true:(o.path!==undefined?o.path:TRAIN.path);
  RUN={mode,opts:o,level:o.level,n:o.n,qs:[],vals:[],res:[],hint:[],i:0,seen,wp,t0:Date.now(),done:false,pending:null,confirmEnd:false,msg:'',group:P(['A','B'])};
  if(mode==='test'){
    const ts=o.chs?CH.filter(c=>o.chs.includes(c.id)).flatMap(c=>topicsOf(c.id)):TOPICS.filter(t=>t.ch==='c1');
    ts.forEach(t=>{for(let r=0;r<(t.id==='kang'?5:1);r++)RUN.qs.push(makeQ(t.id,o.level,seen,true))});
    RUN.n=RUN.qs.length;RUN.vals=RUN.qs.map(()=>[]);RUN.names=CH.filter(c=>o.chs.includes(c.id)).map(c=>c.name);
    if(o.timer){RUN.deadline=Date.now()+testMin(RUN.n)*60000;TIMER=setInterval(tick,1000)}}
  else{let order=[];while(order.length<o.n){let s=shuffle(o.topics);if(order.length&&s.length>1&&s[0]===order[order.length-1])s.push(s.shift());order=order.concat(s)}RUN.order=order.slice(0,o.n);ensureQ(0)}
  VIEW='run';render();scrollTo(0,0);
}
function ensureQ(i){if(!RUN.qs[i]){const id=RUN.order[i];RUN.qs[i]=makeQ(id,RUN.level==='auto'?lvl(id):RUN.level,RUN.seen,RUN.wp);RUN.vals[i]=[]}}
function tick(){if(!RUN||RUN.done||!RUN.deadline){clearInterval(TIMER);return}const left=RUN.deadline-Date.now();
  if(left<=0){finishTest();return}const el=$('#timer');if(el){el.textContent=mmss(left);el.classList.toggle('low',left<5*60000)}}
const mmss=ms=>{const s=Math.max(0,Math.round(ms/1000));return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};

function doCheck(){
  const i=RUN.i,q=RUN.qs[i],vals=RUN.vals[i];
  if(isEmpty(q,vals)){RUN.msg=q.fields.some(fd=>fd.mark)?'Kliknij kreskę na osi i wypełnij pozostałe pola.':'Wypełnij wszystkie pola.';render();return}
  const r=gradeQ(q,vals);r.verdict=verdict(r);
  r.lvMsg=record(q,r.pts,r.max,RUN.level==='auto');RUN.res[i]=r;RUN.msg='';render();
  const b=document.querySelector('[data-act="next"]');b&&b.focus();
}
function doNext(){if(RUN.i+1>=RUN.n){finishRun();return}RUN.i++;ensureQ(RUN.i);RUN.msg='';render();focusFirst()}
function finishRun(){
  RUN.done=true;clearInterval(TIMER);
  const pts=RUN.res.reduce((a,r)=>a+(r?r.pts:0),0),max=RUN.qs.reduce((a,q)=>a+q.max,0),pct=Math.round(pts/max*100);
  const s={d:Date.now(),mode:RUN.mode,pts,max,pct,n:RUN.n,level:RUN.level,time:Date.now()-RUN.t0};
  if(RUN.mode==='test'){s.grade=gradeOf(pct)[0];s.chs=RUN.opts.chs}
  S.sessions.push(s);if(S.sessions.length>200)S.sessions.shift();save();
  RUN.summary=s;VIEW='result';render();scrollTo(0,0);
}
function finishTest(){RUN.qs.forEach((q,i)=>{const r=gradeQ(q,RUN.vals[i]||[]);r.verdict=verdict(r);RUN.res[i]=r;record(q,r.pts,r.max,false)});finishRun()}
function focusFirst(){const el=document.querySelector('#main input:not([disabled]),#main select:not([disabled])');el&&el.focus({preventScroll:true})}

function confirmBar(){
  if(!RUN.pending)return'';
  const t=RUN.mode==='test'?'Przerwać sprawdzian? Odpowiedzi nie zostaną ocenione ani zapisane.':'Zakończyć trening? Rozwiązane zadania są już zapisane w postępach.';
  return`<div class="confirm"><p>${t}</p><button class="danger primary" data-act="quitok">Tak, zakończ</button><button class="ghost" data-act="quitno">Wróć do zadań</button></div>`;
}

function vRun(){
  const r=RUN,i=r.i,q=r.qs[i],test=r.mode==='test';
  const title=test?'Sprawdzian':r.mode==='weak'?'Słabe strony':'Trening';
  const lvTxt=r.level==='auto'?'poziom automatyczny':'poziom '+LV[r.level];
  const done=test?r.vals.filter((v,k)=>!isEmpty(r.qs[k],v)).length:r.res.filter(Boolean).length;
  const res=test?null:r.res[i];
  let h=`<div class="run-top"><button class="soft" data-act="quit">Zakończ</button><span class="t">${title}</span><span class="note">${lvTxt}</span>${r.deadline?`<span class="timer" id="timer">${mmss(r.deadline-Date.now())}</span>`:''}<span class="cnt">${i+1} / ${r.n}</span></div>
  <div class="bar" aria-hidden="true"><i style="width:${done/r.n*100}%"></i></div>${confirmBar()}`;
  if(test){
    h+=`<div class="sheet-h"><b>kl. 4 Matematyka · grupa ${r.group}</b><span>${esc(S.name)} · ${new Date().toLocaleDateString('pl-PL')}</span></div>
    <p class="note">${r.names.join(' · ')}</p>
    <div class="dots" aria-label="Przejdź do zadania">${r.qs.map((qq,k)=>`<button class="${k===i?'cur':''}${!isEmpty(qq,r.vals[k])?' filled':''}" data-act="jump" data-v="${k}" aria-label="Zadanie ${k+1}">${k+1}</button>`).join('')}</div>`;
  }
  h+=`<article class="card task"><div class="task-h"><span class="tn">Zadanie ${i+1}.</span><span class="pts">(${res?`<span class="got">${res.pts}</span>`:'.....'} / ${q.max} p.)</span><span class="tag">${T[q.topic].name}${test?'':' · '+LV[q.level]}</span></div>
  ${qBody(q,'r',r.vals[i],res)}
  ${!test&&r.hint[i]&&!res?`<p class="hint"><b>Podpowiedź:</b> ${q.hint}</p>`:''}
  ${res?fbHTML(q,res):''}
  <div class="acts">`;
  if(test){
    const left=r.qs.filter((qq,k)=>isEmpty(qq,r.vals[k])).length;
    h+=`${i>0?'<button class="ghost" data-act="prev">Poprzednie</button>':''}${i+1<r.n?'<button class="primary" data-act="tnext">Następne</button>':''}<button class="${i+1<r.n?'ghost':'primary'} sp" data-act="hand">Oddaj sprawdzian</button></div>`;
    if(r.confirmEnd)h+=`<div class="confirm" style="margin-top:14px"><p>${left?`Bez pełnych odpowiedzi ${plural(left,'zostało','zostały','zostało')} ${left} ${plural(left,'zadanie','zadania','zadań')}. `:''}Oddać sprawdzian do oceny?</p><button class="primary" data-act="handok">Oddaj</button><button class="ghost" data-act="handno">Jeszcze sprawdzę</button></div>`;
  }else{
    h+=res?`<button class="primary" data-act="next">${i+1<r.n?'Następne zadanie':'Zobacz wynik'}</button>`:`<button class="primary" data-act="check">Sprawdź</button>${r.hint[i]?'':'<button class="ghost" data-act="hint">Podpowiedź</button>'}${r.msg?`<span class="warn">${r.msg}</span>`:''}`;
    h+='</div>';
  }
  return h+'</article>';
}

function yoursText(q,vals){return q.fields.map((fd,j)=>fd.mark?(vals[j]!=null?'kreska nr '+vals[j]:'—'):fd.kind==='sel'?selLabel(fd,vals[j]):(String(vals[j]??'').trim()?esc(vals[j]):'—')).join(', ')}
function vResult(){

  const pathLost=r.qs.reduce((a,q,k)=>a+(r.res[k]?q.fields.filter((fd,j)=>fd.path&&!r.res[k].ok[j]).length:0),0);
  const pathAll=r.qs.reduce((a,q)=>a+q.fields.filter(fd=>fd.path).length,0);
  const names={6:'celujący',5:'bardzo dobry',4:'dobry',3:'dostateczny',2:'dopuszczający',1:'niedostateczny'};
  let h=`<section class="hello"><span class="eyebrow">${test?'Wynik sprawdzianu':'Wynik treningu'}</span><h1>${s.pct>=90?'Świetna robota!':s.pct>=60?'Dobra robota!':'Jest nad czym popracować'}</h1></section>

      <p><b>${s.pct}%</b> ${test?`· ocena ${names[g]}`:`· ${full} ${plural(full,'zadanie','zadania','zadań')} w pełni dobrze`} · czas ${mmss(s.time)}</p>
      ${pathAll?`<p class="note">Droga do wyniku: ${pathAll-pathLost} z ${pathAll} kroków poprawnych.</p>`:''}
      ${test?'<p class="scale">Skala: 98–100% = 6, 90–97% = 5, 75–89% = 4, 60–74% = 3, 40–59% = 2, 0–39% = 1.</p>':''}
    </div>
  </section>
  <div class="acts" style="margin-top:0">${errTopics.length?`<button class="primary" data-act="fix" data-v="${errTopics.join(',')}">Poćwicz tematy z błędami (${errTopics.length})</button>`:''}
    <button class="${errTopics.length?'ghost':'primary'}" data-act="again">${test?'Nowy sprawdzian':'Jeszcze raz'}</button><button class="ghost" data-act="go" data-v="progress">Zobacz postępy</button></div>
  <section class="stack"><h2>Zadania</h2><p class="note">Kliknij zadanie, żeby zobaczyć rozwiązanie.</p><div class="rlist">`;
  r.qs.forEach((q,k)=>{const x=r.res[k];if(!x)return;const m=x.pts===x.max?['y','✓']:x.pts?['p','½']:['n','✗'];
    h+=`<details class="ritem"${x.pts<x.max&&test?' open':''}><summary><span class="mark ${m[0]}">${m[1]}</span><span>Zadanie ${k+1}. ${T[q.topic].name}</span><span class="rp">${x.pts}/${x.max}</span></summary>
    <div class="rb">${q.kang?q.html:`<div class="q-text">${q.html}</div>`}${q.line?`<div class="axis">${lineSVG(q,'v'+k,r.vals[k],true,true)}</div>`:''}
    <p class="ans-line">Twoje odpowiedzi: <b>${yoursText(q,r.vals[k])}</b></p><p class="ans-line">Poprawnie: ${q.fields.map(ansText).join('; ')}</p><p class="expl note" style="color:var(--fg)">${q.expl}</p></div></details>`});
  return h+'</div></section>'+sendPanel();
}

function histRow(s){const d=new Date(s.d);const m={train:'Trening',test:'Sprawdzian',weak:'Słabe strony'}[s.mode]||s.mode;
  const sc=s.chs?' · '+s.chs.map(id=>C[id]?C[id].sym:'').join(' '):'';

function chartSVG(list){
  const W=620,H=210,l=36,rt=10,t=26,b=28,ih=H-t-b,n=list.length,slot=(W-l-rt)/Math.max(n,6),bw=Math.min(34,slot*.6);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wyniki ostatnich sesji w procentach">`;
  [0,50,75,100].forEach(v=>{const y=t+ih-ih*v/100;s+=`<line x1="${l}" x2="${W-rt}" y1="${y}" y2="${y}" class="gl"/><text x="${l-6}" y="${y+4}" class="gt" text-anchor="end">${v}%</text>`});
  list.forEach((x,i)=>{const cx=l+slot*i+slot/2,hgt=Math.max(2,ih*x.pct/100),y=t+ih-hgt;
    s+=`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${hgt}" rx="3" class="${x.mode==='test'?'bx':'bt'}"/>`;
    s+=x.grade?`<text x="${cx}" y="${y-6}" class="gr">${x.grade}</text>`:`<text x="${cx}" y="${y-6}" class="vl">${x.pct}</text>`;
    const d=new Date(x.d);s+=`<text x="${cx}" y="${H-8}" class="gt" text-anchor="middle">${d.getDate()}.${d.getMonth()+1}</text>`});
  return s+'</svg>';
}

let SEND={copied:false,show:false,msg:''};
const MODE_N={train:'Trening',test:'Sprawdzian',weak:'Słabe strony'};
function sessLine(s){const d=new Date(s.d);return`${d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'})} ${d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})} · ${MODE_N[s.mode]||s.mode}${s.chs?' ['+s.chs.map(id=>C[id]?C[id].name:id).join(', ')+']':''}${s.level&&s.level!=='auto'?' ('+LV[s.level]+')':''} · ${s.pts}/${s.max} p. · ${s.pct}%${s.grade?' · ocena '+s.grade:''}`}
function summaryText(){
  const all=TOPICS.flatMap(t=>(S.topics[t.id]||{recent:[]}).recent);
  const overall=all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length*100)+'%':'brak danych';
  const tests=S.sessions.filter(s=>s.mode==='test').slice(-5).reverse();
  const last=S.sessions[S.sessions.length-1];
  let t=`Wyniki: ${S.name} · Matematyka kl. 4\nStan na: ${new Date().toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'})}\n\n`;
  const td=today(),tds=S.sessions.filter(s=>ymd(new Date(s.d))===td);
  t+=`DZISIAJ: ${S.daily[td]||0} ${plural(S.daily[td]||0,'zadanie','zadania','zadań')}`;
  if(tds.length){const p=tds.reduce((a,s)=>a+s.pts,0),m=tds.reduce((a,s)=>a+s.max,0);t+=` · ${tds.length} ${plural(tds.length,'sesja','sesje','sesji')} · ${p}/${m} p. (${Math.round(p/m*100)}%)\n${tds.map(s=>'- '+sessLine(s)).join('\n')}`}
  t+='\n\n';
  if(last&&ymd(new Date(last.d))!==td)t+=`Ostatnia nauka: ${sessLine(last)}\n\n`;
  const wk=TOPICS.filter(x=>{const a=acc(x.id);return a!=null&&a<.5}).map(x=>x.name);
  const top=TOPICS.filter(x=>{const a=acc(x.id);return a!=null&&a>=.8}).map(x=>x.name);
  t+=`OGÓŁEM\nRozwiązane zadania: ${S.count}\nŚrednia skuteczność: ${overall}\nDni nauki z rzędu: ${streak()}\nDni nauki łącznie: ${S.days.length}\n`;
  t+=`Opanowane tematy: ${top.length?top.join(', '):'jeszcze żaden'}\nDo poprawy: ${wk.length?wk.join(', '):'brak'}\n\n`;
  t+=`Sprawdziany:\n${tests.length?tests.map(s=>'- '+sessLine(s)).join('\n'):'- jeszcze żadnego'}\n\n`;
  t+='Działy (skuteczność z ostatnich 20 zadań w temacie):\n';
  t+=CH.map(c=>{const a=chAcc(c.id);const pr=topicsOf(c.id).filter(x=>acc(x.id)!=null);
    return`${c.name}: ${a==null?'nie ćwiczony':Math.round(a*100)+'%'}${pr.length?'\n'+pr.map(x=>`  - ${x.name}: ${Math.round(acc(x.id)*100)}% · ${status(acc(x.id))[1]} · poziom ${LV[lvl(x.id)]}`).join('\n'):''}`}).join('\n');
  const rec=S.sessions.slice(-10).reverse();
  if(rec.length)t+=`\n\nOstatnie sesje:\n${rec.map(s=>'- '+sessLine(s)).join('\n')}`;
  return t;
}
function smsText(){
  const td=today(),tds=S.sessions.filter(s=>ymd(new Date(s.d))===td),n=S.daily[td]||0;
  const all=TOPICS.flatMap(t=>(S.topics[t.id]||{recent:[]}).recent);
  const overall=all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length*100)+'%':'-';
  let t=`${S.name} - matma: dziś ${n} ${plural(n,'zadanie','zadania','zadań')}`;
  if(tds.length){const p=tds.reduce((a,s)=>a+s.pts,0),m=tds.reduce((a,s)=>a+s.max,0);t+=`, ${p}/${m} p. (${Math.round(p/m*100)}%)`}
  const g=tds.filter(s=>s.grade).map(s=>s.grade);
  if(g.length)t+=`, ${g.length>1?'oceny':'ocena'} ze sprawdzianu: ${g.join(', ')}`;
  else{const lt=S.sessions.filter(s=>s.grade).pop();if(lt)t+=`. Ostatni sprawdzian: ${lt.grade} (${new Date(lt.d).toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'})})`}
  t+=`. Razem ${S.count} zadań, skuteczność ${overall}, ${streak()} ${plural(streak(),'dzień','dni','dni')} z rzędu.`;
  const wk=TOPICS.filter(x=>{const a=acc(x.id);return a!=null&&a<.5}).map(x=>x.name);
  if(wk.length)t+=` Do poprawy: ${wk.slice(0,6).join(', ')}.`;
  return t;
}
let CONTACT=(()=>{try{return Object.assign({mail:'',tel:''},JSON.parse(localStorage.getItem('kontakt-v1'))||{})}catch(e){return{mail:'',tel:''}}})();
const saveContact=()=>{try{localStorage.setItem('kontakt-v1',JSON.stringify(CONTACT))}catch(e){}};

  if(kind==='mail'&&!/^\S+@\S+\.\S+$/.test(CONTACT.mail.trim())){SEND.msg='Wpisz poprawny adres e-mail.';render();return false}
  if(kind==='sms'&&telDigits().replace('+','').length<9){SEND.msg='Wpisz numer telefonu (9 cyfr).';render();return false}

function smsHref(){const t=telDigits();return`sms:${t.startsWith('+')?t:'+48'+t}?&body=${encodeURIComponent(smsText())}`}
function mailHref(){return`mailto:${CONTACT.mail.trim()}?subject=${encodeURIComponent('Wyniki z matematyki: '+S.name)}&body=${encodeURIComponent(summaryText())}`}
function sendPanel(){
  return`<section class="card stack"><h2>Wyślij zestawienie wyników</h2>
    <p class="note">Wpisz, dokąd wysłać zestawienie (zapamiętamy to na tym urządzeniu). Zestawienie uzupełnia się samo z Twoich wyników.</p>
    <label class="fld wide"><span>Adres e-mail</span><input class="sf txt" data-ct="mail" type="email" inputmode="email" autocomplete="email" autocapitalize="none" placeholder="np. imie@gmail.com" value="${esc(CONTACT.mail)}"></label>
    <label class="fld wide"><span>Numer telefonu (SMS)</span><input class="sf txt" data-ct="tel" type="tel" inputmode="tel" autocomplete="tel" placeholder="np. 600 100 200" value="${esc(CONTACT.tel)}"></label>
    <div class="row"><button class="primary" data-act="smail">Wyślij e-mailem</button><button class="primary" data-act="ssms">Wyślij SMS-em</button><button class="ghost" data-act="copy">Skopiuj zestawienie</button>${SEND.copied?'<span class="okmsg">Skopiowano</span>':''}${SEND.msg?`<span class="warn">${SEND.msg}</span>`:''}</div>
    <p class="note">Przyciski otwierają pocztę albo Wiadomości z gotowym tekstem, który trzeba jeszcze wysłać. Jeśli nic się nie otworzy, skopiuj zestawienie i wklej je do nowej wiadomości.</p>
    ${SEND.show?`<textarea class="sum-box" id="sum-box" readonly aria-label="Zestawienie wyników">${esc(summaryText())}</textarea>`:''}
  </section>`;
}

function render(){
  const nav=VIEW==='run'||VIEW==='result'?(RUN&&RUN.mode==='test'?'test':RUN&&RUN.mode==='train'?'train':''):VIEW==='ch'?'home':VIEW;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===nav));
  $('#main').innerHTML=({home:vHome,ch:vCh,train:vTrain,test:vTest,fun:vFun,progress:vProgress,run:vRun,result:vResult})[VIEW]();
}
function go(v){
  if(VIEW==='run'&&RUN&&!RUN.done&&v!=='run'){RUN.pending=v;render();scrollTo(0,0);return}
  CONFIRM_RESET=false;VIEW=v;render();scrollTo(0,0);
}

/* ---------- events ---------- */
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
$('#main').addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='name-in'){S.name=el.value.trim()||'Franek';save();return}
  if(el.dataset.ct){CONTACT[el.dataset.ct]=el.value;saveContact();SEND.msg='';return}
  if(el.dataset.k==null)return;const k=+el.dataset.k;
  if(el.dataset.ns==='w')WARM.vals[k]=el.value;
  else if(RUN){RUN.vals[RUN.i][k]=el.value;if(RUN.mode==='test'){const d=document.querySelectorAll('.dots button')[RUN.i];d&&d.classList.toggle('filled',!isEmpty(RUN.qs[RUN.i],RUN.vals[RUN.i]))}}
});
$('#main').addEventListener('change',e=>{
  if(e.target.id==='x-timer'){TEST.timer=e.target.checked;return}
  if(e.target.id==='t-path'){TRAIN.path=e.target.checked;return}
  if(e.target.tagName==='SELECT'&&e.target.dataset.k!=null){const k=+e.target.dataset.k;if(e.target.dataset.ns==='w')WARM.vals[k]=e.target.value;else if(RUN){RUN.vals[RUN.i][k]=e.target.value;if(RUN.mode==='test'){const d=document.querySelectorAll('.dots button')[RUN.i];d&&d.classList.toggle('filled',!isEmpty(RUN.qs[RUN.i],RUN.vals[RUN.i]))}}}
});
function act(a,el){
  const v=el.dataset.v;
  switch(a){
    case'go':go(v);break;
    case'weak':startRun('weak',{topics:weakTopics(),level:'auto',n:10});break;
    case'topic':startRun('train',{topics:[el.dataset.id],level:'auto',n:8});break;
    case'chopen':{const id=el.dataset.id;if(id==='k'){go('fun')}else{CHV=id;VIEW='ch';render();scrollTo(0,0)}break}
    case'chtrain':startRun('train',{topics:topicsOf(el.dataset.id).map(t=>t.id),level:'auto',n:12});focusFirst();break;
    case'chtest':TEST.chs=new Set([el.dataset.id]);go('test');break;
    case'kstart':startRun('train',{topics:['kang'],level:'auto',n:+v,path:true});focusFirst();break;
    case'ktest':TEST.chs=new Set(['k']);go('test');break;
    case'wcheck':{const q=WARM.q;if(isEmpty(q,WARM.vals)){WARM.msg=q.fields.some(fd=>fd.mark)?'Kliknij kreskę na osi.':'Wypełnij wszystkie pola.';render();return}
      const r=gradeQ(q,WARM.vals);r.verdict=verdict(r);r.lvMsg=record(q,r.pts,r.max,true);WARM.res=r;WARM.msg='';render();const b=document.querySelector('[data-act="wnext"]');b&&b.focus({preventScroll:true});break}
    case'wnext':newWarm();render();focusFirst();break;
    case'whint':WARM.hint=true;render();break;
    case'tick':{const ns=el.dataset.ns,k=+el.dataset.k,t=+el.dataset.t;if(ns==='w'){WARM.vals[k]=t;WARM.msg=''}else{RUN.vals[RUN.i][k]=t;RUN.msg=''}render();
      const g=document.querySelector(`[data-act="tick"][data-t="${t}"]`);g&&g.focus({preventScroll:true});break}
    case'tchip':{const id=el.dataset.id;TRAIN.topics.has(id)?TRAIN.topics.delete(id):TRAIN.topics.add(id);render();break}
    case'tch':{const ts=topicsOf(el.dataset.id).map(t=>t.id),on=ts.every(id=>TRAIN.topics.has(id));ts.forEach(id=>on?TRAIN.topics.delete(id):TRAIN.topics.add(id));render();break}
    case'tlv':TRAIN.level=v==='auto'?'auto':+v;render();break;
    case'tn':TRAIN.n=+v;render();break;
    case'tstart':if(TRAIN.topics.size)startRun('train',{topics:[...TRAIN.topics],level:TRAIN.level,n:TRAIN.n});focusFirst();break;
    case'xch':{const id=el.dataset.id;if(TEST.chs.has(id)){if(TEST.chs.size>1)TEST.chs.delete(id)}else TEST.chs.add(id);render();break}
    case'xlv':TEST.level=+v;render();break;
    case'xstart':startRun('test',{level:TEST.level,timer:TEST.timer,chs:[...TEST.chs]});focusFirst();break;
    case'check':doCheck();break;
    case'hint':RUN.hint[RUN.i]=true;render();break;
    case'next':doNext();break;
    case'tnext':RUN.i++;RUN.confirmEnd=false;render();focusFirst();break;
    case'prev':RUN.i--;RUN.confirmEnd=false;render();focusFirst();break;
    case'jump':RUN.i=+v;RUN.confirmEnd=false;render();focusFirst();break;
    case'hand':RUN.confirmEnd=true;render();break;
    case'handno':RUN.confirmEnd=false;render();break;
    case'handok':finishTest();break;
    case'quit':RUN.pending='home';render();scrollTo(0,0);break;
    case'quitno':RUN.pending=null;render();break;
    case'quitok':{const t=RUN.pending;clearInterval(TIMER);RUN.done=true;RUN=null;VIEW=t;render();scrollTo(0,0);break}
    case'again':if(RUN.mode==='test')startRun('test',Object.assign({},RUN.opts,{timer:!!RUN.deadline}));else startRun(RUN.mode,Object.assign({},RUN.opts,{topics:[...new Set(RUN.order)]}));focusFirst();break;
    case'fix':{const ts=v.split(',');startRun('train',{topics:ts,level:'auto',n:Math.max(6,Math.min(15,ts.length*2))});focusFirst();break}
    case'smail':if(contactOk('mail'))window.open(mailHref(),'_blank');break;
    case'ssms':if(contactOk('sms'))window.open(smsHref(),'_blank');break;
    case'copy':{const txt=summaryText();const done=ok=>{SEND.copied=ok;SEND.show=!ok;render();
        if(!ok){const b=$('#sum-box');if(b){b.focus();b.select()}}else setTimeout(()=>{SEND.copied=false;if(VIEW==='progress'||VIEW==='result')render()},2500)};
      try{navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false))}catch(e){done(false)}break}
    case'reset':CONFIRM_RESET=true;render();break;
    case'resetno':CONFIRM_RESET=false;render();break;
    case'resetok':S=blank();save();CONFIRM_RESET=false;WARM=null;render();break;
  }
}

const KEYS=['1','2','3','4','5','6','7','8','9','0','−','+','·',':','=','(',')',',','²','³'];
const KP=document.createElement('div');KP.id='kp';KP.hidden=true;
KP.innerHTML='<div class="kp-keys">'+KEYS.map(c=>`<button type="button" data-kc="${c}">${c}</button>`).join('')+'</div><div class="kp-bar"><button type="button" data-kx="del" class="kp-w" aria-label="Usuń">⌫</button><button type="button" data-kx="next" class="kp-w kp-go">Dalej ▶</button><button type="button" data-kx="sys" class="kp-w" aria-label="Pełna klawiatura">⌨</button><button type="button" data-kx="hide" class="kp-w" aria-label="Zwiń">▼</button></div>';
document.body.appendChild(KP);
const ansInputs=()=>[...document.querySelectorAll('#main input[data-k]:not([disabled])')];
function kpPad(){document.body.style.setProperty('--kph',KP.hidden?'0px':KP.offsetHeight+'px')}
function kpShow(inp){KP.hidden=false;KP.classList.toggle('sys',KBSYS);document.body.classList.add('kp-on');kpPad();
  setTimeout(()=>{try{inp.scrollIntoView({block:'center',behavior:'smooth'})}catch(_){}},60)}
function kpHide(){KP.hidden=true;document.body.classList.remove('kp-on');kpPad()}
document.addEventListener('focusin',e=>{const t=e.target;if(t.tagName!=='INPUT'||!t.closest('#main'))return;LASTIN=t;if(t.dataset.k!=null&&!t.disabled)kpShow(t);else kpHide()});
document.addEventListener('focusout',()=>setTimeout(()=>{const a=document.activeElement;if(!(a&&a.tagName==='INPUT'&&a.closest('#main')&&a.dataset.k!=null)&&!KP.contains(a))kpHide()},120));
['mousedown','pointerdown','touchstart'].forEach(ev=>KP.addEventListener(ev,e=>e.preventDefault(),{passive:false}));
KP.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  let inp=LASTIN&&document.body.contains(LASTIN)&&!LASTIN.disabled?LASTIN:ansInputs()[0];if(!inp)return;
  const x=b.dataset.kx;
  if(x==='hide'){inp.blur();kpHide();return}
  if(x==='sys'){KBSYS=!KBSYS;ansInputs().forEach(i=>i.setAttribute('inputmode',KBSYS?'decimal':'none'));KP.classList.toggle('sys',KBSYS);kpPad();inp.blur();setTimeout(()=>inp.focus(),30);return}
  if(x==='next'){const l=ansInputs(),i=l.indexOf(inp);if(i>=0&&i<l.length-1){l[i+1].focus()}else{inp.blur();kpHide()}return}
  const a=inp.selectionStart==null?inp.value.length:inp.selectionStart,z=inp.selectionEnd==null?a:inp.selectionEnd;
  let v=inp.value,pos;
  if(x==='del'){if(a!==z){v=v.slice(0,a)+v.slice(z);pos=a}else if(a>0){v=v.slice(0,a-1)+v.slice(a);pos=a-1}else return}
  else{const c=b.dataset.kc;v=v.slice(0,a)+c+v.slice(z);pos=a+c.length}
  inp.value=v;inp.focus();try{inp.setSelectionRange(pos,pos)}catch(_){}
  inp.dispatchEvent(new Event('input',{bubbles:true}));
});
$('#main').addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT'||el.tagName==='SELECT')return;act(el.dataset.act,el)});
$('#main').addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const el=e.target;
  if(el.dataset&&el.dataset.act==='tick'){e.preventDefault();act('tick',el);return}
  if(e.key!=='Enter'||el.tagName!=='INPUT'||el.dataset.k==null)return;
  e.preventDefault();
  if(el.dataset.ns==='w'){act('wcheck',el);return}
  if(!RUN)return;
  const sel='#main .fields input:not([disabled]),#main .fields select:not([disabled])';
  if(RUN.mode==='test'){const ins=[...document.querySelectorAll(sel)];const ix=ins.indexOf(el);if(ix<ins.length-1)ins[ix+1].focus();else if(RUN.i+1<RUN.n)act('tnext',el);return}
  const ins=[...document.querySelectorAll(sel)];const ix=ins.indexOf(el);
  if(ix>=0&&ix<ins.length-1)ins[ix+1].focus();else doCheck();
});

render();
</script></body></html>
