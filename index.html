<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Szkolne sprawdziany Franka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
:root{--paper:#F5F8F6;--grid:#E4EBE6;--card:#FFFFFF;--fg:#26323A;--muted:#5B6870;--line:#D4DED8;
  --red:#B8372D;--red-soft:#FBE8E5;--green:#1D7A4C;--green-soft:#E0F2E7;--amber:#97620F;--amber-soft:#FBF1DA;
  --hl:#FFF0B3;--shadow:rgba(38,50,58,.10);--bar-fg:#E8F0EE;--bar-line:rgba(255,255,255,.35);--bar-on:#FFFFFF;--bar-on-fg:#26323A;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;--body:'Nunito','Segoe UI',system-ui,sans-serif;--hand:'Caveat','Comic Sans MS',cursive}
:root{--ink:#2F6F6B;--ink-soft:#E1F0EE;--on-ink:#FFFFFF;--bar:#24504D}
:root[data-subj="hist"]{--ink:#8A5A2B;--ink-soft:#F3E8DA;--on-ink:#FFFFFF;--bar:#5E3E1E}
:root[data-subj="przyroda"]{--ink:#2E7549;--ink-soft:#E1F1E6;--on-ink:#FFFFFF;--bar:#1F5233}
:root[data-subj="english"]{--ink:#3F65AE;--ink-soft:#E3EBF8;--on-ink:#FFFFFF;--bar:#2C4A80}
:root[data-subj="math"]{--ink:#6F52A5;--ink-soft:#ECE6F6;--on-ink:#FFFFFF;--bar:#4B3A78}
@media (prefers-color-scheme: dark){:root{--paper:#141A1E;--grid:#1B2328;--card:#1B2328;--fg:#E4EBEA;--muted:#9AA8AB;--line:#2D3A40;
  --red:#FF8B80;--red-soft:#3A1F22;--green:#6CD29A;--green-soft:#16321F;--amber:#F0BC5A;--amber-soft:#382B15;
  --hl:#5E5014;--shadow:rgba(0,0,0,.45);--bar-fg:#D4E2E0;--bar-line:rgba(255,255,255,.2);--bar-on:#F2F6F5;--bar-on-fg:#141A1E;color-scheme:dark}
 :root{--ink:#8FD0CA;--ink-soft:#1E3A38;--on-ink:#101619;--bar:#1E3A38}
 :root[data-subj="hist"]{--ink:#E0B27E;--ink-soft:#3A2A18;--on-ink:#101619;--bar:#3A2A18}
 :root[data-subj="przyroda"]{--ink:#8BD1A4;--ink-soft:#17301F;--on-ink:#101619;--bar:#17301F}
 :root[data-subj="english"]{--ink:#9DB9EE;--ink-soft:#1C2B47;--on-ink:#101619;--bar:#1C2B47}
 :root[data-subj="math"]{--ink:#BBA6E8;--ink-soft:#2C2347;--on-ink:#101619;--bar:#2C2347}
}

/* Layout: zeszyt w kratkę z granatowym paskiem; jedna kolumna kartek z zadaniami, czerwony długopis do ocen */
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);box-shadow:0 2px 10px var(--shadow)}
.top-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:800;font-size:1.2rem;color:#FFFFFF;line-height:1;display:flex;align-items:baseline;gap:6px;margin-right:auto}
.brand small{font-family:var(--body);font-weight:700;font-size:.72rem;color:var(--bar-fg);letter-spacing:.06em;text-transform:uppercase}
.nav{display:grid;grid-template-columns:repeat(4,auto);gap:8px}
.nav button{border:2px solid var(--bar-line);background:transparent;padding:9px 18px;border-radius:12px;font-family:var(--display);font-weight:700;font-size:1.08rem;line-height:1.2;color:var(--bar-fg)}
.nav button:hover{border-color:var(--bar-fg);color:#FFFFFF}
.nav button.on{background:var(--bar-on);border-color:var(--bar-on);color:var(--bar-on-fg);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.nav button:focus-visible{outline-color:var(--bar-on)}
@media (max-width:620px){.nav{width:100%;grid-template-columns:repeat(4,1fr);gap:6px}.nav button{padding:11px 2px;font-size:1rem}}

main{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:800}
h2{font-size:1.3rem;font-weight:700}
p{margin:0}
.lead{color:var(--muted);max-width:60ch}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.primary,.ghost,.soft{border-radius:10px;padding:10px 18px;font-weight:800;border:2px solid var(--ink)}
.primary{background:var(--ink);color:var(--on-ink)}
.primary:hover{filter:brightness(1.08)}
.ghost{background:transparent;color:var(--ink)}
.ghost:hover{background:var(--ink-soft)}
.soft{border-color:var(--line);background:var(--card);color:var(--fg);padding:6px 12px;font-size:.9rem}
.soft:hover{border-color:var(--ink);color:var(--ink)}
.danger{border-color:var(--red);background:var(--red);color:var(--on-ink)}

/* zadanie */
.task{border:2px solid var(--ink);border-radius:18px;padding:clamp(18px,4vw,32px);box-shadow:0 6px 22px var(--shadow)}
.task-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-bottom:12px}
.tn{font-family:var(--display);font-weight:800;font-size:1.4rem}
.pts{color:var(--muted);font-variant-numeric:tabular-nums}
.pts .got{font-family:var(--hand);font-size:1.5rem;color:var(--red);line-height:1}
.tag{margin-left:auto;font-size:.85rem;font-weight:700;color:var(--ink);background:var(--ink-soft);padding:4px 12px;border-radius:999px}
.q-text{font-size:clamp(1.12rem,3.4vw,1.32rem);line-height:1.5;max-width:62ch;font-weight:600}
.q-text b{color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:grid;grid-template-columns:2.2em 1fr;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:1.06rem;font-weight:600}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt .lt{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--ink-soft);color:var(--ink)}
.opt.sel{border-color:var(--ink);background:var(--ink-soft)}
.opt.sel .lt{background:var(--ink);color:var(--on-ink)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .lt{background:var(--green);color:var(--on-ink)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .lt{background:var(--red);color:var(--on-ink)}
.opt:disabled{color:var(--fg)}
.sorts{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.srow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.srow.ok{border-color:var(--green);background:var(--green-soft)}
.srow.bad{border-color:var(--red);background:var(--red-soft)}
.si{flex:1 1 180px;min-width:0;font-weight:700;font-size:1.05rem}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.92rem;color:var(--fg)}
.chip:not(:disabled):hover{border-color:var(--ink)}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.chip.right{border-color:var(--green);background:var(--green);color:var(--on-ink)}
.chip.wrong{border-color:var(--red);background:var(--red);color:var(--on-ink);text-decoration:line-through}
.seq{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.slot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 12px;border:2px dashed var(--line);border-radius:12px;min-height:52px}
.slot.full{border-style:solid;border-color:var(--ink);background:var(--ink-soft)}
.slot.ok{border-color:var(--green);background:var(--green-soft)}
.slot.bad{border-color:var(--red);background:var(--red-soft)}
.num{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--ink);width:1.4em}
.ph{color:var(--muted);font-size:.92rem}
.fix{flex-basis:100%;font-size:.9rem;color:var(--red);font-weight:700;padding-left:2em}
.step{border:2px solid var(--ink);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 12px;font-weight:700;text-align:left}
.slot .step{background:transparent;border-color:transparent;padding:4px 2px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.pool .step:hover{background:var(--ink-soft)}
.nrow{cursor:text}
.num-in{width:7.5em;border:2px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card);font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums}
.num-in:focus{border-color:var(--ink);outline:none}
.num-in:disabled{background:transparent;color:var(--fg);opacity:1}
.unit{color:var(--muted);font-weight:700}
.nrow .fix{padding-left:0}
.tree{margin-top:14px;display:flex;flex-direction:column;gap:6px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:var(--ink-soft)}
.tr{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;justify-content:center}
.tl{flex-basis:100%;text-align:center;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tb{background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:3px 10px;font-weight:700;font-size:.95rem}
.tdesc{font-size:.92rem;font-weight:600;color:var(--fg);margin-top:4px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.acts .sp{margin-left:auto}
.acts .primary,.acts .ghost{font-size:1.1rem;padding:12px 24px}
.hint{margin-top:14px;padding:12px 16px;border-radius:10px;background:var(--amber-soft);color:var(--fg);border:1px dashed var(--amber);font-size:1.02rem}
.hint b{color:var(--amber)}
.warn{color:var(--red);font-weight:700;font-size:.92rem}
.fb{margin-top:16px;padding:16px 18px;border-radius:12px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--green-soft)} .fb.bad{background:var(--red-soft)} .fb.part{background:var(--amber-soft)}
.fb-v{font-family:var(--hand);font-size:2rem;line-height:1}
.fb.ok .fb-v{color:var(--green)} .fb.bad .fb-v{color:var(--red)} .fb.part .fb-v{color:var(--amber)}
.expl{max-width:62ch;font-size:1.03rem}
.lvmsg{font-weight:800;color:var(--ink)}

/* przebieg */
.run-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.run-top .t{font-weight:800}
.run-top .cnt{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink);background:var(--ink-soft);padding:2px 10px;border-radius:8px}
.timer.low{color:var(--red);background:var(--red-soft)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
.dots button.filled{border-color:var(--ink);color:var(--ink)}
.dots button.cur{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.confirm{border:2px solid var(--red);background:var(--red-soft);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.confirm p{flex:1 1 240px;font-weight:700}
.sheet-h{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;border-bottom:2px solid var(--fg);padding-bottom:6px}
.sheet-h b{font-family:var(--display);font-size:1.05rem}
.sheet-h span{color:var(--muted);font-size:.9rem}

/* start */
.hello{display:flex;flex-direction:column;gap:6px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.mode{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.mode:hover{border-color:var(--ink)}
.mode b{font-family:var(--display);font-size:1.25rem;line-height:1.2;color:var(--ink)}
.mode small{color:var(--muted);font-size:.9rem}
.mode .ex{font-size:.82rem;font-weight:700;color:var(--fg);margin-top:4px}
.chap{display:flex;flex-direction:column;gap:8px}
.chap h3{font-size:1rem;color:var(--muted);font-family:var(--body);font-weight:800;letter-spacing:.04em}
.tmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tchip{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
.tchip:hover{border-color:var(--ink)}
.tchip .nm{font-weight:700;font-size:.95rem;min-width:0}
.mini{grid-column:1/-1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.mini i{display:block;height:100%}
.st{font-size:.72rem;font-weight:800;padding:1px 8px;border-radius:99px;white-space:nowrap}
.st.new{background:var(--line);color:var(--muted)}
.st.low{background:var(--red-soft);color:var(--red)}
.st.mid{background:var(--amber-soft);color:var(--amber)}
.st.top{background:var(--green-soft);color:var(--green)}
.c-low{background:var(--red)} .c-mid{background:var(--amber)} .c-top{background:var(--green)}
.dim{opacity:.55;filter:grayscale(1);transition:opacity .2s,filter .2s}
.dim:hover,.dim:focus-within{opacity:1;filter:none}

/* ustawienia */
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tc{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.9rem}
.tc.on{border-color:var(--ink);background:var(--ink-soft);color:var(--ink)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:800;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--on-ink)}
.lbl{font-weight:800;font-size:.95rem}
.note{font-size:.88rem;color:var(--muted)}
.switch{display:flex;gap:10px;align-items:center;font-weight:700}
.switch input{width:20px;height:20px;accent-color:var(--ink)}

/* wynik */
.res-top{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.stamp{width:124px;height:124px;border:3px solid var(--red);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--red);font-family:var(--hand);transform:rotate(-8deg);flex:none}
.stamp b{font-size:4.2rem;line-height:.8;font-weight:700}
.stamp span{font-size:1.3rem;line-height:1}
.big{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:1.1rem;color:var(--muted);font-weight:700}
.scale{font-size:.82rem;color:var(--muted)}
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{border:1px solid var(--line);border-radius:10px;background:var(--card)}
.ritem summary{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;list-style:none}
.ritem summary::-webkit-details-marker{display:none}
.ritem .mark{font-family:var(--hand);font-size:1.5rem;line-height:1;width:1.2em;text-align:center}
.ritem .mark.y{color:var(--green)} .ritem .mark.n{color:var(--red)} .ritem .mark.p{color:var(--amber)}
.ritem .rp{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted)}
.ritem .rb{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line)}
.ritem .rb .q-text{font-size:1.05rem}
.ritem .rb .opt{font-size:.95rem;padding:7px 10px}

/* postępy */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-family:var(--display);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.82rem;color:var(--muted);font-weight:700}
.ttable{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(70px,1fr) 3.2em auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .nm{font-weight:700;font-size:.95rem}
.trow .pc{font-variant-numeric:tabular-nums;font-weight:800;text-align:right}
.lvdots{display:flex;gap:3px}
.lvdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.lvdots i.on{background:var(--ink)}
@media (max-width:520px){ .trow{grid-template-columns:minmax(0,1fr) auto auto;} .trow .mini{grid-column:1/-1;order:5} .trow .lvdots{display:none} }
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .gt{fill:var(--muted);font:600 11px var(--body)}
.chart .bt{fill:var(--ink)} .chart .bx{fill:var(--red)}
.chart .vl{fill:var(--fg);font:800 11px var(--body);text-anchor:middle}
.chart .gr{fill:var(--red);font:700 17px var(--hand);text-anchor:middle}
.legend{display:flex;gap:16px;font-size:.82rem;color:var(--muted);font-weight:700;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:7.5em 1fr auto auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem;align-items:center}
.hrow:last-child{border-bottom:0}
.hrow .d{color:var(--muted);font-variant-numeric:tabular-nums}
.hrow .s{font-variant-numeric:tabular-nums;font-weight:800}
.hrow .g{font-family:var(--hand);color:var(--red);font-size:1.4rem;line-height:1;min-width:1.4em;text-align:center}
.name-in{border:2px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card);width:12em;max-width:100%}
a.primary,a.ghost{display:inline-block;text-decoration:none}
.sum-box{width:100%;min-height:180px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:10px;background:var(--card);color:var(--fg);resize:vertical}
.okmsg{color:var(--green);font-weight:800}
.mail{font-weight:800;user-select:all}
.empty{padding:18px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:12px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

body{background-image:none}
.top{box-shadow:0 1px 6px var(--shadow)}
.back{border:2px solid var(--bar-line);background:transparent;color:var(--bar-fg);border-radius:10px;padding:6px 12px;font-weight:800;font-size:.95rem}
.back:hover{border-color:var(--bar-fg);color:#fff}
.brand .ic{font-size:1.3rem;margin-right:2px}
.nav button.on{color:var(--bar)}
/* hub */
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.subj{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;min-height:190px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.subj::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--c)}
.subj:hover{transform:translateY(-3px);border-color:var(--c)}
.subj:focus-visible{outline-color:var(--c)}
.subj .big-ic{font-size:3rem;line-height:1;width:76px;height:76px;border-radius:20px;background:var(--cs);display:flex;align-items:center;justify-content:center}
.subj b{font-family:var(--display);font-size:1.55rem;line-height:1.1;color:var(--c)}
.subj small{color:var(--muted);font-size:.92rem}
.subj .meta{margin-top:auto;font-size:.85rem;font-weight:800;color:var(--fg)}
.subj .mbar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.subj .mbar i{display:block;height:100%;background:var(--c);border-radius:99px}
/* matematyka */
.expr{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,6vw,2.4rem);margin:10px 0 2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.expr sup,.q-text sup{font-size:.6em}
.box{display:inline-block;min-width:1.3em;height:1.05em;border:2px dashed var(--ink);border-radius:4px;vertical-align:-.12em;color:transparent;line-height:1}
.axis{overflow-x:auto;margin-top:12px}
.axis svg{width:100%;min-width:420px;max-width:640px;height:auto;display:block}
.axis .ax,.axis .tk{stroke:var(--fg);stroke-width:2}
.axis .axh{fill:var(--fg)}
.axis .lb{fill:var(--fg);font:700 18px var(--body);text-anchor:middle}
.axis .lb.ans{fill:var(--green)}
.axis .pt{fill:var(--ink)}
.axis .pl{fill:var(--ink);font:800 18px var(--display);text-anchor:middle}
.axis .hit{cursor:pointer}
.axis .mk{fill:transparent;stroke:transparent;stroke-width:2}
.axis .hit:hover .mk,.axis .hit:focus .mk{stroke:var(--ink)}
.axis .sel .mk{fill:var(--ink)}
.axis .right .mk{fill:var(--green);stroke:var(--green)}
.axis .wrong .mk{fill:var(--red)}
</style>
</head>

  <nav class="nav" id="nav" aria-label="Widoki" hidden>
    <button data-go="home">Start</button>
    <button data-go="train">Trening</button>
    <button data-go="test">Sprawdzian</button>
    <button data-go="progress">Postępy</button>
  </nav>
</div></header>
<main id="main"></main>

<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[Math.floor(Math.random()*a.length)];
const plural=(n,a,b,c)=>{if(n===1)return a;const u=n%10,t=n%100;return(u>=2&&u<=4&&(t<12||t>14))?b:c};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pickN=(a,n)=>shuffle(a).slice(0,n);
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
const LV={1:'łatwy',2:'średni',3:'trudny'};
const CUR=new Date().getFullYear();

/* liczby rzymskie i wieki */
const toRoman=n=>{const m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const[v,r]of m)while(n>=v){s+=r;n-=v}return s};
const fromRoman=s=>{const v={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};let n=0;for(let i=0;i<s.length;i++){const a=v[s[i]],b=v[s[i+1]];if(!a)return NaN;n+=b>a?-a:a}return toRoman(n)===s?n:NaN};
const cent=y=>Math.ceil(y/100);
const rk=(y,bc,ne)=>`${y} roku${bc?' p.n.e.':ne?' n.e.':''}`;
const near=(ok,extra=[])=>{const c=[...new Set([ok+1,ok-1,ok+10,ok-10,ok+2,ok-2,ok+5,...extra].filter(x=>x>0&&x!==ok))];return pickN(c,3).map(String)};
const rnear=n=>{const ok=toRoman(n);const c=[...new Set([n+1,n-1,n+2,n-2,n+10,n-10,n+5,n-5].filter(x=>x>0).map(toRoman).filter(x=>x!==ok))];return pickN(c,3)};
const wnear=(c,bc)=>{const ok=toRoman(c)+(bc?' p.n.e.':'');const cs=[...new Set([c+1,c-1,c+2,c-2].filter(x=>x>0))];return pickN(cs,3).map(x=>toRoman(x)+(bc?' p.n.e.':''))};

/* ---------- typy zadań ---------- */
function D(l,fn){return{l,f:()=>{const o=fn();const opts=shuffle([o.ok,...o.bad]);return{type:'one',html:o.q,opts,fields:[{ans:opts.indexOf(o.ok)}],expl:o.expl,hint:o.hint,key:o.q}}}}
const O=(l,q,ok,bad,expl,hint)=>D(l,()=>({q,ok,bad,expl,hint}));
function SQ(l,q,cats,pool,n,expl,hint){return{l,f:()=>{
  let ch=[];cats.forEach((c,ci)=>{const g=pool.filter(p=>p[1]===ci);if(g.length&&ch.length<n)ch.push(P(g))});
  ch=ch.concat(pickN(pool.filter(p=>!ch.includes(p)),n-ch.length));ch=shuffle(ch);
  const ex=typeof expl==='function'?expl(ch,cats):expl;
  return{type:'sort',html:q,cats,fields:ch.map(p=>({item:p[0],ans:p[1]})),expl:ex,hint,key:q+ch.map(p=>p[0]).join('|')}}}}
function Ord(l,q,steps,expl,hint){return{l,f:()=>{let s;do{s=shuffle(steps.map((_,i)=>i))}while(s.every((v,i)=>v===i));
  return{type:'order',html:q,steps,shuf:s,fields:steps.map((_,k)=>({ans:k})),expl,hint,key:q+Math.random()}}}}
const SQd=(l,q,cats,poolFn,n,expl,hint)=>({l,f:()=>SQ(l,q,cats,poolFn(),n,expl,hint).f()});
const OrdD=(l,q,genFn)=>({l,f:()=>{const g=genFn();return Ord(l,q,g.steps,g.expl,g.hint).f()}});
const NM=(l,fn)=>({l,f:()=>{const o=fn();return{type:'num',html:o.q,fields:o.fields,expl:o.expl,hint:o.hint,key:o.q}}});
const F=(label,ans,kind,more)=>Object.assign({label,ans,kind:kind||'n'},more||{});
const listExpl=(ch,cats)=>ch.map(p=>`${p[0]} – ${cats[p[1]]}`).join('; ')+'.';

/* sprawdzanie odpowiedzi liczbowych: n = liczba, w = wiek (rzymski lub arabski), r = liczba rzymska */
function chk(fd,raw){
  if(fd.kind==='t'){const n=x=>String(x==null?'':x).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.!?]+$/,'');return [fd.ans,...(fd.alts||[])].map(n).includes(n(raw))}
  let s=String(raw==null?'':raw).trim().toUpperCase().replace(/\s+/g,' ');
  s=s.replace(/\b(WIEK|LAT|LATA|DNI|DZIEŃ|KM|WIEKÓW|WIEKI|P\.N\.E\.|N\.E\.)\b/g,'').replace(/\./g,'').replace(/\s+/g,' ').trim();
  if(fd.kind==='r')return s.replace(/\s/g,'')===fd.ans;
  if(fd.kind==='w'){if(/^\d+$/.test(s))return+s===fd.ans;return fromRoman(s.replace(/\s/g,''))===fd.ans}
  s=s.replace(/ /g,'');return /^\d+$/.test(s)&&+s===fd.ans;
}

const SUBJECTS={};
SUBJECTS.hist=(()=>{
const TOPICS=[
 {id:'hist',ch:1,name:'Co to jest historia',hint:'Historia to przeszłość, opowieść o niej i nauka o przeszłości. Historycy badają ludzi, którzy żyli naprawdę, i wydarzenia, do których naprawdę doszło, a najważniejsza jest dla nich prawda. W baśniach bohaterowie i zdarzenia są wymyślone, w legendach prawda miesza się z nieprawdą. Historia pomaga zrozumieć świat i przewidywać skutki działań.'},
 {id:'zrodla',ch:1,name:'Rodzaje źródeł historycznych',hint:'Źródłem jest każdy ślad działalności człowieka. Materialne pisane: książki, kroniki, dokumenty, listy, gazety, mapy. Materialne niepisane: budowle, obrazy, rzeźby, odzież, zdjęcia, przedmioty. Niematerialne: tradycja, obyczaje, przekazy ustne. Archeolodzy szukają materialnych śladów na wykopaliskach.'},
 {id:'wiary',ch:1,name:'Wiarygodność źródeł i praca historyka',hint:'Wiarygodność źródła to na ile zawarte w nim informacje są pewne. Historyk ustala, kto, kiedy i w jakim celu je stworzył, porównuje je z innymi źródłami i ustaleniami archeologów. Fakt można sprawdzić, a opinia to czyjś pogląd.'},
 {id:'przyczyny',ch:1,name:'Przyczyny i skutki',hint:'Przyczyny: dlaczego do czegoś doszło. Skutki: co z tego wynikło. Związki przyczynowo-skutkowe to zależności między wydarzeniami, w których jedno prowadziło do drugiego (np. wynalezienie druku przez Gutenberga).'},
 {id:'rodzina',ch:2,name:'Jak poznać historię rodziny',hint:'Źródła wiedzy o rodzinie: opowieści krewnych i pamiątki rodzinne (zdjęcia, dokumenty, listy, przedmioty codziennego użytku). Krewni mają wspólnego przodka.'},
 {id:'drzewo',ch:2,name:'Drzewo genealogiczne',hint:'Najstarsi przodkowie są na dole (pień), najmłodsi na górze. Obrączki łączą małżonków. Genealogia bada historię rodziny.'},
 {id:'tradycje',ch:2,name:'Tradycje rodzinne',hint:'Tradycja to zwyczaje, wspólny zawód, zamiłowania, przepisy. Wzmacnia więzi i pozwala utrzymać bliski kontakt.'},
 {id:'chrono',ch:3,name:'Chronologia i oś czasu',hint:'Chronologia to nauka o mierzeniu czasu. Porządek chronologiczny: od najdawniejszego do najnowszego. Na osi czasu najstarsze po lewej, najnowsze po prawej.'},
 {id:'jedn',ch:3,name:'Jednostki czasu',hint:'Rok = 365 lub 366 dni, wiek (stulecie) = 100 lat, tysiąclecie = 1000 lat = 10 wieków.'},
 {id:'ery',ch:3,name:'Ery i prehistoria',hint:'Nasza era (n.e.) liczy się od narodzin Jezusa z Nazaretu, wcześniejsze czasy to p.n.e. Nie było roku zerowego. Historia zaczyna się od wynalezienia pisma, wcześniej była prehistoria.'},
 {id:'epoki',ch:3,name:'Epoki historyczne',hint:'Starożytność (ok. 3400 p.n.e. – 476), średniowiecze (476 – 1492), nowożytność (1492 – 1918), współczesność (od 1918).'},
 {id:'rzym',ch:3,name:'Liczby rzymskie',hint:'I = 1, V = 5, X = 10, L = 50, C = 100, D = 500, M = 1000. Mniejsza cyfra przed większą się odejmuje (IV = 4, IX = 9, XL = 40).'},
 {id:'oblicz',ch:4,name:'Obliczanie upływu lat',hint:'Ta sama era n.e.: późniejsza − wcześniejsza. P.n.e.: wcześniejsza (większa) − późniejsza (mniejsza). Różne ery: dodaj obie daty i odejmij 1.'},
 {id:'wiek',ch:4,name:'Który to wiek',hint:'Odrzuć dwie ostatnie cyfry i dodaj 1 (1410 → 14 + 1 → XV wiek). Jeśli rok kończy się dwoma zerami, nie dodajesz 1 (1400 → XIV wiek). Dotyczy też p.n.e.'},
 {id:'zegary',ch:5,name:'Jak dawniej mierzono czas',hint:'Słońce i cień (zegar słoneczny), klepsydra z piaskiem, zegary mechaniczne ze średniowiecza (ciężarki, koła zębate, dzwony), zegarki kieszonkowe, na rękę, cyfrowe.'},
 {id:'kal',ch:5,name:'Kalendarz',hint:'Księżycowy (ok. 29 dni, 12 miesięcy) → egipski (365 dni) → juliański (Juliusz Cezar, 29 lutego co 4 lata) → gregoriański (Grzegorz XIII, 1582, pominięto 10 dni).'}
];
const T=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const CHAPTERS={1:'Lekcje 1–2: Historia, źródła, przyczyny i skutki',2:'Lekcja 3: Historia mojej rodziny',3:'Lekcja 4: Czas w historii',4:'Lekcja 5: Obliczanie czasu w historii',5:'Tajemnice sprzed wieków'};

/* ---------- drzewo genealogiczne ---------- */
const treeHTML=(rows,desc)=>`<div class="tree">${rows.map((r,i)=>`<div class="tr">${i===0?'<span class="tl">góra – najmłodsi</span>':''}${i===rows.length-1?'<span class="tl">dół – najstarsi</span>':''}${r.map(b=>`<span class="tb">${b}</span>`).join('')}</div>`).join('')}<p class="tdesc">${desc}</p></div>`;
const FEM=['Anna','Joanna','Kasia','Teresa','Helena','Zofia','Maria','Ewa','Halina','Irena','Jadwiga','Ola','Danuta','Krystyna'];
const MAS=['Tomasz','Piotr','Stefan','Zbigniew','Jan','Kuba','Marek','Adam','Henryk','Paweł','Ryszard','Andrzej','Józef','Leon'];
function fam(){const f=pickN(FEM,5),m=pickN(MAS,5);return{sis:f[0],mama:f[1],bab:f[2],sb:f[3],pb:f[4],bro:m[0],tata:m[1],stryj:m[2],dz:m[3],pd:m[4]}}
const famHTML=p=>treeHTML([[p.sis,'Ja',p.bro],[`${p.mama} 💍 ${p.tata}`,p.stryj],[p.sb,`${p.bab} 💍 ${p.dz}`],[`${p.pb} 💍 ${p.pd}`]],
  `💍 = małżeństwo. ${p.pb} i ${p.pd} mają córki: ${p.sb} i ${p.bab}. ${p.bab} i ${p.dz} mają synów: ${p.tata} i ${p.stryj}. ${p.tata} i ${p.mama} mają dzieci: ${p.sis}, Ja i ${p.bro}.`);
const ROLES_JA=['siostra','brat','mama','tata','stryj (brat taty)','babcia','dziadek','siostra babci','prababcia','pradziadek'];
const ROLES_TATA=['mama','tata','brat','ciocia (siostra mamy)','babcia','dziadek','żona','syn'];
function famRole(l){return D(l,()=>{const p=fam();
  if(l===3){const c=[['bab','mama'],['dz','tata'],['stryj','brat'],['sb','ciocia (siostra mamy)'],['pb','babcia'],['pd','dziadek']],x=P(c);
    return{q:famHTML(p)+`<br>Kim jest <b>${p[x[0]]}</b> dla osoby o imieniu <b>${p.tata}</b>?`,ok:x[1],bad:pickN(ROLES_TATA.filter(r=>r!==x[1]),3),expl:`${p[x[0]]} to ${x[1]} dla osoby ${p.tata}. ${p.tata} jest synem ${p.bab} i ${p.dz}, więc jego rodzicami są oni, a siostra jego mamy to ciocia.`}}
  const pool=l===1?[['sis','siostra'],['bro','brat'],['mama','mama'],['tata','tata'],['bab','babcia'],['dz','dziadek']]:[['stryj','stryj (brat taty)'],['pb','prababcia'],['pd','pradziadek'],['sb','siostra babci'],['bab','babcia'],['dz','dziadek']];
  const x=P(pool);return{q:famHTML(p)+`<br>Kim jest <b>${p[x[0]]}</b> dla osoby „Ja”?`,ok:x[1],bad:pickN(ROLES_JA.filter(r=>r!==x[1]),3),expl:`${p[x[0]]} to ${x[1]} osoby „Ja”. Czytaj drzewo od dołu: starsze pokolenia mają dzieci poziom wyżej.`}})}

/* ---------- dane z podręcznika ---------- */
const POSTACIE=[['Maria Skłodowska-Curie',0],['Mikołaj Kopernik',0],['Kazimierz Wielki',0],['Juliusz Cezar',0],['Krzysztof Kolumb',0],['Kleopatra VII',0],['Bolesław Chrobry',0],['Halina Konopacka',0],['Czerwony Kapturek',1],['Syrenka Warszawska',1],['Smok Wawelski',1]];
const SRC=[['książka',0],['dokument',0],['gazeta',0],['paszport dziadka',0],['średniowieczna kronika',0],['list sprzed wielu lat',0],['ruiny zamku',1],['starożytny miecz',1],['budowla',1],['dzieło sztuki',1],['dawny przedmiot codziennego użytku',1],['taniec ludowy',2],['tradycja rodzinna',2],['obyczaj',2],['opowieść przekazywana ustnie',2],['mapa',0],['zbiór praw',0],['napis na pomniku',0],['pamiętnik',0],['obraz',1],['rzeźba',1],['biżuteria',1],['zdjęcie',1],['film',1],['pieśń',2],['zwyczaje wigilijne',2]];
const SRCN=['materialne pisane','materialne niepisane','niematerialne'];
const TRAD=['wspólne obchody świąt','wykonywanie w rodzinie tego samego zawodu','zamiłowanie do muzyki lub sportu','przepis na ulubione ciasto przekazywany przez dziesięciolecia','coroczne wspólne wyjazdy'];
const NOTRAD=['jednorazowa wycieczka klasowa','przypadkowa rozmowa z nieznajomym','zakupy w sklepie','nowy film w kinie'];
const EV=[
 {t:'wynalezienie pisma (ok. 3400 r. p.n.e.)',v:-3400},{t:'śmierć Juliusza Cezara (44 r. p.n.e.)',v:-44},
 {t:'pierwsze igrzyska w Koloseum (80 r. n.e.)',v:80},{t:'upadek Rzymu (476 r.)',v:476},
 {t:'wynalezienie druku przez Gutenberga (połowa XV w.)',v:1450},{t:'zdobycie Konstantynopola przez Turków (1453 r.)',v:1453},
 {t:'odkrycie Ameryki przez Kolumba (1492 r.)',v:1492},{t:'Kopernik ogłasza, że Ziemia kręci się wokół Słońca (1543 r.)',v:1543},
 {t:'koniec I wojny światowej (1918 r.)',v:1918}];
const EPO=['starożytność','średniowiecze','nowożytność','współczesność'];
const EPDESC=[['czasy pierwszych państw',0],['czasy piramid i faraonów',0],['czasy potęgi Cesarstwa Rzymskiego',0],['czasy zamków i katedr',1],['czasy początków państwa polskiego',1],['czasy narodzin uniwersytetów',1],['czasy wielkich odkryć geograficznych',2],['czasy rozwoju nauki',2],['czasy maszyny parowej, fabryk i kolei',2],['czasy rozwoju komunikacji i technologii',3],['czasy podboju kosmosu',3],['czasy komputerów i internetu',3]];
const epokaOf=(y,bc)=>bc||y<476?0:y<1492?1:y<1918?2:3;
const PAIRS=[['ok. 3400 roku p.n.e.','wynalezienie pisma'],['476 roku','upadek Rzymu'],['1492 roku','odkrycie Ameryki'],['1918 roku','koniec I wojny światowej']];
const WHO=['Pewien król','Pewien wódz','Pewien filozof','Pewien cesarz','Pewien poeta'];

const B={
hist:[
 O(1,'Które trzy znaczenia ma słowo „historia”?','przeszłość, opowieść i nauka o przeszłości',['przeszłość, przyszłość i teraźniejszość','książka, film i gra','wydarzenie, data i miejsce'],'Historia to przeszłość, opowieść o niej, a także nauka o przeszłości.'),
 O(1,'Czym zajmują się historycy?','badają losy ludzi, którzy żyli naprawdę, i opisują wydarzenia, do których naprawdę doszło',['wymyślają legendy i bajki o dawnych czasach','badają tylko rośliny i zwierzęta','przepowiadają przyszłość'],'Historycy badają postacie historyczne, opisują prawdziwe wydarzenia i czerpią wiedzę ze źródeł historycznych.'),
 O(1,'Skąd historycy czerpią wiedzę o przeszłości?','ze źródeł historycznych',['z własnych wymysłów','z prognoz pogody','z kolorowych ilustracji w bajkach'],'Źródła historyczne to np. książki, dokumenty, budowle, przedmioty i opowieści.'),
 SQ(1,'Postać historyczna czy postać z legendy lub bajki?',['postać historyczna','postać z legendy lub bajki'],POSTACIE,4,listExpl),
 SQ(2,'Postać historyczna czy postać z legendy lub bajki?',['postać historyczna','postać z legendy lub bajki'],POSTACIE,6,listExpl),

SUBJECTS.math=(()=>{
const TOPICS=[
 {id:'addsub',ch:1,name:'Dodawanie i odejmowanie',hint:'Dodawaj i odejmuj osobno tysiące, setki, dziesiątki i jedności. Sprawdź wynik działaniem odwrotnym.'},
 {id:'muldiv',ch:1,name:'Mnożenie i dzielenie',hint:'Rozłóż liczbę na dziesiątki i jedności. Dzielenie sprawdzaj mnożeniem.'},
 {id:'rem',ch:1,name:'Dzielenie z resztą',hint:'Reszta musi być mniejsza od dzielnika.'},
 {id:'word',ch:1,name:'Zadania tekstowe',hint:'Zastanów się, co jest dane, a co trzeba obliczyć. Policz po kolei.'},
 {id:'line',ch:1,name:'Oś liczbowa',hint:'Najpierw oblicz, ile wynosi jedna działka.'},
 {id:'factor',ch:1,name:'Brakujący czynnik',hint:'Brakujący czynnik to iloczyn podzielony przez znany czynnik.'},
 {id:'pow',ch:1,name:'Kwadrat i sześcian',hint:'Kwadrat liczby to a · a, a sześcian to a · a · a.'},
 {id:'diff',ch:1,name:'O ile więcej, o ile mniej',hint:'„O ile” to dodawanie lub odejmowanie. Zastanów się, która liczba jest większa.'},
 {id:'neigh',ch:1,name:'Działania na opisanych liczbach',hint:'Najpierw znajdź drugą liczbę, potem wykonaj działanie.'},
 {id:'age',ch:1,name:'Zadania o wieku',hint:'Różnica wieku między dwiema osobami nigdy się nie zmienia.'},
 {id:'times',ch:1,name:'Ile razy więcej, ile mniej',hint:'„O … więcej/mniej” to dodawanie lub odejmowanie, „… razy więcej/mniej” to mnożenie lub dzielenie.'},
 {id:'order',ch:1,name:'Kolejność działań',hint:'Nawiasy, potęgi, mnożenie i dzielenie od lewej, na końcu dodawanie i odejmowanie.'},
 {id:'puzzle',ch:1,name:'Zagadki liczbowe',hint:'Zastanów się, o ile zmieniła się suma. To podpowiada, ile wynosi szukana liczba.'}
];
const T=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const CHAPTERS={1:'Zadania ze sprawdzianu'};
const f=n=>Number(n).toLocaleString('pl-PL');
const lat=n=>plural(n,'rok','lata','lat');
const ex=s=>`<div class="expr">${s}</div>`;
const BOX='<span class="box" aria-label="okienko">□</span>';
const sq=n=>`${n}<sup>2</sup>`, cu=n=>`${n}<sup>3</sup>`;
const NF=['Kasia','Ola','Zosia','Lena','Julia','Hania'], NMn=['Franek','Kuba','Tymek','Staś','Antek','Marek'];
const G={
addsub(L){
  const v=R(0,2);
  if(v===0){
    const big=L===3,tot=big?1000:100;
    const x=big?R(101,899):R(11,89),z=big?R(101,899):R(11,89),y=tot-x,w=tot-z;
    const ord=L===1?[x,y,z,w]:[x,z,y,w],s=x+y+z+w;
    return{html:'Oblicz w pamięci.'+ex(ord.map(f).join(' + ')+' ='),fields:[{ans:s}],
      hint:`Poszukaj dwóch par liczb, które razem dają ${f(tot)}.`,
      expl:`Łączymy składniki w pary: (${f(x)} + ${f(y)}) + (${f(z)} + ${f(w)}) = ${f(tot)} + ${f(tot)} = ${f(s)}.`};
  }
  if(L===3&&R(0,1)){
    const a=R(200,900),b=R(150,600),c=R(100,a+b-50),s1=a+b;
    return{html:'Oblicz.'+ex(`${f(a)} + ${f(b)} − ${f(c)} =`),fields:[{ans:s1-c}],hint:'Gdy są tylko dodawanie i odejmowanie, liczysz po kolei od lewej.',
      expl:`${f(a)} + ${f(b)} = ${f(s1)}, potem ${f(s1)} − ${f(c)} = ${f(s1-c)}.`};
  }
  const add=v===1;let a,b;
  if(L===1){if(add){a=R(11,70);b=R(10,99-a)}else{a=R(30,99);b=R(11,a-5)}}
  else if(L===2){if(add){a=R(105,699);b=R(105,999-a)}else{a=R(300,999);b=R(101,a-20)}}
  else{if(add){a=R(1050,6999);b=R(1050,9999-a)}else{a=R(3000,9999);b=R(1050,a-100)}}
  const res=add?a+b:a-b,op=add?'+':'−';let expl;
  if(L===1){const bt=b-b%10,bu=b%10,m=add?a+bt:a-bt;
    expl=bu?`Rozkładamy ${b} na ${bt} i ${bu}: ${a} ${op} ${bt} = ${m}, a ${m} ${op} ${bu} = ${res}.`:`${a} ${op} ${b} = ${res}.`}
  else expl=add?`${f(a)} + ${f(b)} = ${f(res)}. Sprawdzenie: ${f(res)} − ${f(b)} = ${f(a)}.`:`${f(a)} − ${f(b)} = ${f(res)}. Sprawdzenie: ${f(res)} + ${f(b)} = ${f(a)}.`;
  return{html:'Oblicz.'+ex(`${f(a)} ${op} ${f(b)} =`),fields:[{ans:res}],
    hint:add?'Dodawaj osobno tysiące, setki, dziesiątki i jedności.':'Możesz odjąć najpierw pełne setki lub dziesiątki, a potem resztę.',expl};
},
muldiv(L){
  if(R(0,1)){
    let a,b;if(L===1){a=R(2,5);b=R(11,25)}else if(L===2){a=R(3,9);b=R(24,99)}else{a=R(12,29);b=R(11,25)}
    const bt=b-b%10,bu=b%10,p=a*b;
    return{html:'Oblicz.'+ex(`${a} · ${b} =`),fields:[{ans:p}],
      hint:bu?`Rozłóż ${b} na ${bt} i ${bu}. Pomnóż każdą część przez ${a} i dodaj wyniki.`:`Pomnóż ${a} przez ${bt/10} i dopisz zero.`,
      expl:bu?`${a} · ${b} = ${a} · ${bt} + ${a} · ${bu} = ${f(a*bt)} + ${f(a*bu)} = ${f(p)}.`:`${a} · ${b} = ${f(p)}.`};
  }
  let d,q;if(L===1){d=R(2,9);q=R(6,20)}else if(L===2){d=R(11,25);q=R(2,9)}else{d=R(12,40);q=R(11,30)}
  const n=d*q;
  return{html:'Oblicz.'+ex(`${f(n)} : ${d} =`),fields:[{ans:q}],hint:`Szukasz liczby, która pomnożona przez ${d} da ${f(n)}.`,
    expl:`${f(n)} : ${d} = ${q}, bo ${d} · ${q} = ${f(n)}.`};
},
rem(L){
  let d,q;if(L===1){d=R(3,9);q=R(3,10)}else if(L===2){d=R(6,12);q=R(6,15)}else{d=R(11,25);q=R(8,20)}
  const r=R(1,d-1),n=d*q+r;
  return{html:'Wykonaj dzielenie z resztą.'+ex(`${f(n)} : ${d} =`),fields:[{label:'Wynik',ans:q},{label:'Reszta',ans:r}],
    hint:`Znajdź największą wielokrotność liczby ${d}, która nie przekracza ${f(n)}. Reszta musi być mniejsza od ${d}.`,
    expl:`${d} · ${q} = ${f(d*q)}, a ${f(n)} − ${f(d*q)} = ${r}. Zatem ${f(n)} : ${d} = ${q} r. ${r}. Reszta ${r} jest mniejsza od ${d}, więc wynik jest dobry.`};
},
word(L){
  const T1=[
    ()=>{const n=R(12,40),k=R(2,6),nm=P(['Tadeusz','Józef','Adam','Zbigniew']);
      return{html:`Pan ${nm} zrobił drewniany płot składający się z ${n} sztachet. Do przymocowania jednej sztachety zużył ${k} ${plural(k,'wkręt','wkręty','wkrętów')}. Ile wkrętów zużył na cały płot?`,
      ans:n*k,label:'Liczba wkrętów',hint:'Każda sztacheta potrzebuje tyle samo wkrętów. Które działanie pasuje: dodawanie czy mnożenie?',expl:`${n} sztachet po ${k} ${plural(k,'wkręt','wkręty','wkrętów')}: ${n} · ${k} = ${n*k}.`}},
    ()=>{const n=R(3,9),k=R(5,21);
      return{html:`W jednym pudełku jest ${k} kredek. Ile kredek jest w ${n} takich pudełkach?`,ans:n*k,label:'Liczba kredek',
      hint:'Wszystkie pudełka mają tyle samo kredek.',expl:`${n} · ${k} = ${n*k}.`}},
    ()=>{const n=R(3,9),e=R(4,12),t=n*e;
      return{html:`${t} ${plural(t,'cukierek','cukierki','cukierków')} zapakowano po równo do ${n} torebek. Ile cukierków jest w jednej torebce?`,ans:e,label:'W jednej torebce',
      hint:'Dzielimy po równo, więc potrzebne jest dzielenie.',expl:`${t} : ${n} = ${e}, bo ${n} · ${e} = ${t}.`}}
  ];
  const T2=[
    ()=>{const c=P([12,15,18,20,25]);let s;do{s=R(40,130)}while(s%c===0);const q=Math.floor(s/c),r=s%c;
      return{html:`Na wycieczkę jedzie ${s} ${plural(s,'osoba','osoby','osób')}. W jednym busie mieści się ${c} pasażerów. Ile co najmniej busów trzeba zamówić?`,ans:q+1,label:'Liczba busów',
      hint:'Podziel z resztą. Pomyśl, co zrobić z osobami, które zostaną.',expl:`${s} : ${c} = ${q} r. ${r}. W ${q} ${plural(q,'busie','busach','busach')} zmieści się ${q*c} osób, a ${r} ${plural(r,'osoba zostanie','osoby zostaną','osób zostanie')}. Potrzebny jest jeszcze jeden bus: ${q} + 1 = ${q+1}.`}},
    ()=>{const p=R(3,9),q=R(2,6),a=R(3,8),b=R(2,6);
      return{html:`Zeszyt kosztuje ${p} zł, a długopis ${q} zł. Ile złotych trzeba zapłacić za ${a} ${plural(a,'zeszyt','zeszyty','zeszytów')} i ${b} ${plural(b,'długopis','długopisy','długopisów')}?`,ans:a*p+b*q,label:'Złotych',
      hint:'Policz osobno zeszyty i długopisy, a potem dodaj.',expl:`Zeszyty: ${a} · ${p} = ${a*p} zł. Długopisy: ${b} · ${q} = ${b*q} zł. Razem: ${a*p} + ${b*q} = ${a*p+b*q} zł.`}},
    ()=>{const k=R(3,6),n=R(14,45),t=n*k;
      return{html:`Na wykonanie płotu zużyto ${t} ${plural(t,'wkręt','wkręty','wkrętów')}, po ${k} na każdą sztachetę. Z ilu sztachet składa się płot?`,ans:n,label:'Liczba sztachet',
      hint:'Wiesz, ile było wszystkich wkrętów i ile idzie na jedną sztachetę.',expl:`${t} : ${k} = ${n}, bo ${k} · ${n} = ${t}.`}}
  ];
  const T3=[
    ()=>{const a=R(2,5),p=R(3,7),b=R(2,4),q=R(4,8),cost=a*p+b*q,m=Math.ceil((cost+1)/50)*50;
      return{html:`Mama miała ${m} zł. Kupiła ${a} kg jabłek po ${p} zł za kilogram i ${b} bochenki chleba po ${q} zł. Ile złotych reszty otrzymała?`,ans:m-cost,label:'Reszta (zł)',
      hint:'Najpierw oblicz, ile kosztowały wszystkie zakupy.',expl:`Jabłka: ${a} · ${p} = ${a*p} zł. Chleb: ${b} · ${q} = ${b*q} zł. Zakupy: ${a*p} + ${b*q} = ${cost} zł. Reszta: ${m} − ${cost} = ${m-cost} zł.`}},
    ()=>{let n,k,d;do{n=R(150,320);k=R(12,25);d=R(3,8)}while(k*d>=n);const nm=P(NMn);
      return{html:`Książka ma ${n} ${plural(n,'stronę','strony','stron')}. ${nm} czyta codziennie ${k} ${plural(k,'stronę','strony','stron')}. Ile stron zostanie mu do przeczytania po ${d} dniach?`,ans:n-k*d,label:'Liczba stron',
      hint:'Oblicz, ile stron przeczyta w ciągu wszystkich dni, i odejmij od całej książki.',expl:`Przez ${d} dni: ${d} · ${k} = ${k*d}. Zostaje: ${n} − ${k*d} = ${n-k*d}.`}},
    ()=>{const c=P([5,8,10,12,15]),q=R(12,40),t=c*q,p=R(20,45);
      return{html:`Sadownik zebrał ${f(t)} kg jabłek i zapakował je do skrzynek po ${c} kg. Każdą skrzynkę sprzedał za ${p} zł. Ile złotych zarobił?`,ans:q*p,label:'Złotych',
      hint:'Najpierw oblicz, ile było skrzynek.',expl:`Skrzynki: ${f(t)} : ${c} = ${q}. Zarobek: ${q} · ${p} = ${f(q*p)} zł.`}}
  ];
  const o=P({1:T1,2:T2,3:T3}[L])();
  return{html:o.html,fields:[{label:o.label,ans:o.ans}],hint:o.hint,expl:o.expl};
},
line(L){
  let s=0,step;if(L===1)step=P([1,2]);else if(L===2)step=P([5,10,20,25]);else{step=P([25,50,100,250]);s=P([100,200,500,1000])}
  const j=R(2,5);let p;do{p=R(1,10)}while(p===j);
  const val=s+p*step,mark=R(0,1);
  const ln={labels:[[0,s],[j,s+j*step]],point:mark?null:p};
  const expl=`Od ${f(s)} do ${f(s+j*step)} ${j<5?'są':'jest'} ${j} ${plural(j,'działka','działki','działek')}, więc jedna działka to (${f(s+j*step)} − ${f(s)}) : ${j} = ${f(step)}. ${mark?'Liczba':'Punkt A'} leży ${p} ${plural(p,'działkę','działki','działek')} na prawo od ${f(s)}: ${f(s)} + ${p} · ${f(step)} = ${f(val)}.`;
  const hint='Najpierw oblicz, ile wynosi jedna działka: podziel różnicę podpisanych liczb przez liczbę działek między nimi.';
  if(mark)return{html:`Zaznacz na osi liczbowej liczbę <b>${f(val)}</b>. Kliknij właściwą kreskę.`,line:ln,fields:[{mark:true,ans:p,show:f(val)}],hint,expl};
  return{html:'Wpisz współrzędną punktu A zaznaczonego na osi liczbowej.',line:ln,fields:[{label:'A =',ans:val}],hint,expl};
},
factor(L){
  let a,x;
  if(L===3&&R(0,2)===0){const b=R(2,9)*10,y=R(2,9)*10,c=b*y;
    return{html:'Uzupełnij.'+ex(`${BOX} : ${b} = ${y}`),fields:[{label:'□ =',ans:c}],hint:'Dzielenie sprawdzamy mnożeniem. Jaka liczba podzielona przez '+b+' da '+y+'?',
      expl:`□ = ${y} · ${b} = ${f(c)}. Sprawdzenie: ${f(c)} : ${b} = ${y}.`}}
  if(L===1){a=R(2,9);x=R(2,9)*10}
  else if(L===2){if(R(0,1)){a=R(2,9);x=R(2,9)*100}else{a=R(2,9)*10;x=P([R(2,9),R(2,9)*10])}}
  else{a=R(2,9)*10;x=R(2,9)*100}
  const c=a*x,lhs=R(0,1)?`${BOX} · ${f(a)}`:`${f(a)} · ${BOX}`;
  const zero=a%10===0?` Możesz skreślić po jednym zerze: ${f(c/10)} : ${a/10} = ${f(x)}.`:'';
  return{html:'Uzupełnij.'+ex(`${lhs} = ${f(c)}`),fields:[{label:'□ =',ans:x}],hint:`Brakujący czynnik to iloczyn podzielony przez znany czynnik: ${f(c)} : ${f(a)}.`,
    expl:`□ = ${f(c)} : ${f(a)} = ${f(x)}.${zero} Sprawdzenie: ${f(x)} · ${f(a)} = ${f(c)}.`};
},
pow(L){
  if(L===1){const n=R(2,10);
    return R(0,1)?{html:'Oblicz.'+ex(`${sq(n)} =`),fields:[{ans:n*n}],hint:'Kwadrat liczby to ta liczba pomnożona przez samą siebie.',expl:`${sq(n)} = ${n} · ${n} = ${n*n}.`}
      :{html:`Zapisz i oblicz kwadrat liczby ${n}.`,fields:[{ans:n*n}],hint:`Kwadrat liczby ${n} zapisujemy jako ${sq(n)}.`,expl:`${sq(n)} = ${n} · ${n} = ${n*n}.`}}
  if(L===2){
    if(R(0,1)){const n=R(2,6);return{html:`Zapisz i oblicz sześcian liczby ${n}.`,fields:[{ans:n**3}],hint:`Sześcian to ${cu(n)}, czyli ${n} · ${n} · ${n}.`,expl:`${cu(n)} = ${n} · ${n} · ${n} = ${n*n} · ${n} = ${n**3}.`}}
    const n=P([11,12,15,20,30,40,50]);return{html:'Oblicz.'+ex(`${sq(n)} =`),fields:[{ans:n*n}],hint:`Policz ${n} · ${n}.`,expl:`${sq(n)} = ${n} · ${n} = ${f(n*n)}.`};
  }
