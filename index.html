<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Szkolne sprawdziany Franka</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800&family=Caveat:wght@600;700&display=swap">
<style>
:root{--paper:#F5F8F6;--grid:#E4EBE6;--card:#FFFFFF;--fg:#26323A;--muted:#5B6870;--line:#D4DED8;
  --red:#B8372D;--red-soft:#FBE8E5;--green:#1D7A4C;--green-soft:#E0F2E7;--amber:#97620F;--amber-soft:#FBF1DA;
  --hl:#FFF0B3;--shadow:rgba(38,50,58,.10);--bar-fg:#E8F0EE;--bar-line:rgba(255,255,255,.35);--bar-on:#FFFFFF;--bar-on-fg:#26323A;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;--body:'Nunito','Segoe UI',system-ui,sans-serif;--hand:'Caveat','Comic Sans MS',cursive}
:root{--ink:#2F6F6B;--ink-soft:#E1F0EE;--on-ink:#FFFFFF;--bar:#24504D}
:root[data-subj="hist"]{--ink:#8A5A2B;--ink-soft:#F3E8DA;--on-ink:#FFFFFF;--bar:#5E3E1E}
:root[data-subj="przyroda"]{--ink:#2E7549;--ink-soft:#E1F1E6;--on-ink:#FFFFFF;--bar:#1F5233}
:root[data-subj="english"]{--ink:#3F65AE;--ink-soft:#E3EBF8;--on-ink:#FFFFFF;--bar:#2C4A80}
:root[data-subj="math"]{--ink:#6F52A5;--ink-soft:#ECE6F6;--on-ink:#FFFFFF;--bar:#4B3A78}
@media (prefers-color-scheme: dark){:root{--paper:#141A1E;--grid:#1B2328;--card:#1B2328;--fg:#E4EBEA;--muted:#9AA8AB;--line:#2D3A40;
  --red:#FF8B80;--red-soft:#3A1F22;--green:#6CD29A;--green-soft:#16321F;--amber:#F0BC5A;--amber-soft:#382B15;
  --hl:#5E5014;--shadow:rgba(0,0,0,.45);--bar-fg:#D4E2E0;--bar-line:rgba(255,255,255,.2);--bar-on:#F2F6F5;--bar-on-fg:#141A1E;color-scheme:dark}
 :root{--ink:#8FD0CA;--ink-soft:#1E3A38;--on-ink:#101619;--bar:#1E3A38}
 :root[data-subj="hist"]{--ink:#E0B27E;--ink-soft:#3A2A18;--on-ink:#101619;--bar:#3A2A18}
 :root[data-subj="przyroda"]{--ink:#8BD1A4;--ink-soft:#17301F;--on-ink:#101619;--bar:#17301F}
 :root[data-subj="english"]{--ink:#9DB9EE;--ink-soft:#1C2B47;--on-ink:#101619;--bar:#1C2B47}
 :root[data-subj="math"]{--ink:#BBA6E8;--ink-soft:#2C2347;--on-ink:#101619;--bar:#2C2347}
}

/* Layout: zeszyt w kratkę z granatowym paskiem; jedna kolumna kartek z zadaniami, czerwony długopis do ocen */
*{box-sizing:border-box}
body{margin:0;background-color:var(--paper);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);box-shadow:0 2px 10px var(--shadow)}
.top-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:800;font-size:1.2rem;color:#FFFFFF;line-height:1;display:flex;align-items:baseline;gap:6px;margin-right:auto}
.brand small{font-family:var(--body);font-weight:700;font-size:.72rem;color:var(--bar-fg);letter-spacing:.06em;text-transform:uppercase}
.nav{display:grid;grid-template-columns:repeat(4,auto);gap:8px}
.nav button{border:2px solid var(--bar-line);background:transparent;padding:9px 18px;border-radius:12px;font-family:var(--display);font-weight:700;font-size:1.08rem;line-height:1.2;color:var(--bar-fg)}
.nav button:hover{border-color:var(--bar-fg);color:#FFFFFF}
.nav button.on{background:var(--bar-on);border-color:var(--bar-on);color:var(--bar-on-fg);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.nav button:focus-visible{outline-color:var(--bar-on)}
@media (max-width:620px){.nav{width:100%;grid-template-columns:repeat(4,1fr);gap:6px}.nav button{padding:11px 2px;font-size:1rem}}

main{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:800}
h2{font-size:1.3rem;font-weight:700}
p{margin:0}
.lead{color:var(--muted);max-width:60ch}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.primary,.ghost,.soft{border-radius:10px;padding:10px 18px;font-weight:800;border:2px solid var(--ink)}
.primary{background:var(--ink);color:var(--on-ink)}
.primary:hover{filter:brightness(1.08)}
.ghost{background:transparent;color:var(--ink)}
.ghost:hover{background:var(--ink-soft)}
.soft{border-color:var(--line);background:var(--card);color:var(--fg);padding:6px 12px;font-size:.9rem}
.soft:hover{border-color:var(--ink);color:var(--ink)}
.danger{border-color:var(--red);background:var(--red);color:var(--on-ink)}

/* zadanie */
.task{border:2px solid var(--ink);border-radius:18px;padding:clamp(18px,4vw,32px);box-shadow:0 6px 22px var(--shadow)}
.task-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:6px 10px;margin-bottom:12px}
.tn{font-family:var(--display);font-weight:800;font-size:1.4rem}
.pts{color:var(--muted);font-variant-numeric:tabular-nums}
.pts .got{font-family:var(--hand);font-size:1.5rem;color:var(--red);line-height:1}
.tag{margin-left:auto;font-size:.85rem;font-weight:700;color:var(--ink);background:var(--ink-soft);padding:4px 12px;border-radius:999px}
.q-text{font-size:clamp(1.12rem,3.4vw,1.32rem);line-height:1.5;max-width:62ch;font-weight:600}
.q-text b{color:var(--ink)}
.opts{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.opt{display:grid;grid-template-columns:2.2em 1fr;gap:12px;align-items:center;text-align:left;background:var(--card);border:2px solid var(--line);border-radius:12px;padding:10px 14px;font-size:1.06rem;font-weight:600}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt .lt{width:2em;height:2em;border-radius:50%;display:grid;place-items:center;font-family:var(--display);font-weight:800;background:var(--ink-soft);color:var(--ink)}
.opt.sel{border-color:var(--ink);background:var(--ink-soft)}
.opt.sel .lt{background:var(--ink);color:var(--on-ink)}
.opt.right{border-color:var(--green);background:var(--green-soft)}
.opt.right .lt{background:var(--green);color:var(--on-ink)}
.opt.wrong{border-color:var(--red);background:var(--red-soft)}
.opt.wrong .lt{background:var(--red);color:var(--on-ink)}
.opt:disabled{color:var(--fg)}
.sorts{display:flex;flex-direction:column;gap:8px;margin-top:18px}
.srow{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--card)}
.srow.ok{border-color:var(--green);background:var(--green-soft)}
.srow.bad{border-color:var(--red);background:var(--red-soft)}
.si{flex:1 1 180px;min-width:0;font-weight:700;font-size:1.05rem}
.cats{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.92rem;color:var(--fg)}
.chip:not(:disabled):hover{border-color:var(--ink)}
.chip.on{border-color:var(--ink);background:var(--ink);color:var(--on-ink)}
.chip.right{border-color:var(--green);background:var(--green);color:var(--on-ink)}
.chip.wrong{border-color:var(--red);background:var(--red);color:var(--on-ink);text-decoration:line-through}
.seq{list-style:none;margin:18px 0 0;padding:0;display:flex;flex-direction:column;gap:8px}
.slot{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 12px;border:2px dashed var(--line);border-radius:12px;min-height:52px}
.slot.full{border-style:solid;border-color:var(--ink);background:var(--ink-soft)}
.slot.ok{border-color:var(--green);background:var(--green-soft)}
.slot.bad{border-color:var(--red);background:var(--red-soft)}
.num{font-family:var(--display);font-weight:800;font-size:1.3rem;color:var(--ink);width:1.4em}
.ph{color:var(--muted);font-size:.92rem}
.fix{flex-basis:100%;font-size:.9rem;color:var(--red);font-weight:700;padding-left:2em}
.step{border:2px solid var(--ink);background:var(--card);color:var(--fg);border-radius:10px;padding:7px 12px;font-weight:700;text-align:left}
.slot .step{background:transparent;border-color:transparent;padding:4px 2px}
.pool{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;padding-top:14px;border-top:1px dashed var(--line)}
.pool .step:hover{background:var(--ink-soft)}
.nrow{cursor:text}
.num-in{width:7.5em;border:2px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card);font-weight:800;font-size:1.1rem;font-variant-numeric:tabular-nums}
.num-in:focus{border-color:var(--ink);outline:none}
.num-in:disabled{background:transparent;color:var(--fg);opacity:1}
.unit{color:var(--muted);font-weight:700}
.nrow .fix{padding-left:0}
.tree{margin-top:14px;display:flex;flex-direction:column;gap:6px;padding:12px;border:1px dashed var(--line);border-radius:12px;background:var(--ink-soft)}
.tr{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:center;justify-content:center}
.tl{flex-basis:100%;text-align:center;font-size:.72rem;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.tb{background:var(--card);border:2px solid var(--ink);border-radius:8px;padding:3px 10px;font-weight:700;font-size:.95rem}
.tdesc{font-size:.92rem;font-weight:600;color:var(--fg);margin-top:4px}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px;align-items:center}
.acts .sp{margin-left:auto}
.acts .primary,.acts .ghost{font-size:1.1rem;padding:12px 24px}
.hint{margin-top:14px;padding:12px 16px;border-radius:10px;background:var(--amber-soft);color:var(--fg);border:1px dashed var(--amber);font-size:1.02rem}
.hint b{color:var(--amber)}
.warn{color:var(--red);font-weight:700;font-size:.92rem}
.fb{margin-top:16px;padding:16px 18px;border-radius:12px;display:flex;flex-direction:column;gap:6px}
.fb.ok{background:var(--green-soft)} .fb.bad{background:var(--red-soft)} .fb.part{background:var(--amber-soft)}
.fb-v{font-family:var(--hand);font-size:2rem;line-height:1}
.fb.ok .fb-v{color:var(--green)} .fb.bad .fb-v{color:var(--red)} .fb.part .fb-v{color:var(--amber)}
.expl{max-width:62ch;font-size:1.03rem}
.lvmsg{font-weight:800;color:var(--ink)}

/* przebieg */
.run-top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.run-top .t{font-weight:800}
.run-top .cnt{margin-left:auto;font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted)}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--ink);border-radius:99px;transition:width .3s}
.timer{font-variant-numeric:tabular-nums;font-weight:800;color:var(--ink);background:var(--ink-soft);padding:2px 10px;border-radius:8px}
.timer.low{color:var(--red);background:var(--red-soft)}
.dots{display:flex;flex-wrap:wrap;gap:6px}
.dots button{width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:var(--card);font-weight:800;font-size:.85rem;font-variant-numeric:tabular-nums}
.dots button.filled{border-color:var(--ink);color:var(--ink)}
.dots button.cur{background:var(--ink);color:var(--on-ink);border-color:var(--ink)}
.confirm{border:2px solid var(--red);background:var(--red-soft);border-radius:12px;padding:12px 14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.confirm p{flex:1 1 240px;font-weight:700}
.sheet-h{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;border-bottom:2px solid var(--fg);padding-bottom:6px}
.sheet-h b{font-family:var(--display);font-size:1.05rem}
.sheet-h span{color:var(--muted);font-size:.9rem}

/* start */
.hello{display:flex;flex-direction:column;gap:6px}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.mode{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:4px}
.mode:hover{border-color:var(--ink)}
.mode b{font-family:var(--display);font-size:1.25rem;line-height:1.2;color:var(--ink)}
.mode small{color:var(--muted);font-size:.9rem}
.mode .ex{font-size:.82rem;font-weight:700;color:var(--fg);margin-top:4px}
.chap{display:flex;flex-direction:column;gap:8px}
.chap h3{font-size:1rem;color:var(--muted);font-family:var(--body);font-weight:800;letter-spacing:.04em}
.tmap{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:8px}
.tchip{text-align:left;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;grid-template-columns:1fr auto;gap:4px 8px;align-items:center}
.tchip:hover{border-color:var(--ink)}
.tchip .nm{font-weight:700;font-size:.95rem;min-width:0}
.mini{grid-column:1/-1;height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.mini i{display:block;height:100%}
.st{font-size:.72rem;font-weight:800;padding:1px 8px;border-radius:99px;white-space:nowrap}
.st.new{background:var(--line);color:var(--muted)}
.st.low{background:var(--red-soft);color:var(--red)}
.st.mid{background:var(--amber-soft);color:var(--amber)}
.st.top{background:var(--green-soft);color:var(--green)}
.c-low{background:var(--red)} .c-mid{background:var(--amber)} .c-top{background:var(--green)}
.dim{opacity:.55;filter:grayscale(1);transition:opacity .2s,filter .2s}
.dim:hover,.dim:focus-within{opacity:1;filter:none}

/* ustawienia */
.tchips{display:flex;flex-wrap:wrap;gap:8px}
.tc{border:2px solid var(--line);background:var(--card);border-radius:999px;padding:5px 12px;font-weight:700;font-size:.9rem}
.tc.on{border-color:var(--ink);background:var(--ink-soft);color:var(--ink)}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;font-weight:800;color:var(--ink)}
.seg button.on{background:var(--ink);color:var(--on-ink)}
.lbl{font-weight:800;font-size:.95rem}
.note{font-size:.88rem;color:var(--muted)}
.switch{display:flex;gap:10px;align-items:center;font-weight:700}
.switch input{width:20px;height:20px;accent-color:var(--ink)}

/* wynik */
.res-top{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.stamp{width:124px;height:124px;border:3px solid var(--red);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--red);font-family:var(--hand);transform:rotate(-8deg);flex:none}
.stamp b{font-size:4.2rem;line-height:.8;font-weight:700}
.stamp span{font-size:1.3rem;line-height:1}
.big{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:1.1rem;color:var(--muted);font-weight:700}
.scale{font-size:.82rem;color:var(--muted)}
.rlist{display:flex;flex-direction:column;gap:6px}
.ritem{border:1px solid var(--line);border-radius:10px;background:var(--card)}
.ritem summary{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;padding:9px 12px;cursor:pointer;list-style:none}
.ritem summary::-webkit-details-marker{display:none}
.ritem .mark{font-family:var(--hand);font-size:1.5rem;line-height:1;width:1.2em;text-align:center}
.ritem .mark.y{color:var(--green)} .ritem .mark.n{color:var(--red)} .ritem .mark.p{color:var(--amber)}
.ritem .rp{font-variant-numeric:tabular-nums;font-weight:800;color:var(--muted)}
.ritem .rb{padding:10px 14px 14px;display:flex;flex-direction:column;gap:6px;border-top:1px dashed var(--line)}
.ritem .rb .q-text{font-size:1.05rem}
.ritem .rb .opt{font-size:.95rem;padding:7px 10px}

/* postępy */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tile b{display:block;font-family:var(--display);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.82rem;color:var(--muted);font-weight:700}
.ttable{display:flex;flex-direction:column}
.trow{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(70px,1fr) 3.2em auto auto;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .nm{font-weight:700;font-size:.95rem}
.trow .pc{font-variant-numeric:tabular-nums;font-weight:800;text-align:right}
.lvdots{display:flex;gap:3px}
.lvdots i{width:8px;height:8px;border-radius:50%;background:var(--line)}
.lvdots i.on{background:var(--ink)}
@media (max-width:520px){ .trow{grid-template-columns:minmax(0,1fr) auto auto;} .trow .mini{grid-column:1/-1;order:5} .trow .lvdots{display:none} }
.chart svg{width:100%;height:auto;display:block}
.chart .gl{stroke:var(--line);stroke-width:1}
.chart .gt{fill:var(--muted);font:600 11px var(--body)}
.chart .bt{fill:var(--ink)} .chart .bx{fill:var(--red)}
.chart .vl{fill:var(--fg);font:800 11px var(--body);text-anchor:middle}
.chart .gr{fill:var(--red);font:700 17px var(--hand);text-anchor:middle}
.legend{display:flex;gap:16px;font-size:.82rem;color:var(--muted);font-weight:700;flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hist{display:flex;flex-direction:column}
.hrow{display:grid;grid-template-columns:7.5em 1fr auto auto;gap:10px;padding:7px 0;border-bottom:1px solid var(--line);font-size:.92rem;align-items:center}
.hrow:last-child{border-bottom:0}
.hrow .d{color:var(--muted);font-variant-numeric:tabular-nums}
.hrow .s{font-variant-numeric:tabular-nums;font-weight:800}
.hrow .g{font-family:var(--hand);color:var(--red);font-size:1.4rem;line-height:1;min-width:1.4em;text-align:center}
.name-in{border:2px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--card);width:12em;max-width:100%}
a.primary,a.ghost{display:inline-block;text-decoration:none}
.sum-box{width:100%;min-height:180px;font:13px/1.45 ui-monospace,Menlo,Consolas,monospace;border:2px solid var(--line);border-radius:8px;padding:10px;background:var(--card);color:var(--fg);resize:vertical}
.okmsg{color:var(--green);font-weight:800}
.mail{font-weight:800;user-select:all}
.empty{padding:18px;text-align:center;color:var(--muted);border:2px dashed var(--line);border-radius:12px}
@media (prefers-reduced-motion: reduce){ *{transition:none!important;animation:none!important} }

body{background-image:none}
.top{box-shadow:0 1px 6px var(--shadow)}
.back{border:2px solid var(--bar-line);background:transparent;color:var(--bar-fg);border-radius:10px;padding:6px 12px;font-weight:800;font-size:.95rem}
.back:hover{border-color:var(--bar-fg);color:#fff}
.brand .ic{font-size:1.3rem;margin-right:2px}
.nav button.on{color:var(--bar)}
/* hub */
.subjects{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.subj{text-align:left;background:var(--card);border:2px solid var(--line);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:10px;min-height:190px;position:relative;overflow:hidden;transition:transform .15s,border-color .15s}
.subj::before{content:"";position:absolute;inset:0 0 auto 0;height:8px;background:var(--c)}
.subj:hover{transform:translateY(-3px);border-color:var(--c)}
.subj:focus-visible{outline-color:var(--c)}
.subj .big-ic{font-size:3rem;line-height:1;width:76px;height:76px;border-radius:20px;background:var(--cs);display:flex;align-items:center;justify-content:center}
.subj b{font-family:var(--display);font-size:1.55rem;line-height:1.1;color:var(--c)}
.subj small{color:var(--muted);font-size:.92rem}
.subj .meta{margin-top:auto;font-size:.85rem;font-weight:800;color:var(--fg)}
.subj .mbar{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
.subj .mbar i{display:block;height:100%;background:var(--c);border-radius:99px}
/* matematyka */
.expr{font-family:var(--display);font-weight:600;font-size:clamp(1.6rem,6vw,2.4rem);margin:10px 0 2px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.expr sup,.q-text sup{font-size:.6em}
.box{display:inline-block;min-width:1.3em;height:1.05em;border:2px dashed var(--ink);border-radius:4px;vertical-align:-.12em;color:transparent;line-height:1}
.axis{overflow-x:auto;margin-top:12px}
.axis svg{width:100%;min-width:420px;max-width:640px;height:auto;display:block}
.axis .ax,.axis .tk{stroke:var(--fg);stroke-width:2}
.axis .axh{fill:var(--fg)}
.axis .lb{fill:var(--fg);font:700 18px var(--body);text-anchor:middle}
.axis .lb.ans{fill:var(--green)}
.axis .pt{fill:var(--ink)}
.axis .pl{fill:var(--ink);font:800 18px var(--display);text-anchor:middle}
.axis .hit{cursor:pointer}
.axis .mk{fill:transparent;stroke:transparent;stroke-width:2}
.axis .hit:hover .mk,.axis .hit:focus .mk{stroke:var(--ink)}
.axis .sel .mk{fill:var(--ink)}
.axis .right .mk{fill:var(--green);stroke:var(--green)}
.axis .wrong .mk{fill:var(--red)}

.nav[hidden],.back[hidden]{display:none}
main.wide{max-width:none;padding:0;gap:0}
#math-frame{display:block;width:100%;border:0}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <button class="back" id="back" data-go="hub" hidden>◀ Przedmioty</button>
  <div class="brand" id="brand"><span class="ic">📚</span> Szkolne sprawdziany <small>kl. 4</small></div>
  <nav class="nav" id="nav" aria-label="Widoki" hidden>
    <button data-go="home">Start</button>
    <button data-go="train">Trening</button>
    <button data-go="test">Sprawdzian</button>
    <button data-go="progress">Postępy</button>
  </nav>
</div></header>
<main id="main"></main>

<title>Matma Franka</title>

<style>
/* Layout: zeszyt w kratkę — jedna kolumna kartek z zadaniami, nagłówek z zakładkami, czerwony długopis nauczyciela do ocen */
:root{
  --paper:#F5F8FB; --grid:#DCE6F0; --card:#FFFFFF; --fg:#1C2430; --muted:#5B697C; --line:#CAD6E4;
  --ink:#22477F; --ink-soft:#E4ECF8; --on-ink:#FFFFFF;
  --red:#C3352B; --red-soft:#FBE6E3; --green:#1D7A4C; --green-soft:#DFF2E6; --amber:#A86C12; --amber-soft:#FBEFD6;
  --hl:#FFE47D; --shadow:rgba(34,71,127,.13); --shadow-strong:rgba(34,71,127,.35);
  --bar:#1F3F70; --bar-fg:#DCE7F7; --bar-line:rgba(255,255,255,.3); --bar-on:#FFD65A; --bar-on-fg:#1C2430;
  --display:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --body:'Nunito', 'Segoe UI', system-ui, sans-serif;
  --hand:'Caveat', 'Comic Sans MS', cursive;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#111722; --grid:#1A2331; --card:#18202D; --fg:#E6EBF2; --muted:#98A6B8; --line:#2B384C;
  --ink:#8FB6F4; --ink-soft:#21314A; --on-ink:#0E1522;
  --red:#FF8B80; --red-soft:#3A1F22; --green:#6CD29A; --green-soft:#16321F; --amber:#F0BC5A; --amber-soft:#382B15;
  --hl:#5E5014; --shadow:rgba(0,0,0,.45); --shadow-strong:rgba(0,0,0,.6); --bar:#1D3457; --bar-fg:#C9D8EE; --bar-line:rgba(255,255,255,.2); --bar-on:#F2C14E; --bar-on-fg:#111722; color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#111722; --grid:#1A2331; --card:#18202D; --fg:#E6EBF2; --muted:#98A6B8; --line:#2B384C;
  --ink:#8FB6F4; --ink-soft:#21314A; --on-ink:#0E1522;
  --red:#FF8B80; --red-soft:#3A1F22; --green:#6CD29A; --green-soft:#16321F; --amber:#F0BC5A; --amber-soft:#382B15;
  --hl:#5E5014; --shadow:rgba(0,0,0,.45); --shadow-strong:rgba(0,0,0,.6); --bar:#1D3457; --bar-fg:#C9D8EE; --bar-line:rgba(255,255,255,.2); --bar-on:#F2C14E; --bar-on-fg:#111722; color-scheme:dark }

*{box-sizing:border-box}
body{background-color:var(--paper);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5;
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;min-height:100%}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px;border-radius:6px}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bar);border-bottom:1px solid var(--bar)}
.top-in{max-width:780px;margin:0 auto;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:800;font-size:1.2rem;color:#FFFFFF;line-height:1;display:flex;align-items:baseline;gap:6px;margin-right:auto}
.brand small{font-family:var(--body);font-weight:700;font-size:.72rem;color:var(--bar-fg);letter-spacing:.06em;text-transform:uppercase}
.nav{display:grid;grid-template-columns:repeat(5,auto);gap:8px}
.nav button{border:2px solid var(--bar-line);background:transparent;padding:9px 14px;border-radius:12px;font-family:var(--display);font-weight:700;font-size:1.02rem;line-height:1.2;color:var(--bar-fg)}
.nav button:hover{border-color:var(--bar-fg);color:#FFFFFF}
.nav button.on{background:var(--bar-on);border-color:var(--bar-on);color:var(--bar-on-fg);box-shadow:0 3px 0 rgba(0,0,0,.25)}
.nav button:focus-visible{outline-color:var(--bar-on)}
@media (max-width:620px){.nav{width:100%;grid-template-columns:repeat(5,1fr);gap:5px}.nav button{padding:10px 0;font-size:.72rem;border-radius:10px;letter-spacing:-.02em}}
.top{box-shadow:0 2px 10px var(--shadow)}

/* duże pole zadania */
.task{border:2px solid var(--ink);border-radius:18px;padding:clamp(20px,4vw,34px);box-shadow:0 6px 22px var(--shadow)}
.task .tn{font-size:1.45rem}
.task .tag{font-size:.85rem;padding:4px 12px}
.task .q-text{font-size:clamp(1.18rem,3.6vw,1.4rem);line-height:1.5}
.task .expr{font-size:clamp(2.1rem,8vw,3rem);margin:14px 0 4px}
.task .fields{gap:16px 28px;margin-top:20px}
.task .fld{font-size:1rem}
.task .fld input{font-size:2.1rem;width:7.5ch;padding:6px 12px;border-bottom-width:4px}
.task .acts{margin-top:24px}
.task .acts .primary,.task .acts .ghost{font-size:1.12rem;padding:13px 26px}
.task .fb{padding:18px 20px}
.task .fb-v{font-size:2.1rem}
.task .expl{font-size:1.05rem}
.task .hint{font-size:1.05rem}

main{max-width:780px;margin:0 auto;display:flex;flex-direction:column;gap:22px;
  padding-block:24px 64px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:var(--display);line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:clamp(1.8rem,5vw,2.4rem);font-weight:800}
h2{font-size:1.3rem;font-weight:700}
p{margin:0}
.lead{color:var(--muted);max-width:60ch}
.eyebrow{font-size:.74rem;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.hl{background:linear-gradient(transparent 55%,var(--hl) 55%);padding:0 2px}

.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

addsub(L){
  const v=R(0,2);

    const big=L===3,tot=big?1000:100;
    const x=big?R(101,899):R(11,89),z=big?R(101,899):R(11,89),y=tot-x,w=tot-z;
    const ord=L===1?[x,y,z,w]:[x,z,y,w],s=x+y+z+w;
    return{html:'Oblicz w pamięci.'+ex(ord.map(f).join(' + ')+' ='),fields:[{ans:s}],
      path:[{label:`Ile razem dają ${f(x)} i ${f(y)}?`,ans:tot}],
      hint:`Poszukaj dwóch par liczb, które razem dają ${f(tot)}.`,
      expl:`Łączymy składniki w pary: (${f(x)} + ${f(y)}) + (${f(z)} + ${f(w)}) = ${f(tot)} + ${f(tot)} = ${f(s)}.`};
  }
  if(L===3&&R(0,1)){
    const a=R(200,900),b=R(150,600),c=R(100,a+b-50),s1=a+b;
    return{html:'Oblicz.'+ex(`${f(a)} + ${f(b)} − ${f(c)} =`),fields:[{ans:s1-c}],path:[{label:`${f(a)} + ${f(b)} =`,ans:s1}],
      hint:'Gdy są tylko dodawanie i odejmowanie, liczysz po kolei od lewej.',
      expl:`${f(a)} + ${f(b)} = ${f(s1)}, potem ${f(s1)} − ${f(c)} = ${f(s1-c)}.`};
  }
  const add=v===1;let a,b;
  if(L===1){if(add){a=R(11,70);b=R(10,99-a)}else{a=R(30,99);b=R(11,a-5)}}
  else if(L===2){if(add){a=R(105,699);b=R(105,999-a)}else{a=R(300,999);b=R(101,a-20)}}
  else{if(add){a=R(1050,6999);b=R(1050,9999-a)}else{a=R(3000,9999);b=R(1050,a-100)}}
  const res=add?a+b:a-b,op=add?'+':'−',u=L===1?10:L===2?100:1000,bt=b-b%u,m=add?a+bt:a-bt;
  const split=bt>0&&b%u!==0;
  const expl=split?`Rozkładamy ${f(b)} na ${f(bt)} i ${f(b-bt)}: ${f(a)} ${op} ${f(bt)} = ${f(m)}, a ${f(m)} ${op} ${f(b-bt)} = ${f(res)}. Sprawdzenie: ${add?`${f(res)} − ${f(b)} = ${f(a)}`:`${f(res)} + ${f(b)} = ${f(a)}`}.`
    :`${f(a)} ${op} ${f(b)} = ${f(res)}.`;
  return{html:'Oblicz.'+ex(`${f(a)} ${op} ${f(b)} =`),fields:[{ans:res}],
    path:split?[{label:`Najpierw ${op==='+'?'dodaj':'odejmij'} samą ${L===1?'liczbę dziesiątek':L===2?'liczbę setek':'liczbę tysięcy'}: ${f(a)} ${op} ${f(bt)} =`,ans:m}]:[],
    hint:add?'Dodawaj osobno tysiące, setki, dziesiątki i jedności.':'Możesz odjąć najpierw pełne setki lub dziesiątki, a potem resztę.',expl};
},

  if(R(0,1)&&a%10>=b%10){b=b-b%10+((a%10)+R(1,9))%10;if(b>=a)b=a-37}
  const r=a-b,borrow=a%10<b%10?1:0,u=borrow?a%10+10-b%10:a%10-b%10;
  return{html:'Odejmij pisemnie.'+colSum([a,b],'−'),fields:[{label:'Różnica',ans:r}],
    path:[{label:'Czy w kolumnie jedności musisz pożyczać? (1 = tak, 0 = nie)',ans:borrow},{label:'Ile wychodzi w kolumnie jedności?',ans:u}],
    hint:'Gdy z góry jest mniejsza cyfra niż z dołu, pożyczasz jedną dziesiątkę z kolumny obok.',
    expl:`Jedności: ${borrow?`${a%10} < ${b%10}, więc pożyczamy: ${a%10+10} − ${b%10} = ${u}`:`${a%10} − ${b%10} = ${u}`}. Całość: ${a} − ${b} = ${r}. Sprawdzenie: ${r} + ${b} = ${a}.`};
},
wmul1(L){

wmulz(L){
  let a,b,za,zb;
  if(L===1){a=R(12,99);za=1;b=R(2,9);zb=1}else if(L===2){a=R(12,99);za=P([1,2]);b=R(12,59);zb=1}else{a=R(12,99);za=P([2,3]);b=R(12,59);zb=P([1,2])}
  const A=a*Math.pow(10,za),B=b*Math.pow(10,zb),p=A*B;
  return{html:'Pomnóż. Zera na końcu możesz dopisać na końcu.'+ex(`${f(A)} · ${f(B)} =`),fields:[{ans:p}],
    path:[{label:`Bez zer: ${a} · ${b} =`,ans:a*b},{label:'Ile zer dopiszesz razem?',ans:za+zb}],
    hint:'Pomnóż liczby bez zer na końcu. Potem dopisz tyle zer, ile było ich razem w obu czynnikach.',
    expl:`${a} · ${b} = ${a*b}. W ${f(A)} są ${za} ${plural(za,'zero','zera','zer')}, w ${f(B)} jest ${zb}. Dopisujemy ${za+zb}: ${f(p)}.`};
},
wmulm(L){
  let a,b;if(L===1){a=R(23,99);b=R(12,49)}else if(L===2){a=R(123,499);b=R(12,49)}else{a=R(123,499);b=R(112,399);}
  if(L<3){const ub=b%10,tb=Math.floor(b/10),p1=a*ub,p2=a*tb*10;
    return{html:'Pomnóż pisemnie.'+colSum([a,b],'·'),fields:[{label:'Iloczyn',ans:a*b}],

      hint:'Mnożysz przez jedności, potem przez dziesiątki (dopisz zero) i dodajesz iloczyny częściowe.',

    hint:'Trzy iloczyny częściowe: przez jedności, przez dziesiątki (dopisz 0) i przez setki (dopisz 00). Potem dodaj.',
    expl:`${a} · ${u} = ${f(p1)}, ${a} · ${t*10} = ${f(p2)}, ${a} · ${h*100} = ${f(p3)}. Razem ${f(p1+p2+p3)}.`};

wdiv(L){
  let d,q;if(L===1){d=R(2,9);q=R(120,499)}else if(L===2){d=R(2,9);q=R(120,899)}else{d=R(3,9);q=R(1200,4999)}

  return{html:`Podziel pisemnie${L>1?' (z resztą)':''}.`+ex(`${n} : ${d} =`),fields,
    path:[{label:`Ile razy ${d} mieści się w ${lead}?`,ans:q1},{label:`Ile zostaje po pierwszym kroku (${lead} − ${q1*d})?`,ans:r1}],
    hint:'Dziel po kolei: bierz tyle cyfr z początku, aż utworzą liczbę nie mniejszą od dzielnika. Potem znoś kolejne cyfry.',
    expl:`Pierwszy krok: ${lead} : ${d} = ${q1}, ${q1} · ${d} = ${q1*d}, reszta ${r1}. Potem znosimy kolejne cyfry. Wynik: ${n} : ${d} = ${q}${rm?` r. ${rm}`:''}. Sprawdzenie: ${q} · ${d}${rm?` + ${rm}`:''} = ${n}.`};
},
wtext(L){

      path:[opSel('Pierwsze działanie (koszt wszystkich zeszytów)','m'),{label:'Ile kosztują wszystkie zeszyty (zł)?',ans:cost},opSel('Drugie działanie (reszta)','s')],

      path:[opSel('Pierwsze działanie (ilu uczniów razem)','m'),{label:'Ilu uczniów poszło razem?',ans:n*c},opSel('Drugie działanie (koszt biletów)','m')],
      hint:'Najpierw policz wszystkich uczniów, potem pomnóż przez cenę biletu.',expl:`${n} · ${c} = ${n*c} uczniów. ${n*c} · ${p} = ${f(tot)} zł.`};
  }

    hint:'Najpierw policz, ile naklejek jest razem, potem podziel po równo.',expl:`${f(n0)} + ${f(gift)} = ${f(n0+gift)}. ${f(n0+gift)} : ${per} = ${f(q)}.`};

  for(let k=1;set.length<5;k++){for(const c of [correct+k,correct-k]){if(set.length<5&&c>=0&&!set.includes(c))set.push(c)}}
  set.sort((a,b)=>a-b);

  return{html:`<div class="kopts">${set.map((v,i)=>`<span><b>${LET[i]}</b>${f(v)}${u}</span>`).join('')}</div>`,ans:LET[set.indexOf(correct)],show:`${LET[set.indexOf(correct)]}) ${f(correct)}${u}`};
}

const KEY='lid4-v1';
function blank(){return{v:1,name:'Franek',topics:{},levels:{},sessions:[],days:[],daily:{},count:0}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)return Object.assign(blank(),s)}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S=load();
const tst=id=>S.topics[id]||(S.topics[id]={att:0,ok:0,recent:[],st:0,wr:0});
const lvl=id=>S.levels[id]||1;
function acc(id){const t=S.topics[id];if(!t||!t.recent.length)return null;return t.recent.reduce((a,b)=>a+b,0)/t.recent.length}
function chAcc(ch){const all=topicsOf(ch).flatMap(t=>(S.topics[t.id]||{recent:[]}).recent);return all.length?all.reduce((a,b)=>a+b,0)/all.length:null}
function status(a){if(a==null)return['new','nowy'];if(a<.5)return['low','do poprawy'];if(a<.8)return['mid','ćwicz dalej'];return['top','opanowane']}
function record(q,pts,max,adapt){
  const t=tst(q.topic),fr=pts/max;t.att++;t.ok+=fr;t.recent.push(fr);if(t.recent.length>20)t.recent.shift();
  S.count++;const d=today();if(!S.days.includes(d))S.days.push(d);S.daily[d]=(S.daily[d]||0)+1;
  let msg='';
  if(adapt){
    if(fr===1){t.st++;t.wr=0}else if(fr<.5){t.wr++;t.st=0}else{t.st=0;t.wr=0}
    const L=lvl(q.topic);
    if(t.st>=3&&L<3){S.levels[q.topic]=L+1;t.st=0;msg=`Trzy razy pod rząd bez błędu. Temat „${T[q.topic].name}” przechodzi na poziom ${LV[L+1]}.`}
    else if(t.wr>=2&&L>1){S.levels[q.topic]=L-1;t.wr=0;msg=`Wracamy na chwilę do łatwiejszych zadań z tego tematu (poziom ${LV[L-1]}).`}
  }
  save();return msg;
}
function streak(){const set=new Set(S.days);const d=new Date();if(!set.has(ymd(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}
function gradeOf(p){if(p>=98)return[6,'cel'];if(p>=90)return[5,'bdb'];if(p>=75)return[4,'db'];if(p>=60)return[3,'dst'];if(p>=40)return[2,'dop'];return[1,'ndst']}
function weakTopics(){
  const pr=TOPICS.filter(t=>acc(t.id)!=null&&t.id!=='kang').sort((a,b)=>acc(a.id)-acc(b.id)).slice(0,3).map(t=>t.id);
  const rest=shuffle(topicsOf('c1').map(t=>t.id).filter(id=>!pr.includes(id)));
  return pr.concat(rest).slice(0,3);
}

/* ---------- questions ---------- */
function makeQ(id,L,seen,wp){
  let q;for(let k=0;k<8;k++){q=G[id](L);if(!seen||!seen.has(q.html))break}
  q.topic=id;q.level=L;q.path=q.path||[];q.hasPath=!!(wp&&q.path.length);
  if(q.hasPath)q.fields=q.path.map(p=>Object.assign({},p,{path:true})).concat(q.fields);
  q.max=q.fields.length;seen&&seen.add(q.html);return q;
}
function parseNum(v){if(v==null)return null;const s=String(v).replace(/[\s .]/g,'').replace(/^[−–]/,'-');if(!/^-?\d+$/.test(s))return null;return parseInt(s,10)}
function isEmpty(q,vals){return q.fields.some((fd,k)=>fd.mark?vals[k]==null:!String(vals[k]??'').trim())}
function gradeQ(q,vals){const ok=q.fields.map((fd,k)=>fd.mark?vals[k]===fd.ans:fd.kind==='sel'?vals[k]===fd.ans:parseNum(vals[k])===fd.ans);return{ok,pts:ok.filter(Boolean).length,max:q.max}}
function selLabel(fd,v){const o=(fd.opts||[]).find(x=>x[0]===v);return o?o[1]:(v||'—')}
function ansText(fd){
  if(fd.mark)return`liczba ${fd.show} (zielona kreska)`;
  const l=fd.label||'wynik';
  if(fd.kind==='sel')return`${l}: <b>${fd.show||selLabel(fd,fd.ans)}</b>`;
  return /=$/.test(l)?`${l} <b>${f(fd.ans)}</b>`:`${l}: <b>${f(fd.ans)}</b>`;
}

function lineSVG(q,ns,vals,locked,show){
  const L=q.line,x0=34,g=54,y=52;let s=`<svg viewBox="0 0 620 100" role="img" aria-label="Oś liczbowa">`;
  s+=`<line x1="8" y1="${y}" x2="604" y2="${y}" class="ax"/><path d="M604 ${y-7} L616 ${y} L604 ${y+7} Z" class="axh"/>`;
  for(let i=0;i<=10;i++){const x=x0+i*g;s+=`<line x1="${x}" y1="${y-9}" x2="${x}" y2="${y+9}" class="tk"/>`}
  L.labels.forEach(([i,v])=>{s+=`<text x="${x0+i*g}" y="${y+34}" class="lb">${f(v)}</text>`});
  const fa=q.fields.find(fd=>!fd.path&&!fd.mark);
  if(L.point!=null){const x=x0+L.point*g;s+=`<circle cx="${x}" cy="${y}" r="7" class="pt"/><text x="${x}" y="${y-17}" class="pl">A</text>`;
    if(show&&fa)s+=`<text x="${x}" y="${y+34}" class="lb ans">${fa.ans}</text>`}
  const k=q.fields.findIndex(fd=>fd.mark);
  if(k>=0){const sel=vals[k],ans=q.fields[k].ans;
    for(let i=0;i<=10;i++){const x=x0+i*g;let c='hit';if(sel===i)c+=' sel';if(show&&i===ans)c+=' right';if(show&&sel===i&&sel!==ans)c+=' wrong';
      const at=locked?'':` data-act="tick" data-ns="${ns}" data-k="${k}" data-t="${i}" tabindex="0" role="button" aria-label="Kreska numer ${i}"`;
      s+=`<g class="${c}"${at}><rect x="${x-26}" y="${y-30}" width="52" height="58" fill="transparent"/><circle cx="${x}" cy="${y}" r="8" class="mk"/></g>`}
    if(show)s+=`<text x="${x0+ans*g}" y="${y+34}" class="lb ans">${q.fields[k].show}</text>`}
  return s+'</svg>';
}
function fieldHTML(fd,k,ns,vals,res){
  if(fd.mark)return'';
  const locked=!!res,cls=locked?` ${res.ok[k]?'ok':'bad'}`:'';
  if(fd.kind==='sel'){
    return`<label class="fld${fd.path?'':' '}" for="${ns}-${k}"><span>${fd.label||'Wybierz'}</span><select id="${ns}-${k}" data-ns="${ns}" data-k="${k}"${locked?` disabled class="${res.ok[k]?'ok':'bad'}"`:''}>${fd.opts.map(([v,l])=>`<option value="${v}"${vals[k]===v?' selected':''}>${l}</option>`).join('')}</select></label>`;
  }
  return`<label class="fld${fd.path&&fd.label&&fd.label.length>34?' wide':''}" for="${ns}-${k}"><span>${fd.label||'Wynik'}</span><input id="${ns}-${k}" data-ns="${ns}" data-k="${k}" inputmode="numeric" autocomplete="off" value="${esc(vals[k]??'')}"${locked?` disabled class="${res.ok[k]?'ok':'bad'}"`:''}></label>`;
}
const SYMBAR='<div class="symbar" aria-label="Znaki dodatkowe"><span>Znaki:</span>'+['−','+','·',':','=','(',')',',','²','³'].map(c=>`<button type="button" data-sym="${c}" aria-label="wstaw ${c}">${c}</button>`).join('')+'</div>';
let LASTIN=null;
function qBody(q,ns,vals,res){
  const locked=!!res;let h=q.kang?q.html:`<div class="q-text">${q.html}</div>`;
  if(q.line)h+=`<div class="axis">${lineSVG(q,ns,vals,locked,locked)}</div>`;
  const pi=[],fi=[];q.fields.forEach((fd,k)=>(fd.path?pi:fi).push([fd,k]));
  if(pi.length)h+=`<div class="path"><span class="lbl">Droga do wyniku <small>(zapisz kolejne kroki, są oceniane)</small></span><div class="fields">${pi.map(([fd,k])=>fieldHTML(fd,k,ns,vals,res)).join('')}</div></div>`;
  const fin=fi.map(([fd,k])=>fieldHTML(fd,k,ns,vals,res)).join('');
  if(fin)h+=`${pi.length?'<span class="lbl final-l">Odpowiedź</span>':''}<div class="fields">${fin}</div>`;
  if(!locked&&q.fields.some(fd=>!fd.mark&&fd.kind!=='sel'))h+=SYMBAR;
  return h;
}
function fbHTML(q,res){
  const all=res.pts===res.max,c=all?'ok':res.pts?'part':'bad';
  const wrong=q.fields.filter((fd,k)=>!res.ok[k]);
  const pathBad=q.fields.some((fd,k)=>fd.path&&!res.ok[k]),finBad=q.fields.some((fd,k)=>!fd.path&&!res.ok[k]);
  return`<div class="fb ${c}" role="status"><p class="fb-v">${res.verdict}</p>${wrong.length?`<p>Poprawnie: ${wrong.map(ansText).join('; ')}.</p>`:''}${pathBad&&!finBad?'<p class="pathmsg">Wynik końcowy dobry, ale droga do niego nie. Na sprawdzianie ocenia się też kolejne kroki.</p>':''}<p class="expl">${q.expl}</p>${res.lvMsg?`<p class="lvmsg">${res.lvMsg}</p>`:''}</div>`;
}
const verdict=r=>r.pts===r.max?P(['Dobrze!','Świetnie!','Brawo!','Tak jest!','Bez błędu!']):r.pts?'Prawie. Część jest dobrze.':P(['Jeszcze nie.','Spróbuj zrozumieć sposób:']);

/* ---------- state ---------- */
let VIEW='home',RUN=null,WARM=null,TIMER=null,CONFIRM_RESET=false,CHV='c1';
const TRAIN={topics:new Set(topicsOf('c1').map(t=>t.id)),level:'auto',n:10,path:true};
const TEST={level:2,timer:false,chs:new Set(['c1'])};
const $=s=>document.querySelector(s);
const testTopics=()=>CH.filter(c=>TEST.chs.has(c.id)).flatMap(c=>topicsOf(c.id));
const testCount=()=>testTopics().reduce((a,t)=>a+(t.id==='kang'?5:1),0);
const testMin=n=>Math.max(45,Math.ceil(n*3.5/5)*5);

function newWarm(){const pool=TOPICS.filter(t=>t.id!=='kang'&&t.ch==='c1'||acc(t.id)!=null&&t.id!=='kang');const id=P(pool).id;WARM={q:makeQ(id,lvl(id),null,false),vals:[],res:null,hint:false,msg:''}}

function startRun(mode,o){
  clearInterval(TIMER);
  const seen=new Set(),wp=mode==='test'?true:(o.path!==undefined?o.path:TRAIN.path);
  RUN={mode,opts:o,level:o.level,n:o.n,qs:[],vals:[],res:[],hint:[],i:0,seen,wp,t0:Date.now(),done:false,pending:null,confirmEnd:false,msg:'',group:P(['A','B'])};
  if(mode==='test'){
    const ts=o.chs?CH.filter(c=>o.chs.includes(c.id)).flatMap(c=>topicsOf(c.id)):TOPICS.filter(t=>t.ch==='c1');
    ts.forEach(t=>{for(let r=0;r<(t.id==='kang'?5:1);r++)RUN.qs.push(makeQ(t.id,o.level,seen,true))});
    RUN.n=RUN.qs.length;RUN.vals=RUN.qs.map(()=>[]);RUN.names=CH.filter(c=>o.chs.includes(c.id)).map(c=>c.name);
    if(o.timer){RUN.deadline=Date.now()+testMin(RUN.n)*60000;TIMER=setInterval(tick,1000)}}
  else{let order=[];while(order.length<o.n){let s=shuffle(o.topics);if(order.length&&s.length>1&&s[0]===order[order.length-1])s.push(s.shift());order=order.concat(s)}RUN.order=order.slice(0,o.n);ensureQ(0)}
  VIEW='run';render();scrollTo(0,0);
}
function ensureQ(i){if(!RUN.qs[i]){const id=RUN.order[i];RUN.qs[i]=makeQ(id,RUN.level==='auto'?lvl(id):RUN.level,RUN.seen,RUN.wp);RUN.vals[i]=[]}}
function tick(){if(!RUN||RUN.done||!RUN.deadline){clearInterval(TIMER);return}const left=RUN.deadline-Date.now();
  if(left<=0){finishTest();return}const el=$('#timer');if(el){el.textContent=mmss(left);el.classList.toggle('low',left<5*60000)}}
const mmss=ms=>{const s=Math.max(0,Math.round(ms/1000));return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};

function doCheck(){
  const i=RUN.i,q=RUN.qs[i],vals=RUN.vals[i];
  if(isEmpty(q,vals)){RUN.msg=q.fields.some(fd=>fd.mark)?'Kliknij kreskę na osi i wypełnij pozostałe pola.':'Wypełnij wszystkie pola.';render();return}
  const r=gradeQ(q,vals);r.verdict=verdict(r);
  r.lvMsg=record(q,r.pts,r.max,RUN.level==='auto');RUN.res[i]=r;RUN.msg='';render();
  const b=document.querySelector('[data-act="next"]');b&&b.focus();
}
function doNext(){if(RUN.i+1>=RUN.n){finishRun();return}RUN.i++;ensureQ(RUN.i);RUN.msg='';render();focusFirst()}
function finishRun(){
  RUN.done=true;clearInterval(TIMER);
  const pts=RUN.res.reduce((a,r)=>a+(r?r.pts:0),0),max=RUN.qs.reduce((a,q)=>a+q.max,0),pct=Math.round(pts/max*100);
  const s={d:Date.now(),mode:RUN.mode,pts,max,pct,n:RUN.n,level:RUN.level,time:Date.now()-RUN.t0};
  if(RUN.mode==='test'){s.grade=gradeOf(pct)[0];s.chs=RUN.opts.chs}
  S.sessions.push(s);if(S.sessions.length>200)S.sessions.shift();save();
  RUN.summary=s;VIEW='result';render();scrollTo(0,0);
}
function finishTest(){RUN.qs.forEach((q,i)=>{const r=gradeQ(q,RUN.vals[i]||[]);r.verdict=verdict(r);RUN.res[i]=r;record(q,r.pts,r.max,false)});finishRun()}
function focusFirst(){const el=document.querySelector('#main input:not([disabled]),#main select:not([disabled])');el&&el.focus({preventScroll:true})}

/* ---------- views ---------- */
function topicChip(t){const a=acc(t.id),[c,l]=status(a);
  return`<button class="tchip" data-act="topic" data-id="${t.id}"><span class="nm">${t.name}</span><span class="st ${c}">${l}</span><span class="mini">${a!=null?`<i class="c-${c}" style="width:${Math.max(4,Math.round(a*100))}%"></i>`:''}</span></button>`}
function chButton(c,act,extra){
  const a=chAcc(c.id),[st]=status(a);
  return`<button class="chbtn${extra||''}" data-act="${act}" data-id="${c.id}"><span class="sym">${c.sym}</span><b>${c.name}</b><small>${c.pages}${a!=null?` · ${Math.round(a*100)}%`:''}</small><span class="mini">${a!=null?`<i class="c-${st}" style="width:${Math.max(4,Math.round(a*100))}%"></i>`:''}</span></button>`;
}

  <section class="stack"><div class="row" style="justify-content:space-between"><h2>Działy</h2><span class="note">Kliknij dział, żeby go poćwiczyć albo napisać z niego sprawdzian.</span></div>

    <button class="mode" data-act="go" data-v="test"><span class="eyebrow">Sprawdzian</span><b>Z wybranych działów, ocena 1–6</b><small>Wynik dopiero po oddaniu. Oceniana jest też droga do wyniku.</small></button>

function vFun(){
  return`<section class="hello"><span class="eyebrow">Ciekawe</span><h1>Ciekawostki i Kangur</h1>
    <p class="lead">Ciekawostki z podręcznika i zadania w stylu Kangura Matematycznego. Przy zadaniach z Kangura wpisujesz kroki rozwiązania, a potem wybierasz literę odpowiedzi A–E.</p></section>
  <section class="card stack"><h2>🦘 Zadania w stylu Kangura (klasy 3–4, kategoria „Maluch”)</h2>
    <p class="note">To własne warianty zadań wzorowane na typach zadań z konkursu (losowane liczby), z oficjalnych zestawów z lat 2024 i 2025 i z klasycznych zadań konkursowych. Poziomy: podstawowy to zadania łatwiejsze, zaawansowany dodaje najtrudniejsze.</p>
    <div class="row"><button class="primary" data-act="kstart" data-v="5">5 zadań (z drogą)</button><button class="ghost" data-act="kstart" data-v="10">10 zadań</button><button class="ghost" data-act="ktest">Sprawdzian z Kangura</button></div></section>
  <section class="stack"><h2>Ciekawostki z podręcznika</h2><div class="fun">${FUN.map(x=>`<article class="fcard"><span class="pg">${x.pg}</span><h3>${x.t}</h3><p>${x.tx}</p>${x.ex?`<div class="ex2">${esc(x.ex)}</div>`:''}</article>`).join('')}</div></section>`;
}

function confirmBar(){
  if(!RUN.pending)return'';
  const t=RUN.mode==='test'?'Przerwać sprawdzian? Odpowiedzi nie zostaną ocenione ani zapisane.':'Zakończyć trening? Rozwiązane zadania są już zapisane w postępach.';
  return`<div class="confirm"><p>${t}</p><button class="danger primary" data-act="quitok">Tak, zakończ</button><button class="ghost" data-act="quitno">Wróć do zadań</button></div>`;
}

function vRun(){
  const r=RUN,i=r.i,q=r.qs[i],test=r.mode==='test';
  const title=test?'Sprawdzian':r.mode==='weak'?'Słabe strony':'Trening';
  const lvTxt=r.level==='auto'?'poziom automatyczny':'poziom '+LV[r.level];
  const done=test?r.vals.filter((v,k)=>!isEmpty(r.qs[k],v)).length:r.res.filter(Boolean).length;
  const res=test?null:r.res[i];
  let h=`<div class="run-top"><button class="soft" data-act="quit">Zakończ</button><span class="t">${title}</span><span class="note">${lvTxt}</span>${r.deadline?`<span class="timer" id="timer">${mmss(r.deadline-Date.now())}</span>`:''}<span class="cnt">${i+1} / ${r.n}</span></div>
  <div class="bar" aria-hidden="true"><i style="width:${done/r.n*100}%"></i></div>${confirmBar()}`;
  if(test){
    h+=`<div class="sheet-h"><b>kl. 4 Matematyka · grupa ${r.group}</b><span>${esc(S.name)} · ${new Date().toLocaleDateString('pl-PL')}</span></div>
    <p class="note">${r.names.join(' · ')}</p>
    <div class="dots" aria-label="Przejdź do zadania">${r.qs.map((qq,k)=>`<button class="${k===i?'cur':''}${!isEmpty(qq,r.vals[k])?' filled':''}" data-act="jump" data-v="${k}" aria-label="Zadanie ${k+1}">${k+1}</button>`).join('')}</div>`;
  }
  h+=`<article class="card task"><div class="task-h"><span class="tn">Zadanie ${i+1}.</span><span class="pts">(${res?`<span class="got">${res.pts}</span>`:'.....'} / ${q.max} p.)</span><span class="tag">${T[q.topic].name}${test?'':' · '+LV[q.level]}</span></div>
  ${qBody(q,'r',r.vals[i],res)}
  ${!test&&r.hint[i]&&!res?`<p class="hint"><b>Podpowiedź:</b> ${q.hint}</p>`:''}
  ${res?fbHTML(q,res):''}
  <div class="acts">`;
  if(test){
    const left=r.qs.filter((qq,k)=>isEmpty(qq,r.vals[k])).length;
    h+=`${i>0?'<button class="ghost" data-act="prev">Poprzednie</button>':''}${i+1<r.n?'<button class="primary" data-act="tnext">Następne</button>':''}<button class="${i+1<r.n?'ghost':'primary'} sp" data-act="hand">Oddaj sprawdzian</button></div>`;
    if(r.confirmEnd)h+=`<div class="confirm" style="margin-top:14px"><p>${left?`Bez pełnych odpowiedzi ${plural(left,'zostało','zostały','zostało')} ${left} ${plural(left,'zadanie','zadania','zadań')}. `:''}Oddać sprawdzian do oceny?</p><button class="primary" data-act="handok">Oddaj</button><button class="ghost" data-act="handno">Jeszcze sprawdzę</button></div>`;
  }else{
    h+=res?`<button class="primary" data-act="next">${i+1<r.n?'Następne zadanie':'Zobacz wynik'}</button>`:`<button class="primary" data-act="check">Sprawdź</button>${r.hint[i]?'':'<button class="ghost" data-act="hint">Podpowiedź</button>'}${r.msg?`<span class="warn">${r.msg}</span>`:''}`;
    h+='</div>';
  }
  return h+'</article>';
}

function yoursText(q,vals){return q.fields.map((fd,j)=>fd.mark?(vals[j]!=null?'kreska nr '+vals[j]:'—'):fd.kind==='sel'?selLabel(fd,vals[j]):(String(vals[j]??'').trim()?esc(vals[j]):'—')).join(', ')}
function vResult(){
  const r=RUN,s=r.summary,test=r.mode==='test',[g,gn]=gradeOf(s.pct);
  const full=r.res.filter(x=>x&&x.pts===x.max).length;
  const errTopics=[...new Set(r.qs.map((q,k)=>r.res[k]&&r.res[k].pts<q.max?q.topic:null).filter(Boolean))];
  const pathLost=r.qs.reduce((a,q,k)=>a+(r.res[k]?q.fields.filter((fd,j)=>fd.path&&!r.res[k].ok[j]).length:0),0);
  const pathAll=r.qs.reduce((a,q)=>a+q.fields.filter(fd=>fd.path).length,0);
  const names={6:'celujący',5:'bardzo dobry',4:'dobry',3:'dostateczny',2:'dopuszczający',1:'niedostateczny'};
  let h=`<section class="hello"><span class="eyebrow">${test?'Wynik sprawdzianu':'Wynik treningu'}</span><h1>${s.pct>=90?'Świetna robota!':s.pct>=60?'Dobra robota!':'Jest nad czym popracować'}</h1></section>
  <section class="card res-top">
    ${test?`<div class="stamp" aria-label="Ocena ${g}"><b>${g}</b><span>${gn}</span></div>`:''}
    <div class="stack" style="gap:6px;min-width:0">
      <div class="big">${s.pts} <small>/ ${s.max} p.</small></div>
      <p><b>${s.pct}%</b> ${test?`· ocena ${names[g]}`:`· ${full} ${plural(full,'zadanie','zadania','zadań')} w pełni dobrze`} · czas ${mmss(s.time)}</p>
      ${pathAll?`<p class="note">Droga do wyniku: ${pathAll-pathLost} z ${pathAll} kroków poprawnych.</p>`:''}
      ${test?'<p class="scale">Skala: 98–100% = 6, 90–97% = 5, 75–89% = 4, 60–74% = 3, 40–59% = 2, 0–39% = 1.</p>':''}
    </div>
  </section>
  <div class="acts" style="margin-top:0">${errTopics.length?`<button class="primary" data-act="fix" data-v="${errTopics.join(',')}">Poćwicz tematy z błędami (${errTopics.length})</button>`:''}
    <button class="${errTopics.length?'ghost':'primary'}" data-act="again">${test?'Nowy sprawdzian':'Jeszcze raz'}</button><button class="ghost" data-act="go" data-v="progress">Zobacz postępy</button></div>
  <section class="stack"><h2>Zadania</h2><p class="note">Kliknij zadanie, żeby zobaczyć rozwiązanie.</p><div class="rlist">`;
  r.qs.forEach((q,k)=>{const x=r.res[k];if(!x)return;const m=x.pts===x.max?['y','✓']:x.pts?['p','½']:['n','✗'];
    h+=`<details class="ritem"${x.pts<x.max&&test?' open':''}><summary><span class="mark ${m[0]}">${m[1]}</span><span>Zadanie ${k+1}. ${T[q.topic].name}</span><span class="rp">${x.pts}/${x.max}</span></summary>
    <div class="rb">${q.kang?q.html:`<div class="q-text">${q.html}</div>`}${q.line?`<div class="axis">${lineSVG(q,'v'+k,r.vals[k],true,true)}</div>`:''}
    <p class="ans-line">Twoje odpowiedzi: <b>${yoursText(q,r.vals[k])}</b></p><p class="ans-line">Poprawnie: ${q.fields.map(ansText).join('; ')}</p><p class="expl note" style="color:var(--fg)">${q.expl}</p></div></details>`});
  return h+'</div></section>'+sendPanel();
}

function histRow(s){const d=new Date(s.d);const m={train:'Trening',test:'Sprawdzian',weak:'Słabe strony'}[s.mode]||s.mode;
  const sc=s.chs?' · '+s.chs.map(id=>C[id]?C[id].sym:'').join(' '):'';
  return`<div class="hrow"><span class="d">${d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'})} ${d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}</span><span>${m}${sc}${s.level&&s.level!=='auto'?' · '+LV[s.level]:''}</span><span class="s">${s.pts}/${s.max} · ${s.pct}%</span><span class="g">${s.grade||''}</span></div>`}

function chartSVG(list){
  const W=620,H=210,l=36,rt=10,t=26,b=28,ih=H-t-b,n=list.length,slot=(W-l-rt)/Math.max(n,6),bw=Math.min(34,slot*.6);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wyniki ostatnich sesji w procentach">`;
  [0,50,75,100].forEach(v=>{const y=t+ih-ih*v/100;s+=`<line x1="${l}" x2="${W-rt}" y1="${y}" y2="${y}" class="gl"/><text x="${l-6}" y="${y+4}" class="gt" text-anchor="end">${v}%</text>`});
  list.forEach((x,i)=>{const cx=l+slot*i+slot/2,hgt=Math.max(2,ih*x.pct/100),y=t+ih-hgt;
    s+=`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${hgt}" rx="3" class="${x.mode==='test'?'bx':'bt'}"/>`;
    s+=x.grade?`<text x="${cx}" y="${y-6}" class="gr">${x.grade}</text>`:`<text x="${cx}" y="${y-6}" class="vl">${x.pct}</text>`;
    const d=new Date(x.d);s+=`<text x="${cx}" y="${H-8}" class="gt" text-anchor="middle">${d.getDate()}.${d.getMonth()+1}</text>`});
  return s+'</svg>';
}

function vProgress(){
  const all=TOPICS.flatMap(t=>(S.topics[t.id]||{recent:[]}).recent);
  const overall=all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length*100):null;
  const grades=S.sessions.filter(s=>s.grade).map(s=>s.grade);
  const last=S.sessions.slice(-12);
  return`<section class="hello"><span class="eyebrow">Postępy</span><h1>Jak idzie nauka</h1>
    <p class="lead">Skuteczność liczona jest z ostatnich 20 zadań w każdym temacie, więc pokazuje, co umiesz teraz, a nie miesiąc temu.</p></section>
  ${sendPanel()}
  <section class="tiles">
    <div class="tile"><b>${S.count}</b><span>rozwiązanych zadań</span></div>
    <div class="tile"><b>${overall==null?'—':overall+'%'}</b><span>średnia skuteczność</span></div>
    <div class="tile"><b>${streak()}</b><span>${plural(streak(),'dzień','dni','dni')} nauki z rzędu</span></div>
    <div class="tile"><b>${grades.length?Math.max(...grades):'—'}</b><span>najlepsza ocena ze sprawdzianu</span></div>
  </section>
  <section class="stack"><h2>Ostatnie sesje</h2>
    ${last.length?`<div class="card chart">${chartSVG(last)}<div class="legend"><span><i style="background:var(--ink)"></i>trening (% poprawnych)</span><span><i style="background:var(--red)"></i>sprawdzian (ocena)</span></div></div>`:'<div class="empty">Tu pojawi się wykres po pierwszym treningu lub sprawdzianie.</div>'}
  </section>
  ${CH.map(c=>{const a=chAcc(c.id);return`<section class="stack"><div class="row" style="justify-content:space-between"><h2><span class="hl">${c.sym}</span> ${c.name}</h2><span class="note">${a==null?'jeszcze nie ćwiczone':'skuteczność '+Math.round(a*100)+'%'}</span></div><div class="card ttable">
    ${topicsOf(c.id).map(t=>{const a=acc(t.id),[cl]=status(a),L=lvl(t.id),n=(S.topics[t.id]||{att:0}).att;
      return`<div class="trow"><span class="nm">${t.name}<br><span class="note">${n?`${n} ${plural(n,'zadanie','zadania','zadań')}`:'jeszcze nie ćwiczone'}</span></span>
      <span class="mini">${a!=null?`<i class="c-${cl}" style="width:${Math.max(4,Math.round(a*100))}%"></i>`:''}</span>
      <span class="pc">${a==null?'—':Math.round(a*100)+'%'}</span>
      <span class="lvdots" title="Poziom: ${LV[L]}">${[1,2,3].map(k=>`<i class="${k<=L?'on':''}"></i>`).join('')}</span>
      <button class="soft" data-act="topic" data-id="${t.id}">Ćwicz</button></div>`}).join('')}
  </div></section>`}).join('')}
  <p class="note">Kropki pokazują poziom automatyczny danego tematu: podstawowy, rozszerzony albo zaawansowany.</p>
  ${S.sessions.length?`<section class="stack"><h2>Historia</h2><div class="card hist">${S.sessions.slice(-15).reverse().map(histRow).join('')}</div></section>`:''}
  <section class="card stack"><h2>Ustawienia</h2>
    <label class="row" for="name-in"><span class="lbl">Imię ucznia</span><input id="name-in" class="name-in" value="${esc(S.name)}" maxlength="24"></label>
    <p class="note">Wyniki zapisują się w tej przeglądarce na tym urządzeniu.</p>
    ${CONFIRM_RESET?`<div class="confirm"><p>Usunąć wszystkie wyniki i poziomy? Tego nie da się cofnąć.</p><button class="primary danger" data-act="resetok">Tak, usuń</button><button class="ghost" data-act="resetno">Anuluj</button></div>`:'<div><button class="soft" data-act="reset">Wyczyść postępy</button></div>'}
  </section>`;
}

/* ---------- wysyłanie wyników ---------- */
const MAIL='tomek.kno@gmail.com';
let SEND={copied:false,show:false,msg:'',f:{n:'',g:'',hard:'',note:''}};
const MODE_N={train:'Trening',test:'Sprawdzian',weak:'Słabe strony'};
function sessLine(s){const d=new Date(s.d);return`${d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'})} ${d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})} · ${MODE_N[s.mode]||s.mode}${s.chs?' ['+s.chs.map(id=>C[id]?C[id].name:id).join(', ')+']':''}${s.level&&s.level!=='auto'?' ('+LV[s.level]+')':''} · ${s.pts}/${s.max} p. · ${s.pct}%${s.grade?' · ocena '+s.grade:''}`}
function summaryText(){
  const all=TOPICS.flatMap(t=>(S.topics[t.id]||{recent:[]}).recent);
  const overall=all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length*100)+'%':'brak danych';
  const tests=S.sessions.filter(s=>s.mode==='test').slice(-5).reverse();
  const last=S.sessions[S.sessions.length-1];
  let t=`Wyniki: ${S.name} · Matematyka kl. 4\nStan na: ${new Date().toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'})}\n\n`;
  const td=today(),tds=S.sessions.filter(s=>ymd(new Date(s.d))===td);
  t+=`DZISIAJ: ${S.daily[td]||0} ${plural(S.daily[td]||0,'zadanie','zadania','zadań')}`;
  if(tds.length){const p=tds.reduce((a,s)=>a+s.pts,0),m=tds.reduce((a,s)=>a+s.max,0);t+=` · ${tds.length} ${plural(tds.length,'sesja','sesje','sesji')} · ${p}/${m} p. (${Math.round(p/m*100)}%)\n${tds.map(s=>'- '+sessLine(s)).join('\n')}`}
  t+='\n\n';
  if(last&&ymd(new Date(last.d))!==td)t+=`Ostatnia nauka: ${sessLine(last)}\n\n`;
  const wk=TOPICS.filter(x=>{const a=acc(x.id);return a!=null&&a<.5}).map(x=>x.name);
  const top=TOPICS.filter(x=>{const a=acc(x.id);return a!=null&&a>=.8}).map(x=>x.name);
  t+=`OGÓŁEM\nRozwiązane zadania: ${S.count}\nŚrednia skuteczność: ${overall}\nDni nauki z rzędu: ${streak()}\nDni nauki łącznie: ${S.days.length}\n`;
  t+=`Opanowane tematy: ${top.length?top.join(', '):'jeszcze żaden'}\nDo poprawy: ${wk.length?wk.join(', '):'brak'}\n\n`;
  t+=`Sprawdziany:\n${tests.length?tests.map(s=>'- '+sessLine(s)).join('\n'):'- jeszcze żadnego'}\n\n`;
  t+='Działy (skuteczność z ostatnich 20 zadań w temacie):\n';
  t+=CH.map(c=>{const a=chAcc(c.id);const pr=topicsOf(c.id).filter(x=>acc(x.id)!=null);
    return`${c.name}: ${a==null?'nie ćwiczony':Math.round(a*100)+'%'}${pr.length?'\n'+pr.map(x=>`  - ${x.name}: ${Math.round(acc(x.id)*100)}% · ${status(acc(x.id))[1]} · poziom ${LV[lvl(x.id)]}`).join('\n'):''}`}).join('\n');
  const rec=S.sessions.slice(-10).reverse();
  if(rec.length)t+=`\n\nOstatnie sesje:\n${rec.map(s=>'- '+sessLine(s)).join('\n')}`;
  return t;
}
const SMS_NR='793797447';
function smsText(){
  const td=today(),tds=S.sessions.filter(s=>ymd(new Date(s.d))===td),n=S.daily[td]||0;
  const all=TOPICS.flatMap(t=>(S.topics[t.id]||{recent:[]}).recent);
  const overall=all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length*100)+'%':'-';
  let t=`${S.name} - matma: dziś ${n} ${plural(n,'zadanie','zadania','zadań')}`;
  if(tds.length){const p=tds.reduce((a,s)=>a+s.pts,0),m=tds.reduce((a,s)=>a+s.max,0);t+=`, ${p}/${m} p. (${Math.round(p/m*100)}%)`}
  const g=tds.filter(s=>s.grade).map(s=>s.grade);
  if(g.length)t+=`, ${g.length>1?'oceny':'ocena'} ze sprawdzianu: ${g.join(', ')}`;
  else{const lt=S.sessions.filter(s=>s.grade).pop();if(lt)t+=`. Ostatni sprawdzian: ${lt.grade} (${new Date(lt.d).toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'})})`}
  t+=`. Razem ${S.count} zadań, skuteczność ${overall}, ${streak()} ${plural(streak(),'dzień','dni','dni')} z rzędu.`;
  const wk=TOPICS.filter(x=>{const a=acc(x.id);return a!=null&&a<.5}).map(x=>x.name);
  if(wk.length)t+=` Do poprawy: ${wk.slice(0,6).join(', ')}.`;
  return t;
}
const SF_L={n:'Ile zadań zrobiłem dziś',g:'Ocena z ostatniego sprawdzianu',hard:'Co sprawiało mi trudność',note:'Uwagi (nieobowiązkowe)'};
function sendText(){const f=SEND.f;return`Wyniki z matematyki: ${S.name}\nData: ${new Date().toLocaleDateString('pl-PL')}\n\n`+['n','g','hard','note'].filter(k=>f[k].trim()).map(k=>`${SF_L[k]}: ${f[k].trim()}`).join('\n')}
function sendOk(){const f=SEND.f;if(!f.n.trim()||!f.g.trim()){SEND.msg='Wpisz najpierw, ile zadań zrobiłeś i jaką masz ocenę.';render();return false}SEND.msg='';return true}
function sendPanel(){
  const td=S.daily[ymd(new Date())]||0,lt=S.sessions.filter(s=>s.grade).pop();
  const f=SEND.f;
  return`<section class="card stack"><h2>Wyślij wyniki do taty</h2>
    <p class="note">Wpisz wyniki sam. W aplikacji dziś: <b>${td}</b> ${plural(td,'zadanie','zadania','zadań')}${lt?`, ostatnia ocena ze sprawdzianu: <b>${lt.grade}</b>`:''}.</p>
    <label class="fld wide"><span>${SF_L.n}</span><input class="sf" data-sf="n" inputmode="numeric" autocomplete="off" value="${esc(f.n)}"></label>
    <label class="fld wide"><span>${SF_L.g}</span><input class="sf" data-sf="g" inputmode="numeric" autocomplete="off" value="${esc(f.g)}"></label>
    <label class="fld wide"><span>${SF_L.hard}</span><input class="sf txt" data-sf="hard" autocomplete="off" value="${esc(f.hard)}"></label>
    <label class="fld wide"><span>${SF_L.note}</span><input class="sf txt" data-sf="note" autocomplete="off" value="${esc(f.note)}"></label>
    <div class="symbar"><span>Znaki:</span>${['−','+','·',':','=','(',')',',','/'].map(c=>`<button type="button" data-sym="${c}">${c}</button>`).join('')}</div>
    <div class="row"><button class="primary" data-act="smail">Wyślij e-mailem</button><button class="primary" data-act="ssms">Wyślij SMS-em</button><button class="ghost" data-act="copy">Skopiuj</button>${SEND.copied?'<span class="okmsg">Skopiowano</span>':''}${SEND.msg?`<span class="warn">${SEND.msg}</span>`:''}</div>
    <p class="note">E-mail trafi na <span class="mail">${MAIL}</span>, SMS na <span class="mail">${SMS_NR.replace(/(\d{3})(?=\d)/g,'$1 ')}</span>. Otworzy się poczta albo Wiadomości z Twoim tekstem; trzeba go jeszcze wysłać.</p>
    ${SEND.show?`<textarea class="sum-box" id="sum-box" readonly aria-label="Wyniki do wysłania">${esc(sendText())}</textarea>`:''}
  </section>`;
}

function render(){
  const nav=VIEW==='run'||VIEW==='result'?(RUN&&RUN.mode==='test'?'test':RUN&&RUN.mode==='train'?'train':''):VIEW==='ch'?'home':VIEW;
  document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===nav));
  $('#main').innerHTML=({home:vHome,ch:vCh,train:vTrain,test:vTest,fun:vFun,progress:vProgress,run:vRun,result:vResult})[VIEW]();
}
function go(v){
  if(VIEW==='run'&&RUN&&!RUN.done&&v!=='run'){RUN.pending=v;render();scrollTo(0,0);return}
  CONFIRM_RESET=false;VIEW=v;render();scrollTo(0,0);
}

/* ---------- events ---------- */
document.querySelector('.nav').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
$('#main').addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='name-in'){S.name=el.value.trim()||'Franek';save();return}
  if(el.dataset.sf){SEND.f[el.dataset.sf]=el.value;SEND.msg='';return}
  if(el.dataset.k==null)return;const k=+el.dataset.k;
  if(el.dataset.ns==='w')WARM.vals[k]=el.value;
  else if(RUN){RUN.vals[RUN.i][k]=el.value;if(RUN.mode==='test'){const d=document.querySelectorAll('.dots button')[RUN.i];d&&d.classList.toggle('filled',!isEmpty(RUN.qs[RUN.i],RUN.vals[RUN.i]))}}
});
$('#main').addEventListener('change',e=>{
  if(e.target.id==='x-timer'){TEST.timer=e.target.checked;return}
  if(e.target.id==='t-path'){TRAIN.path=e.target.checked;return}
  if(e.target.tagName==='SELECT'&&e.target.dataset.k!=null){const k=+e.target.dataset.k;if(e.target.dataset.ns==='w')WARM.vals[k]=e.target.value;else if(RUN){RUN.vals[RUN.i][k]=e.target.value;if(RUN.mode==='test'){const d=document.querySelectorAll('.dots button')[RUN.i];d&&d.classList.toggle('filled',!isEmpty(RUN.qs[RUN.i],RUN.vals[RUN.i]))}}}
});
function act(a,el){
  const v=el.dataset.v;
  switch(a){
    case'go':go(v);break;
    case'weak':startRun('weak',{topics:weakTopics(),level:'auto',n:10});break;
    case'topic':startRun('train',{topics:[el.dataset.id],level:'auto',n:8});break;
    case'chopen':{const id=el.dataset.id;if(id==='k'){go('fun')}else{CHV=id;VIEW='ch';render();scrollTo(0,0)}break}
    case'chtrain':startRun('train',{topics:topicsOf(el.dataset.id).map(t=>t.id),level:'auto',n:12});focusFirst();break;
    case'chtest':TEST.chs=new Set([el.dataset.id]);go('test');break;
    case'kstart':startRun('train',{topics:['kang'],level:'auto',n:+v,path:true});focusFirst();break;
    case'ktest':TEST.chs=new Set(['k']);go('test');break;
    case'wcheck':{const q=WARM.q;if(isEmpty(q,WARM.vals)){WARM.msg=q.fields.some(fd=>fd.mark)?'Kliknij kreskę na osi.':'Wypełnij wszystkie pola.';render();return}
      const r=gradeQ(q,WARM.vals);r.verdict=verdict(r);r.lvMsg=record(q,r.pts,r.max,true);WARM.res=r;WARM.msg='';render();const b=document.querySelector('[data-act="wnext"]');b&&b.focus({preventScroll:true});break}
    case'wnext':newWarm();render();focusFirst();break;
    case'whint':WARM.hint=true;render();break;
    case'tick':{const ns=el.dataset.ns,k=+el.dataset.k,t=+el.dataset.t;if(ns==='w'){WARM.vals[k]=t;WARM.msg=''}else{RUN.vals[RUN.i][k]=t;RUN.msg=''}render();
      const g=document.querySelector(`[data-act="tick"][data-t="${t}"]`);g&&g.focus({preventScroll:true});break}
    case'tchip':{const id=el.dataset.id;TRAIN.topics.has(id)?TRAIN.topics.delete(id):TRAIN.topics.add(id);render();break}
    case'tch':{const ts=topicsOf(el.dataset.id).map(t=>t.id),on=ts.every(id=>TRAIN.topics.has(id));ts.forEach(id=>on?TRAIN.topics.delete(id):TRAIN.topics.add(id));render();break}
    case'tlv':TRAIN.level=v==='auto'?'auto':+v;render();break;
    case'tn':TRAIN.n=+v;render();break;
    case'tstart':if(TRAIN.topics.size)startRun('train',{topics:[...TRAIN.topics],level:TRAIN.level,n:TRAIN.n});focusFirst();break;
    case'xch':{const id=el.dataset.id;if(TEST.chs.has(id)){if(TEST.chs.size>1)TEST.chs.delete(id)}else TEST.chs.add(id);render();break}
    case'xlv':TEST.level=+v;render();break;
    case'xstart':startRun('test',{level:TEST.level,timer:TEST.timer,chs:[...TEST.chs]});focusFirst();break;
    case'check':doCheck();break;
    case'hint':RUN.hint[RUN.i]=true;render();break;
    case'next':doNext();break;
    case'tnext':RUN.i++;RUN.confirmEnd=false;render();focusFirst();break;
    case'prev':RUN.i--;RUN.confirmEnd=false;render();focusFirst();break;
    case'jump':RUN.i=+v;RUN.confirmEnd=false;render();focusFirst();break;
    case'hand':RUN.confirmEnd=true;render();break;
    case'handno':RUN.confirmEnd=false;render();break;
    case'handok':finishTest();break;
    case'quit':RUN.pending='home';render();scrollTo(0,0);break;
    case'quitno':RUN.pending=null;render();break;
    case'quitok':{const t=RUN.pending;clearInterval(TIMER);RUN.done=true;RUN=null;VIEW=t;render();scrollTo(0,0);break}
    case'again':if(RUN.mode==='test')startRun('test',Object.assign({},RUN.opts,{timer:!!RUN.deadline}));else startRun(RUN.mode,Object.assign({},RUN.opts,{topics:[...new Set(RUN.order)]}));focusFirst();break;
    case'fix':{const ts=v.split(',');startRun('train',{topics:ts,level:'auto',n:Math.max(6,Math.min(15,ts.length*2))});focusFirst();break}
    case'smail':if(sendOk())window.open(`mailto:${MAIL}?subject=${encodeURIComponent('Wyniki z matematyki: '+S.name)}&body=${encodeURIComponent(sendText())}`,'_blank');break;
    case'ssms':if(sendOk())window.open(`sms:+48${SMS_NR}?&body=${encodeURIComponent(sendText().replace(/\n+/g,'; '))}`,'_blank');break;
    case'copy':{if(!sendOk())break;const txt=sendText();const done=ok=>{SEND.copied=ok;SEND.show=!ok;render();
        if(!ok){const b=$('#sum-box');if(b){b.focus();b.select()}}else setTimeout(()=>{SEND.copied=false;if(VIEW==='progress'||VIEW==='result')render()},2500)};
      try{navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false))}catch(e){done(false)}break}
    case'reset':CONFIRM_RESET=true;render();break;
    case'resetno':CONFIRM_RESET=false;render();break;
    case'resetok':S=blank();save();CONFIRM_RESET=false;WARM=null;render();break;
  }
}
document.addEventListener('focusin',e=>{if(e.target.tagName==='INPUT'&&e.target.closest('#main'))LASTIN=e.target});
$('#main').addEventListener('mousedown',e=>{if(e.target.closest('[data-sym]'))e.preventDefault()});
$('#main').addEventListener('click',e=>{const sb=e.target.closest('[data-sym]');if(!sb)return;
  let inp=LASTIN&&document.body.contains(LASTIN)&&!LASTIN.disabled?LASTIN:null;

  if(!inp)return;const c=sb.dataset.sym,a=inp.selectionStart==null?inp.value.length:inp.selectionStart,b=inp.selectionEnd==null?a:inp.selectionEnd;
  inp.value=inp.value.slice(0,a)+c+inp.value.slice(b);inp.focus();try{inp.setSelectionRange(a+1,a+1)}catch(_){}
  inp.dispatchEvent(new Event('input',{bubbles:true}))});
$('#main').addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.tagName==='INPUT'||el.tagName==='SELECT')return;act(el.dataset.act,el)});
$('#main').addEventListener('keydown',e=>{
  if(e.key!=='Enter'&&e.key!==' ')return;
  const el=e.target;
  if(el.dataset&&el.dataset.act==='tick'){e.preventDefault();act('tick',el);return}
  if(e.key!=='Enter'||el.tagName!=='INPUT'||el.dataset.k==null)return;
  e.preventDefault();
  if(el.dataset.ns==='w'){act('wcheck',el);return}
  if(!RUN)return;
  const sel='#main .fields input:not([disabled]),#main .fields select:not([disabled])';
  if(RUN.mode==='test'){const ins=[...document.querySelectorAll(sel)];const ix=ins.indexOf(el);if(ix<ins.length-1)ins[ix+1].focus();else if(RUN.i+1<RUN.n)act('tnext',el);return}
  const ins=[...document.querySelectorAll(sel)];const ix=ins.indexOf(el);
  if(ix>=0&&ix<ins.length-1)ins[ix+1].focus();else doCheck();
});
