<script>
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const P=a=>a[Math.floor(Math.random()*a.length)];
const plural=(n,a,b,c)=>{if(n===1)return a;const u=n%10,t=n%100;return(u>=2&&u<=4&&(t<12||t>14))?b:c};
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const pickN=(a,n)=>shuffle(a).slice(0,n);
const ymd=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const today=()=>ymd(new Date());
const LV={1:'łatwy',2:'średni',3:'trudny'};
const CUR=new Date().getFullYear();

/* liczby rzymskie i wieki */
const toRoman=n=>{const m=[[1000,'M'],[900,'CM'],[500,'D'],[400,'CD'],[100,'C'],[90,'XC'],[50,'L'],[40,'XL'],[10,'X'],[9,'IX'],[5,'V'],[4,'IV'],[1,'I']];let s='';for(const[v,r]of m)while(n>=v){s+=r;n-=v}return s};
const fromRoman=s=>{const v={I:1,V:5,X:10,L:50,C:100,D:500,M:1000};let n=0;for(let i=0;i<s.length;i++){const a=v[s[i]],b=v[s[i+1]];if(!a)return NaN;n+=b>a?-a:a}return toRoman(n)===s?n:NaN};
const cent=y=>Math.ceil(y/100);
const rk=(y,bc,ne)=>`${y} roku${bc?' p.n.e.':ne?' n.e.':''}`;
const near=(ok,extra=[])=>{const c=[...new Set([ok+1,ok-1,ok+10,ok-10,ok+2,ok-2,ok+5,...extra].filter(x=>x>0&&x!==ok))];return pickN(c,3).map(String)};
const rnear=n=>{const ok=toRoman(n);const c=[...new Set([n+1,n-1,n+2,n-2,n+10,n-10,n+5,n-5].filter(x=>x>0).map(toRoman).filter(x=>x!==ok))];return pickN(c,3)};
const wnear=(c,bc)=>{const ok=toRoman(c)+(bc?' p.n.e.':'');const cs=[...new Set([c+1,c-1,c+2,c-2].filter(x=>x>0))];return pickN(cs,3).map(x=>toRoman(x)+(bc?' p.n.e.':''))};

/* ---------- typy zadań ---------- */
function D(l,fn){return{l,f:()=>{const o=fn();const opts=shuffle([o.ok,...o.bad]);return{type:'one',html:o.q,opts,fields:[{ans:opts.indexOf(o.ok)}],expl:o.expl,hint:o.hint,key:o.q}}}}
const O=(l,q,ok,bad,expl,hint)=>D(l,()=>({q,ok,bad,expl,hint}));
function SQ(l,q,cats,pool,n,expl,hint){return{l,f:()=>{
  let ch=[];cats.forEach((c,ci)=>{const g=pool.filter(p=>p[1]===ci);if(g.length&&ch.length<n)ch.push(P(g))});
  ch=ch.concat(pickN(pool.filter(p=>!ch.includes(p)),n-ch.length));ch=shuffle(ch);
  const ex=typeof expl==='function'?expl(ch,cats):expl;
  return{type:'sort',html:q,cats,fields:ch.map(p=>({item:p[0],ans:p[1]})),expl:ex,hint,key:q+ch.map(p=>p[0]).join('|')}}}}
function Ord(l,q,steps,expl,hint){return{l,f:()=>{let s;do{s=shuffle(steps.map((_,i)=>i))}while(s.every((v,i)=>v===i));
  return{type:'order',html:q,steps,shuf:s,fields:steps.map((_,k)=>({ans:k})),expl,hint,key:q+Math.random()}}}}
const SQd=(l,q,cats,poolFn,n,expl,hint)=>({l,f:()=>SQ(l,q,cats,poolFn(),n,expl,hint).f()});
const OrdD=(l,q,genFn)=>({l,f:()=>{const g=genFn();return Ord(l,q,g.steps,g.expl,g.hint).f()}});
const NM=(l,fn)=>({l,f:()=>{const o=fn();return{type:'num',html:o.q,fields:o.fields,expl:o.expl,hint:o.hint,key:o.q}}});
const F=(label,ans,kind,more)=>Object.assign({label,ans,kind:kind||'n'},more||{});
const listExpl=(ch,cats)=>ch.map(p=>`${p[0]} – ${cats[p[1]]}`).join('; ')+'.';

/* sprawdzanie odpowiedzi liczbowych: n = liczba, w = wiek (rzymski lub arabski), r = liczba rzymska */
function chk(fd,raw){
  if(fd.kind==='t'){const n=x=>String(x==null?'':x).trim().toLowerCase().replace(/\s+/g,' ').replace(/[.!?]+$/,'');return [fd.ans,...(fd.alts||[])].map(n).includes(n(raw))}
  let s=String(raw==null?'':raw).trim().toUpperCase().replace(/\s+/g,' ');
  s=s.replace(/\b(WIEK|LAT|LATA|DNI|DZIEŃ|KM|WIEKÓW|WIEKI|P\.N\.E\.|N\.E\.)\b/g,'').replace(/\./g,'').replace(/\s+/g,' ').trim();
  if(fd.kind==='r')return s.replace(/\s/g,'')===fd.ans;
  if(fd.kind==='w'){if(/^\d+$/.test(s))return+s===fd.ans;return fromRoman(s.replace(/\s/g,''))===fd.ans}
  s=s.replace(/ /g,'');return /^\d+$/.test(s)&&+s===fd.ans;
}

const SUBJECTS={};
SUBJECTS.hist=(()=>{
const TOPICS=[
 {id:'hist',ch:1,name:'Co to jest historia',hint:'Historia to przeszłość, opowieść o niej i nauka o przeszłości. Historycy badają ludzi, którzy żyli naprawdę, i wydarzenia, do których naprawdę doszło, a najważniejsza jest dla nich prawda. W baśniach bohaterowie i zdarzenia są wymyślone, w legendach prawda miesza się z nieprawdą. Historia pomaga zrozumieć świat i przewidywać skutki działań.'},
 {id:'zrodla',ch:1,name:'Rodzaje źródeł historycznych',hint:'Źródłem jest każdy ślad działalności człowieka. Materialne pisane: książki, kroniki, dokumenty, listy, gazety, mapy. Materialne niepisane: budowle, obrazy, rzeźby, odzież, zdjęcia, przedmioty. Niematerialne: tradycja, obyczaje, przekazy ustne. Archeolodzy szukają materialnych śladów na wykopaliskach.'},
 {id:'wiary',ch:1,name:'Wiarygodność źródeł i praca historyka',hint:'Wiarygodność źródła to na ile zawarte w nim informacje są pewne. Historyk ustala, kto, kiedy i w jakim celu je stworzył, porównuje je z innymi źródłami i ustaleniami archeologów. Fakt można sprawdzić, a opinia to czyjś pogląd.'},
 {id:'przyczyny',ch:1,name:'Przyczyny i skutki',hint:'Przyczyny: dlaczego do czegoś doszło. Skutki: co z tego wynikło. Związki przyczynowo-skutkowe to zależności między wydarzeniami, w których jedno prowadziło do drugiego (np. wynalezienie druku przez Gutenberga).'},
 {id:'rodzina',ch:2,name:'Jak poznać historię rodziny',hint:'Źródła wiedzy o rodzinie: opowieści krewnych i pamiątki rodzinne (zdjęcia, dokumenty, listy, przedmioty codziennego użytku). Krewni mają wspólnego przodka.'},
 {id:'drzewo',ch:2,name:'Drzewo genealogiczne',hint:'Najstarsi przodkowie są na dole (pień), najmłodsi na górze. Obrączki łączą małżonków. Genealogia bada historię rodziny.'},
 {id:'tradycje',ch:2,name:'Tradycje rodzinne',hint:'Tradycja to zwyczaje, wspólny zawód, zamiłowania, przepisy. Wzmacnia więzi i pozwala utrzymać bliski kontakt.'},
 {id:'chrono',ch:3,name:'Chronologia i oś czasu',hint:'Chronologia to nauka o mierzeniu czasu. Porządek chronologiczny: od najdawniejszego do najnowszego. Na osi czasu najstarsze po lewej, najnowsze po prawej.'},
 {id:'jedn',ch:3,name:'Jednostki czasu',hint:'Rok = 365 lub 366 dni, wiek (stulecie) = 100 lat, tysiąclecie = 1000 lat = 10 wieków.'},
 {id:'ery',ch:3,name:'Ery i prehistoria',hint:'Nasza era (n.e.) liczy się od narodzin Jezusa z Nazaretu, wcześniejsze czasy to p.n.e. Nie było roku zerowego. Historia zaczyna się od wynalezienia pisma, wcześniej była prehistoria.'},
 {id:'epoki',ch:3,name:'Epoki historyczne',hint:'Starożytność (ok. 3400 p.n.e. – 476), średniowiecze (476 – 1492), nowożytność (1492 – 1918), współczesność (od 1918).'},
 {id:'rzym',ch:3,name:'Liczby rzymskie',hint:'I = 1, V = 5, X = 10, L = 50, C = 100, D = 500, M = 1000. Mniejsza cyfra przed większą się odejmuje (IV = 4, IX = 9, XL = 40).'},
 {id:'oblicz',ch:4,name:'Obliczanie upływu lat',hint:'Ta sama era n.e.: późniejsza − wcześniejsza. P.n.e.: wcześniejsza (większa) − późniejsza (mniejsza). Różne ery: dodaj obie daty i odejmij 1.'},
 {id:'wiek',ch:4,name:'Który to wiek',hint:'Odrzuć dwie ostatnie cyfry i dodaj 1 (1410 → 14 + 1 → XV wiek). Jeśli rok kończy się dwoma zerami, nie dodajesz 1 (1400 → XIV wiek). Dotyczy też p.n.e.'},
 {id:'zegary',ch:5,name:'Jak dawniej mierzono czas',hint:'Słońce i cień (zegar słoneczny), klepsydra z piaskiem, zegary mechaniczne ze średniowiecza (ciężarki, koła zębate, dzwony), zegarki kieszonkowe, na rękę, cyfrowe.'},
 {id:'kal',ch:5,name:'Kalendarz',hint:'Księżycowy (ok. 29 dni, 12 miesięcy) → egipski (365 dni) → juliański (Juliusz Cezar, 29 lutego co 4 lata) → gregoriański (Grzegorz XIII, 1582, pominięto 10 dni).'}
];
const T=Object.fromEntries(TOPICS.map(t=>[t.id,t]));
const CHAPTERS={1:'Lekcje 1–2: Historia, źródła, przyczyny i skutki',2:'Lekcja 3: Historia mojej rodziny',3:'Lekcja 4: Czas w historii',4:'Lekcja 5: Obliczanie czasu w historii',5:'Tajemnice sprzed wieków'};

/* ---------- drzewo genealogiczne ---------- */
const treeHTML=(rows,desc)=>`<div class="tree">${rows.map((r,i)=>`<div class="tr">${i===0?'<span class="tl">góra – najmłodsi</span>':''}${i===rows.length-1?'<span class="tl">dół – najstarsi</span>':''}${r.map(b=>`<span class="tb">${b}</span>`).join('')}</div>`).join('')}<p class="tdesc">${desc}</p></div>`;
const FEM=['Anna','Joanna','Kasia','Teresa','Helena','Zofia','Maria','Ewa','Halina','Irena','Jadwiga','Ola','Danuta','Krystyna'];
const MAS=['Tomasz','Piotr','Stefan','Zbigniew','Jan','Kuba','Marek','Adam','Henryk','Paweł','Ryszard','Andrzej','Józef','Leon'];
function fam(){const f=pickN(FEM,5),m=pickN(MAS,5);return{sis:f[0],mama:f[1],bab:f[2],sb:f[3],pb:f[4],bro:m[0],tata:m[1],stryj:m[2],dz:m[3],pd:m[4]}}
const famHTML=p=>treeHTML([[p.sis,'Ja',p.bro],[`${p.mama} 💍 ${p.tata}`,p.stryj],[p.sb,`${p.bab} 💍 ${p.dz}`],[`${p.pb} 💍 ${p.pd}`]],
  `💍 = małżeństwo. ${p.pb} i ${p.pd} mają córki: ${p.sb} i ${p.bab}. ${p.bab} i ${p.dz} mają synów: ${p.tata} i ${p.stryj}. ${p.tata} i ${p.mama} mają dzieci: ${p.sis}, Ja i ${p.bro}.`);
const ROLES_JA=['siostra','brat','mama','tata','stryj (brat taty)','babcia','dziadek','siostra babci','prababcia','pradziadek'];
const ROLES_TATA=['mama','tata','brat','ciocia (siostra mamy)','babcia','dziadek','żona','syn'];
function famRole(l){return D(l,()=>{const p=fam();
  if(l===3){const c=[['bab','mama'],['dz','tata'],['stryj','brat'],['sb','ciocia (siostra mamy)'],['pb','babcia'],['pd','dziadek']],x=P(c);
    return{q:famHTML(p)+`<br>Kim jest <b>${p[x[0]]}</b> dla osoby o imieniu <b>${p.tata}</b>?`,ok:x[1],bad:pickN(ROLES_TATA.filter(r=>r!==x[1]),3),expl:`${p[x[0]]} to ${x[1]} dla osoby ${p.tata}. ${p.tata} jest synem ${p.bab} i ${p.dz}, więc jego rodzicami są oni, a siostra jego mamy to ciocia.`}}
  const pool=l===1?[['sis','siostra'],['bro','brat'],['mama','mama'],['tata','tata'],['bab','babcia'],['dz','dziadek']]:[['stryj','stryj (brat taty)'],['pb','prababcia'],['pd','pradziadek'],['sb','siostra babci'],['bab','babcia'],['dz','dziadek']];
  const x=P(pool);return{q:famHTML(p)+`<br>Kim jest <b>${p[x[0]]}</b> dla osoby „Ja”?`,ok:x[1],bad:pickN(ROLES_JA.filter(r=>r!==x[1]),3),expl:`${p[x[0]]} to ${x[1]} osoby „Ja”. Czytaj drzewo od dołu: starsze pokolenia mają dzieci poziom wyżej.`}})}

SUBJECTS.math={id:'math',key:'lid4-v1',name:'Matematyka',icon:'🔢',eyebrow:'Matematyka kl. 4',topicsTitle:'',desc:'Rozdziały z książki, Kangur, ciekawostki',custom:true,TOPICS:[],T:{},CHAPTERS:{},B:{}};

/* ---------- zapis ---------- */
let KEY;
function blank(){return{v:1,name:'Franek',topics:{},levels:{},sessions:[],days:[],daily:{},count:0}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&s.v===1)return Object.assign(blank(),s)}catch(e){}return blank()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
let S;
const tst=id=>S.topics[id]||(S.topics[id]={att:0,ok:0,recent:[],st:0,wr:0});
const lvl=id=>S.levels[id]||1;
function acc(id){const t=S.topics[id];if(!t||!t.recent.length)return null;return t.recent.reduce((a,b)=>a+b,0)/t.recent.length}
function status(a){if(a==null)return['new','nowy'];if(a<.5)return['low','do poprawy'];if(a<.8)return['mid','ćwicz dalej'];return['top','opanowane']}
function record(q,pts,max,adapt){
  const t=tst(q.topic),fr=pts/max;t.att++;t.ok+=fr;t.recent.push(fr);if(t.recent.length>20)t.recent.shift();
  S.count++;const d=today();if(!S.days.includes(d))S.days.push(d);S.daily[d]=(S.daily[d]||0)+1;
  let msg='';
  if(adapt){
    if(fr===1){t.st++;t.wr=0}else if(fr<.5){t.wr++;t.st=0}else{t.st=0;t.wr=0}
    const L=lvl(q.topic);
    if(t.st>=3&&L<3){S.levels[q.topic]=L+1;t.st=0;msg=`Trzy razy pod rząd bez błędu. Temat „${T[q.topic].name}” przechodzi na poziom ${LV[L+1]}.`}
    else if(t.wr>=2&&L>1){S.levels[q.topic]=L-1;t.wr=0;msg=`Wracamy na chwilę do łatwiejszych zadań z tego tematu (poziom ${LV[L-1]}).`}
  }
  save();return msg;
}
function streak(){const set=new Set(S.days);const d=new Date();if(!set.has(ymd(d)))d.setDate(d.getDate()-1);let n=0;while(set.has(ymd(d))){n++;d.setDate(d.getDate()-1)}return n}
function gradeOf(p){if(p>=98)return[6,'cel'];if(p>=90)return[5,'bdb'];if(p>=75)return[4,'db'];if(p>=60)return[3,'dst'];if(p>=40)return[2,'dop'];return[1,'ndst']}
function weakTopics(){return TOPICS.map(t=>({id:t.id,s:acc(t.id)==null?0.6:acc(t.id),r:Math.random()})).sort((a,b)=>a.s-b.s||a.r-b.r).slice(0,3).map(x=>x.id)}

/* ---------- zadania ---------- */
function makeQ(id,L,seen){
  const bank=B[id];let pool=bank.filter(e=>e.l===L);if(pool.length<3)pool=pool.concat(bank.filter(e=>Math.abs(e.l-L)===1));if(!pool.length)pool=bank;
  let q;for(let k=0;k<10;k++){q=P(pool).f();if(!seen||!seen.has(q.key))break}
  q.topic=id;q.level=L;q.max=q.fields.length;if(!q.hint)q.hint=T[id].hint;seen&&seen.add(q.key);return q;
}
function isEmpty(q,v){if(q.type==='one')return v[0]==null;if(q.type==='order')return v.length<q.fields.length;if(q.type==='num')return q.fields.some((_,k)=>v[k]==null||String(v[k]).trim()==='');return q.fields.some((_,k)=>v[k]==null)}
function gradeQ(q,v){const ok=q.type==='num'?q.fields.map((fd,k)=>fd.mark?v[k]===fd.ans:chk(fd,v[k])):q.fields.map((fd,k)=>v[k]===fd.ans);return{ok,pts:ok.filter(Boolean).length,max:q.max}}

function qBody(q,ns,v,locked,show){
  const dis=locked?' disabled':'';let h=`<div class="q-text">${q.html}</div>`;
  if(q.line)h+=`<div class="axis">${lineSVG(q,ns,v,locked,show)}</div>`;
  if(q.type==='one'){
    const a=q.fields[0].ans;
    h+='<div class="opts">'+q.opts.map((o,i)=>{let c='opt';if(v[0]===i)c+=' sel';if(show&&i===a)c+=' right';if(show&&v[0]===i&&i!==a)c+=' wrong';
      return`<button class="${c}" data-act="pick" data-ns="${ns}" data-v="${i}"${dis}><span class="lt">${'ABCD'[i]}</span><span>${o}</span></button>`}).join('')+'</div>';
  }else if(q.type==='sort'){
    h+='<div class="sorts">'+q.fields.map((fd,k)=>{const x=v[k];let rc='srow';if(show)rc+=x===fd.ans?' ok':' bad';
      return`<div class="${rc}"><span class="si">${fd.item}</span><span class="cats">${q.cats.map((c,ci)=>{let cc='chip';if(x===ci)cc+=' on';if(show&&ci===fd.ans)cc+=' right';if(show&&x===ci&&ci!==fd.ans)cc+=' wrong';
        return`<button class="${cc}" data-act="sort" data-ns="${ns}" data-k="${k}" data-v="${ci}"${dis}>${c}</button>`}).join('')}</span></div>`}).join('')+'</div>';
  }else if(q.type==='num'){
    h+='<div class="sorts">'+q.fields.map((fd,k)=>{if(fd.mark)return'';const x=v[k]==null?'':v[k];const good=show&&chk(fd,x);let rc='srow nrow';if(show)rc+=good?' ok':' bad';
      return`<label class="${rc}"><span class="si">${fd.label||''}</span><input class="num-in" type="text" inputmode="${fd.kind==='n'?'numeric':'text'}" autocomplete="off" autocapitalize="characters" data-nk="${k}" data-ns="${ns}" value="${esc(x)}"${dis} placeholder="${esc(fd.ph||'…')}" aria-label="${esc(fd.label||'odpowiedź')}">${fd.unit?`<span class="unit">${fd.unit}</span>`:''}${show&&!good?`<span class="fix">Powinno być: ${fd.disp!=null?fd.disp:(fd.kind==='w'?toRoman(fd.ans):fd.ans)}</span>`:''}</label>`}).join('')+'</div>';
  }else{
    h+='<ol class="seq">'+q.fields.map((fd,k)=>{const it=v[k];let c='slot';if(it!=null)c+=' full';if(show)c+=it===k?' ok':' bad';
      return`<li class="${c}"><span class="num">${k+1}</span>${it!=null?`<button class="step" data-act="unord" data-ns="${ns}" data-k="${k}"${dis} aria-label="Usuń: ${esc(q.steps[it])}">${q.steps[it]}</button>`:'<span class="ph">dotknij kroku poniżej</span>'}${show&&it!==k?`<span class="fix">Powinno być: ${q.steps[k]}</span>`:''}</li>`}).join('')+'</ol>';
    if(!locked){const rest=q.shuf.filter(i=>!v.includes(i));if(rest.length)h+=`<div class="pool">${rest.map(i=>`<button class="step" data-act="ord" data-ns="${ns}" data-v="${i}">${q.steps[i]}</button>`).join('')}</div>`}
  }
  return h;
}
function fbHTML(q,r){
  const c=r.pts===r.max?'ok':r.pts?'part':'bad';
  const note=r.pts<r.max&&q.type!=='one'?'<p>Poprawne odpowiedzi są zaznaczone na zielono lub podane pod polami.</p>':'';
  return`<div class="fb ${c}" role="status"><p class="fb-v">${r.verdict}</p>${note}<p class="expl">${q.expl}</p>${r.lvMsg?`<p class="lvmsg">${r.lvMsg}</p>`:''}</div>`;
}
const verdict=r=>r.pts===r.max?P(['Dobrze!','Świetnie!','Brawo!','Tak jest!','Bez błędu!']):r.pts?'Prawie. Część jest dobrze.':P(['Jeszcze nie.','Zobacz, jak to jest:']);

/* ---------- stan ---------- */
let VIEW='hub',RUN=null,WARM=null,TIMER=null,CONFIRM_RESET=false;
const TRAIN={topics:new Set(),level:'auto',n:10};
const TEST={level:2,timer:false,long:false};
const $=s=>document.querySelector(s);
function newWarm(){const id=P(TOPICS).id;WARM={q:makeQ(id,lvl(id)),vals:[],res:null,hint:false,msg:''}}
function valsOf(ns){return ns==='w'?WARM.vals:RUN.vals[RUN.i]}

function startRun(mode,o){
  clearInterval(TIMER);const seen=new Set();
  RUN={mode,level:o.level,n:o.n,qs:[],vals:[],res:[],hint:[],i:0,seen,t0:Date.now(),done:false,msg:'',pending:null,confirmEnd:false,group:P(['A','B'])};
  if(mode==='test'){const ids=o.long?TOPICS.flatMap(t=>[t.id,t.id]):TOPICS.map(t=>t.id);RUN.qs=ids.map(id=>makeQ(id,o.level,seen));RUN.n=RUN.qs.length;RUN.vals=RUN.qs.map(()=>[]);
    if(o.timer){RUN.deadline=Date.now()+45*60000;TIMER=setInterval(tick,1000)}}
  else{let order=[];while(order.length<o.n){let s=shuffle(o.topics);if(order.length&&s.length>1&&s[0]===order[order.length-1])s.push(s.shift());order=order.concat(s)}RUN.order=order.slice(0,o.n);ensureQ(0)}
  VIEW='run';render();scrollTo(0,0);
}
function ensureQ(i){if(!RUN.qs[i]){const id=RUN.order[i];RUN.qs[i]=makeQ(id,RUN.level==='auto'?lvl(id):RUN.level,RUN.seen);RUN.vals[i]=[]}}
function tick(){if(!RUN||RUN.done||!RUN.deadline){clearInterval(TIMER);return}const left=RUN.deadline-Date.now();
  if(left<=0){finishTest();return}const el=$('#timer');if(el){el.textContent=mmss(left);el.classList.toggle('low',left<5*60000)}}
const mmss=ms=>{const s=Math.max(0,Math.round(ms/1000));return`${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`};
const emptyMsg=q=>q.type==='one'?'Wybierz jedną odpowiedź.':q.type==='sort'?'Wybierz odpowiedź w każdym wierszu.':q.type==='num'?'Wpisz odpowiedź w każde pole.':'Ułóż wszystkie kroki.';

function doCheck(){
  const i=RUN.i,q=RUN.qs[i],v=RUN.vals[i];
  if(isEmpty(q,v)){RUN.msg=emptyMsg(q);render();return}
  const r=gradeQ(q,v);r.hint=!!RUN.hint[i];r.verdict=verdict(r);
  r.lvMsg=record(q,r.pts,r.max,RUN.level==='auto');RUN.res[i]=r;RUN.msg='';render();
  const b=document.querySelector('[data-act="next"]');b&&b.focus({preventScroll:true});
}
function doNext(){if(RUN.i+1>=RUN.n){finishRun();return}RUN.i++;ensureQ(RUN.i);RUN.msg='';render();scrollTo(0,0)}
function finishRun(){
  RUN.done=true;clearInterval(TIMER);
  const pts=RUN.res.reduce((a,r)=>a+(r?r.pts:0),0),max=RUN.qs.reduce((a,q,k)=>a+(RUN.res[k]?q.max:0),0)||1,pct=Math.round(pts/max*100);
  const s={d:Date.now(),mode:RUN.mode,pts,max,pct,n:RUN.n,level:RUN.level,time:Date.now()-RUN.t0};
  if(RUN.mode==='test')s.grade=gradeOf(pct)[0];
  S.sessions.push(s);if(S.sessions.length>200)S.sessions.shift();save();
  RUN.summary=s;VIEW='result';render();scrollTo(0,0);
}
function finishTest(){RUN.qs.forEach((q,i)=>{const r=gradeQ(q,RUN.vals[i]||[]);r.verdict=verdict(r);RUN.res[i]=r;record(q,r.pts,r.max,false)});finishRun()}

/* ---------- widoki ---------- */
function topicChip(t){const a=acc(t.id),[c,l]=status(a);
  return`<button class="tchip" data-act="topic" data-id="${t.id}"><span class="nm">${t.name}</span><span class="st ${c}">${l}</span><span class="mini">${a!=null?`<i class="c-${c}" style="width:${Math.max(4,Math.round(a*100))}%"></i>`:''}</span></button>`}

function vHome(){
  const td=S.daily[today()]||0,st=streak(),w=weakTopics();
  if(!WARM)newWarm();
  const q=WARM.q,r=WARM.res;
  return`
  <section class="hello"><span class="eyebrow">${SUBJ.eyebrow}</span>
    <h1>Cześć, ${esc(S.name)}!</h1>

function confirmBar(){
  if(!RUN.pending)return'';
  const t=RUN.mode==='test'?'Przerwać sprawdzian? Odpowiedzi nie zostaną ocenione ani zapisane.':'Zakończyć trening? Rozwiązane zadania są już zapisane w postępach.';
  return`<div class="confirm"><p>${t}</p><button class="danger primary" data-act="quitok">Tak, zakończ</button><button class="ghost" data-act="quitno">Wróć do zadań</button></div>`;
}

function vRun(){
  const r=RUN,i=r.i,q=r.qs[i],test=r.mode==='test';
  const title=test?'Sprawdzian':r.mode==='weak'?'Słabe strony':'Trening';
  const lvTxt=r.level==='auto'?'poziom automatyczny':'poziom '+LV[r.level];
  const done=test?r.vals.filter((v,k)=>!isEmpty(r.qs[k],v)).length:r.res.filter(Boolean).length;
  const res=test?null:r.res[i];
  let h=`<div class="run-top"><button class="soft" data-act="quit">Zakończ</button><span class="t">${title}</span><span class="note">${lvTxt}</span>${r.deadline?`<span class="timer" id="timer">${mmss(r.deadline-Date.now())}</span>`:''}<span class="cnt">${i+1} / ${r.n}</span></div>
  <div class="bar" aria-hidden="true"><i style="width:${done/r.n*100}%"></i></div>${confirmBar()}`;
  if(test){
    h+=`<div class="sheet-h"><b>${SUBJ.name} kl. 4 · grupa ${r.group}</b><span>${esc(S.name)} · ${new Date().toLocaleDateString('pl-PL')}</span></div>
    <div class="dots" aria-label="Przejdź do zadania">${r.qs.map((qq,k)=>`<button class="${k===i?'cur':''}${!isEmpty(qq,r.vals[k])?' filled':''}" data-act="jump" data-v="${k}" aria-label="Zadanie ${k+1}">${k+1}</button>`).join('')}</div>`;
  }
  h+=`<article class="card task"><div class="task-h"><span class="tn">Zadanie ${i+1}.</span><span class="pts">(${res?`<span class="got">${res.pts}</span>`:'.....'} / ${q.max} p.)</span><span class="tag">${T[q.topic].name}${test?'':' · '+LV[q.level]}</span></div>
  ${qBody(q,'r',r.vals[i],!!res,!!res)}
  ${!test&&r.hint[i]&&!res?`<p class="hint"><b>Podpowiedź:</b> ${q.hint}</p>`:''}
  ${res?fbHTML(q,res):''}
  <div class="acts">`;
  if(test){
    const left=r.qs.filter((qq,k)=>isEmpty(qq,r.vals[k])).length;
    h+=`${i>0?'<button class="ghost" data-act="prev">Poprzednie</button>':''}${i+1<r.n?'<button class="primary" data-act="tnext">Następne</button>':''}<button class="${i+1<r.n?'ghost':'primary'} sp" data-act="hand">Oddaj sprawdzian</button></div>`;
    if(r.confirmEnd)h+=`<div class="confirm" style="margin-top:14px"><p>${left?`Bez pełnej odpowiedzi ${plural(left,'zostało','zostały','zostało')} ${left} ${plural(left,'zadanie','zadania','zadań')}. `:''}Oddać sprawdzian do oceny?</p><button class="primary" data-act="handok">Oddaj</button><button class="ghost" data-act="handno">Jeszcze sprawdzę</button></div>`;
  }else{
    h+=res?`<button class="primary" data-act="next">${i+1<r.n?'Następne zadanie':'Zobacz wynik'}</button>`:`<button class="primary" data-act="check">Sprawdź</button>${r.hint[i]?'':'<button class="ghost" data-act="hint">Podpowiedź</button>'}${r.msg?`<span class="warn">${r.msg}</span>`:''}`;
    h+='</div>';
  }
  return h+'</article>';
}

function vResult(){
  const r=RUN,s=r.summary,test=r.mode==='test',[g,gn]=gradeOf(s.pct);
  const full=r.res.filter(x=>x&&x.pts===x.max&&!x.hint).length;
  const errTopics=[...new Set(r.qs.map((q,k)=>r.res[k]&&r.res[k].pts<q.max?q.topic:null).filter(Boolean))];
  const names={6:'celujący',5:'bardzo dobry',4:'dobry',3:'dostateczny',2:'dopuszczający',1:'niedostateczny'};
  let h=`<section class="hello"><span class="eyebrow">${test?'Wynik sprawdzianu':'Wynik treningu'}</span><h1>${s.pct>=90?'Świetna robota!':s.pct>=60?'Dobra robota!':'Jest nad czym popracować'}</h1></section>
  <section class="card res-top">
    ${test?`<div class="stamp" aria-label="Ocena ${g}"><b>${g}</b><span>${gn}</span></div>`:''}
    <div class="stack" style="gap:6px;min-width:0">
      <div class="big">${s.pts} <small>/ ${s.max} p.</small></div>
      <p><b>${s.pct}%</b> ${test?`· ocena ${names[g]}`:`· ${full} ${plural(full,'zadanie','zadania','zadań')} bez błędu i bez podpowiedzi`} · czas ${mmss(s.time)}</p>
      ${test?'<p class="scale">Skala: 98–100% = 6, 90–97% = 5, 75–89% = 4, 60–74% = 3, 40–59% = 2, 0–39% = 1.</p>':''}
    </div>
  </section>
  <div class="acts" style="margin-top:0">${errTopics.length?`<button class="primary" data-act="fix" data-v="${errTopics.join(',')}">Poćwicz tematy z błędami (${errTopics.length})</button>`:''}
    <button class="${errTopics.length?'ghost':'primary'}" data-act="again">${test?'Nowy sprawdzian':'Jeszcze raz'}</button><button class="ghost" data-act="go" data-v="progress">Zobacz postępy</button></div>
  <section class="stack"><h2>Zadania</h2><p class="note">Kliknij zadanie, żeby zobaczyć odpowiedzi i wyjaśnienie.</p><div class="rlist">`;
  r.qs.forEach((q,k)=>{const x=r.res[k];if(!x)return;const m=x.pts===x.max?['y','✓']:x.pts?['p','½']:['n','✗'];
    h+=`<details class="ritem"${x.pts<x.max&&test?' open':''}><summary><span class="mark ${m[0]}">${m[1]}</span><span>Zadanie ${k+1}. ${T[q.topic].name}</span><span class="rp">${x.pts}/${x.max}</span></summary>
    <div class="rb">${qBody(q,'v'+k,r.vals[k],true,true)}<p class="expl">${q.expl}</p></div></details>`});
  return h+'</div></section>'+sendPanel();
}

function histRow(s){const d=new Date(s.d);const m={train:'Trening',test:'Sprawdzian',weak:'Słabe strony'}[s.mode]||s.mode;
  return`<div class="hrow"><span class="d">${d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'})} ${d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})}</span><span>${m}${s.level&&s.level!=='auto'?' · '+LV[s.level]:''}</span><span class="s">${s.pts}/${s.max} · ${s.pct}%</span><span class="g">${s.grade||''}</span></div>`}

function chartSVG(list){
  const W=620,H=210,l=36,rt=10,t=26,b=28,ih=H-t-b,n=list.length,slot=(W-l-rt)/Math.max(n,6),bw=Math.min(34,slot*.6);
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Wyniki ostatnich sesji w procentach">`;
  [0,50,75,100].forEach(v=>{const y=t+ih-ih*v/100;s+=`<line x1="${l}" x2="${W-rt}" y1="${y}" y2="${y}" class="gl"/><text x="${l-6}" y="${y+4}" class="gt" text-anchor="end">${v}%</text>`});
  list.forEach((x,i)=>{const cx=l+slot*i+slot/2,hgt=Math.max(2,ih*x.pct/100),y=t+ih-hgt;
    s+=`<rect x="${cx-bw/2}" y="${y}" width="${bw}" height="${hgt}" rx="3" class="${x.mode==='test'?'bx':'bt'}"/>`;
    s+=x.grade?`<text x="${cx}" y="${y-6}" class="gr">${x.grade}</text>`:`<text x="${cx}" y="${y-6}" class="vl">${x.pct}</text>`;
    const d=new Date(x.d);s+=`<text x="${cx}" y="${H-8}" class="gt" text-anchor="middle">${d.getDate()}.${d.getMonth()+1}</text>`});
  return s+'</svg>';
}

  <section class="stack"><h2>Tematy</h2><div class="card ttable">
    ${TOPICS.map(t=>{const a=acc(t.id),[c]=status(a),L=lvl(t.id),n=(S.topics[t.id]||{att:0}).att;
      return`<div class="trow"><span class="nm">${t.name}<br><span class="note">${n?`${n} ${plural(n,'zadanie','zadania','zadań')}`:'jeszcze nie ćwiczone'}</span></span>
      <span class="mini">${a!=null?`<i class="c-${c}" style="width:${Math.max(4,Math.round(a*100))}%"></i>`:''}</span>
      <span class="pc">${a==null?'—':Math.round(a*100)+'%'}</span>
      <span class="lvdots" title="Poziom: ${LV[L]}">${[1,2,3].map(k=>`<i class="${k<=L?'on':''}"></i>`).join('')}</span>

  </div><p class="note">Kropki pokazują poziom automatyczny tematu: łatwy, średni albo trudny.</p></section>
  ${S.sessions.length?`<section class="stack"><h2>Historia</h2><div class="card hist">${S.sessions.slice(-15).reverse().map(histRow).join('')}</div></section>`:''}
  <section class="card stack"><h2>Ustawienia</h2>
    <label class="row" for="name-in"><span class="lbl">Imię ucznia</span><input id="name-in" class="name-in" value="${esc(S.name)}" maxlength="24"></label>
    <p class="note">Wyniki zapisują się w tej przeglądarce na tym urządzeniu.</p>
    ${CONFIRM_RESET?`<div class="confirm"><p>Usunąć wszystkie wyniki i poziomy z tego przedmiotu? Tego nie da się cofnąć.</p><button class="primary danger" data-act="resetok">Tak, usuń</button><button class="ghost" data-act="resetno">Anuluj</button></div>`:'<div><button class="soft" data-act="reset">Wyczyść postępy</button></div>'}
  </section>`;
}

const MAIL='tomek.kno@gmail.com',SMS_NR='793797447';
let SEND={copied:false,show:false};
const MODE_N={train:'Trening',test:'Sprawdzian',weak:'Słabe strony'};
function sessLine(s){const d=new Date(s.d);return`${d.toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'})} ${d.toLocaleTimeString('pl-PL',{hour:'2-digit',minute:'2-digit'})} · ${MODE_N[s.mode]||s.mode}${s.level&&s.level!=='auto'?' ('+LV[s.level]+')':''} · ${s.pts}/${s.max} p. · ${s.pct}%${s.grade?' · ocena '+s.grade:''}`}
function overallTxt(){const all=TOPICS.flatMap(t=>(S.topics[t.id]||{recent:[]}).recent);return all.length?Math.round(all.reduce((a,b)=>a+b,0)/all.length*100)+'%':'brak danych'}
function summaryText(){
  const tests=S.sessions.filter(s=>s.mode==='test').slice(-5).reverse(),last=S.sessions[S.sessions.length-1];
  let t=`Wyniki: ${S.name} · ${SUBJ.name} kl. 4\nStan na: ${new Date().toLocaleString('pl-PL',{dateStyle:'short',timeStyle:'short'})}\n\n`;
  const td=today(),tds=S.sessions.filter(s=>ymd(new Date(s.d))===td);
  t+=`DZISIAJ: ${S.daily[td]||0} ${plural(S.daily[td]||0,'zadanie','zadania','zadań')}`;
  if(tds.length){const p=tds.reduce((a,s)=>a+s.pts,0),m=tds.reduce((a,s)=>a+s.max,0);t+=` · ${tds.length} ${plural(tds.length,'sesja','sesje','sesji')} · ${p}/${m} p. (${Math.round(p/m*100)}%)\n${tds.map(s=>'- '+sessLine(s)).join('\n')}`}
  t+='\n\n';
  if(last&&ymd(new Date(last.d))!==td)t+=`Ostatnia nauka: ${sessLine(last)}\n\n`;
  const wk=TOPICS.filter(x=>{const a=acc(x.id);return a!=null&&a<.5}).map(x=>x.name),top=TOPICS.filter(x=>{const a=acc(x.id);return a!=null&&a>=.8}).map(x=>x.name);
  t+=`OGÓŁEM\nRozwiązane zadania: ${S.count}\nŚrednia skuteczność: ${overallTxt()}\nDni nauki z rzędu: ${streak()}\nDni nauki łącznie: ${S.days.length}\n`;
  t+=`Opanowane tematy: ${top.length?top.join(', '):'jeszcze żaden'}\nDo poprawy: ${wk.length?wk.join(', '):'brak'}\n\n`;
  t+=`Sprawdziany:\n${tests.length?tests.map(s=>'- '+sessLine(s)).join('\n'):'- jeszcze żadnego'}\n\nTematy (skuteczność z ostatnich 20 zadań):\n`;
  t+=TOPICS.map(x=>{const a=acc(x.id);return`- ${x.name}: ${a==null?'nie ćwiczone':Math.round(a*100)+'% · '+status(a)[1]+' · poziom '+LV[lvl(x.id)]}`}).join('\n');
  const rec=S.sessions.slice(-10).reverse();if(rec.length)t+=`\n\nOstatnie sesje:\n${rec.map(s=>'- '+sessLine(s)).join('\n')}`;
  return t;
}
function smsText(){
  const td=today(),tds=S.sessions.filter(s=>ymd(new Date(s.d))===td),n=S.daily[td]||0;
  let t=`${S.name} - ${SUBJ.name.toLowerCase()}: dziś ${n} ${plural(n,'zadanie','zadania','zadań')}`;
  if(tds.length){const p=tds.reduce((a,s)=>a+s.pts,0),m=tds.reduce((a,s)=>a+s.max,0);t+=`, ${p}/${m} p. (${Math.round(p/m*100)}%)`}
  const g=tds.filter(s=>s.grade).map(s=>s.grade);
  if(g.length)t+=`, ${g.length>1?'oceny':'ocena'} ze sprawdzianu: ${g.join(', ')}`;
  else{const lt=S.sessions.filter(s=>s.grade).pop();if(lt)t+=`. Ostatni sprawdzian: ${lt.grade} (${new Date(lt.d).toLocaleDateString('pl-PL',{day:'2-digit',month:'2-digit'})})`}
  t+=`. Razem ${S.count} zadań, skuteczność ${overallTxt()}, ${streak()} ${plural(streak(),'dzień','dni','dni')} z rzędu.`;
  const wk=TOPICS.filter(x=>{const a=acc(x.id);return a!=null&&a<.5}).map(x=>x.name);if(wk.length)t+=` Do poprawy: ${wk.join(', ')}.`;
  return t;
}
const smsHref=()=>`sms:+48${SMS_NR}?&body=${encodeURIComponent(smsText())}`;
const mailHref=()=>`mailto:${MAIL}?subject=${encodeURIComponent('Wyniki: '+SUBJ.name+' - '+S.name)}&body=${encodeURIComponent(summaryText())}`;
function sendPanel(){
  return`<section class="card stack"><h2>Wyślij wyniki do taty</h2>
    <p class="note">E-mail z pełnym zestawieniem trafi na adres <span class="mail">${MAIL}</span>, a krótki SMS na numer <span class="mail">${SMS_NR.replace(/(\d{3})(?=\d)/g,'$1 ')}</span>.</p>
    <div class="row"><a class="primary" href="${mailHref()}" target="_blank" rel="noopener">Wyślij e-mailem</a><a class="primary" href="${smsHref()}" target="_blank" rel="noopener">Wyślij SMS-em</a><button class="ghost" data-act="copy">Skopiuj zestawienie</button>${SEND.copied?'<span class="okmsg">Skopiowano</span>':''}</div>
    <p class="note">Przyciski otwierają pocztę albo Wiadomości z gotowym tekstem, który trzeba jeszcze wysłać. Jeśli nic się nie otworzy, skopiuj zestawienie i wklej je do nowej wiadomości.</p>
    ${SEND.show?`<textarea class="sum-box" id="sum-box" readonly aria-label="Zestawienie wyników">${esc(summaryText())}</textarea>`:''}
  </section>`;
}

function render(){
  const nav=VIEW==='run'||VIEW==='result'?(RUN&&RUN.mode==='test'?'test':RUN&&RUN.mode==='train'?'train':''):VIEW;
  document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('on',b.dataset.go===nav));
  $('#nav').hidden=VIEW==='hub'||VIEW==='embed';$('#back').hidden=VIEW==='hub';
  $('#brand').innerHTML=VIEW==='hub'?'<span class="ic">📚</span> Szkolne sprawdziany <small>kl. 4</small>':`<span class="ic">${SUBJ.icon}</span> ${SUBJ.name} <small>kl. 4</small>`;
  $('#main').innerHTML=({embed:vEmbed,hub:vHub,home:vHome,train:vTrain,test:vTest,progress:vProgress,run:vRun,result:vResult})[VIEW]();
  $('#main').classList.toggle('wide',VIEW==='embed');if(VIEW==='embed')mountEmbed();
}
function go(v){
  if(VIEW==='run'&&RUN&&!RUN.done&&v!=='run'){RUN.pending=v;render();scrollTo(0,0);return}
  CONFIRM_RESET=false;VIEW=v;if(v==='hub')document.documentElement.removeAttribute('data-subj');render();scrollTo(0,0);
}
function refocus(sel){const el=document.querySelector(sel);el&&el.focus({preventScroll:true})}

/* ---------- zdarzenia ---------- */
document.querySelector('.top').addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b)go(b.dataset.go)});
$('#main').addEventListener('input',e=>{
  if(e.target.id==='name-in'){S.name=e.target.value.trim()||'Franek';save();return}
  if(e.target.classList&&e.target.classList.contains('num-in')){const ns=e.target.dataset.ns,k=+e.target.dataset.nk;const v=valsOf(ns);if(v){v[k]=e.target.value;if(ns==='w'&&WARM)WARM.msg='';else if(RUN)RUN.msg=''}}
});
$('#main').addEventListener('keydown',e=>{
  if(e.key==='Enter'&&e.target.classList&&e.target.classList.contains('num-in')){e.preventDefault();
    if(e.target.dataset.ns==='w')act('wcheck',e.target);else if(RUN&&RUN.mode!=='test'&&!RUN.res[RUN.i])doCheck()}
});
$('#main').addEventListener('change',e=>{if(e.target.id==='x-timer')TEST.timer=e.target.checked});
function act(a,el){
  const v=el.dataset.v,ns=el.dataset.ns;
  const clr=()=>{if(ns==='w')WARM.msg='';else if(RUN)RUN.msg=''};
  switch(a){
    case'go':go(v);break;
    case'weak':startRun('weak',{topics:weakTopics(),level:'auto',n:10});break;
    case'topic':startRun('train',{topics:[el.dataset.id],level:'auto',n:8});break;
    case'subj':setSubject(el.dataset.id);break;
    case'tick':{const k=+el.dataset.k,t=+el.dataset.t;valsOf(ns)[k]=t;clr();render();refocus(`[data-act="tick"][data-ns="${ns}"][data-t="${t}"]`);break}
    case'pick':valsOf(ns)[0]=+v;clr();render();refocus(`[data-act="pick"][data-ns="${ns}"][data-v="${v}"]`);break;
    case'sort':valsOf(ns)[+el.dataset.k]=+v;clr();render();refocus(`[data-act="sort"][data-ns="${ns}"][data-k="${el.dataset.k}"][data-v="${v}"]`);break;
    case'ord':valsOf(ns).push(+v);clr();render();refocus(`[data-act="ord"][data-ns="${ns}"]`);break;
    case'unord':valsOf(ns).splice(+el.dataset.k,1);render();refocus(`[data-act="ord"][data-ns="${ns}"]`);break;
    case'wcheck':{const q=WARM.q;if(isEmpty(q,WARM.vals)){WARM.msg=emptyMsg(q);render();return}
      const r=gradeQ(q,WARM.vals);r.verdict=verdict(r);r.lvMsg=record(q,r.pts,r.max,true);WARM.res=r;WARM.msg='';render();refocus('[data-act="wnext"]');break}
    case'wnext':newWarm();render();break;
    case'whint':WARM.hint=true;render();break;
    case'tchip':{const id=el.dataset.id;TRAIN.topics.has(id)?TRAIN.topics.delete(id):TRAIN.topics.add(id);render();break}
    case'tall':TRAIN.topics=TRAIN.topics.size===TOPICS.length?new Set():new Set(TOPICS.map(t=>t.id));render();break;
    case'tlv':TRAIN.level=v==='auto'?'auto':+v;render();break;
    case'tn':TRAIN.n=+v;render();break;
    case'tstart':if(TRAIN.topics.size)startRun('train',{topics:[...TRAIN.topics],level:TRAIN.level,n:TRAIN.n});break;
    case'xlv':TEST.level=+v;render();break;
    case'xlen':TEST.long=v==='1';render();break;
    case'xstart':startRun('test',{level:TEST.level,timer:TEST.timer,long:TEST.long});break;
    case'check':doCheck();break;
    case'hint':RUN.hint[RUN.i]=true;render();break;
    case'next':doNext();break;
    case'tnext':RUN.i++;RUN.confirmEnd=false;render();scrollTo(0,0);break;
    case'prev':RUN.i--;RUN.confirmEnd=false;render();scrollTo(0,0);break;
    case'jump':RUN.i=+v;RUN.confirmEnd=false;render();break;
    case'hand':RUN.confirmEnd=true;render();break;
    case'handno':RUN.confirmEnd=false;render();break;
    case'handok':finishTest();break;
    case'quit':RUN.pending='home';render();scrollTo(0,0);break;
    case'quitno':RUN.pending=null;render();break;
    case'quitok':{const t=RUN.pending;clearInterval(TIMER);RUN.done=true;RUN=null;VIEW=t;if(t==='hub')document.documentElement.removeAttribute('data-subj');render();scrollTo(0,0);break}
    case'again':if(RUN.mode==='test')startRun('test',{level:RUN.level,timer:!!RUN.deadline,long:RUN.n>TOPICS.length});else startRun(RUN.mode,{topics:[...new Set(RUN.order)],level:RUN.level,n:RUN.n});break;
    case'fix':{const ts=v.split(',');startRun('train',{topics:ts,level:'auto',n:Math.max(6,Math.min(15,ts.length*2))});break}
    case'copy':{const txt=summaryText();const done=ok=>{SEND.copied=ok;SEND.show=!ok;render();
        if(!ok){const b=$('#sum-box');if(b){b.focus();b.select()}}else setTimeout(()=>{SEND.copied=false;if(VIEW==='progress'||VIEW==='result')render()},2500)};
      try{navigator.clipboard.writeText(txt).then(()=>done(true),()=>done(false))}catch(e){done(false)}break}
    case'reset':CONFIRM_RESET=true;render();break;
    case'resetno':CONFIRM_RESET=false;render();break;
    case'resetok':S=blank();save();CONFIRM_RESET=false;WARM=null;render();break;
  }
}
$('#main').addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled||el.tagName==='INPUT')return;act(el.dataset.act,el)});

/* ---------- wybór przedmiotu ---------- */
let SUBJ=SUBJECTS.hist,TOPICS=SUBJ.TOPICS,T=SUBJ.T,CHAPTERS=SUBJ.CHAPTERS,B=SUBJ.B;
function setSubject(id){
  clearInterval(TIMER);RUN=null;WARM=null;CONFIRM_RESET=false;SEND={copied:false,show:false};
  SUBJ=SUBJECTS[id];TOPICS=SUBJ.TOPICS;T=SUBJ.T;CHAPTERS=SUBJ.CHAPTERS;B=SUBJ.B;KEY=SUBJ.key;S=load();
  TRAIN.topics=new Set(TOPICS.map(t=>t.id));TRAIN.level='auto';TRAIN.n=10;TEST.level=2;TEST.long=false;
  document.documentElement.dataset.subj=id;VIEW=SUBJ.custom?'embed':'home';render();scrollTo(0,0);
}
function peek(sub){try{const s=JSON.parse(localStorage.getItem(sub.key));if(!s)return null;const all=(sub.custom?Object.keys(s.topics||{}):sub.TOPICS.map(t=>t.id)).flatMap(id=>(s.topics&&s.topics[id]||{recent:[]}).recent);return{count:s.count||0,avg:all.length?all.reduce((a,b)=>a+b,0)/all.length:null,total:sub.TOPICS.length,done:sub.TOPICS.filter(t=>s.topics&&s.topics[t.id]&&s.topics[t.id].recent.length).length}}catch(e){return null}}
function vHub(){
  const col={hist:['#8A5A2B','#F3E8DA'],przyroda:['#2E7549','#E1F1E6'],english:['#3F65AE','#E3EBF8'],math:['#6F52A5','#ECE6F6']};
  const dark=window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches;
  const dc={hist:['#E0B27E','#3A2A18'],przyroda:['#8BD1A4','#17301F'],english:['#9DB9EE','#1C2B47'],math:['#BBA6E8','#2C2347']};
  return`<section class="hello"><span class="eyebrow">Klasa 4</span><h1>Cześć! Czego dziś się uczymy?</h1>
    <p class="lead">Wybierz przedmiot. Każdy ma własne tematy, trening i sprawdzian z oceną.</p></section>
  <section class="subjects">${Object.values(SUBJECTS).map(s=>{const p=peek(s),c=(dark?dc:col)[s.id];
    return`<button class="subj" data-act="subj" data-id="${s.id}" style="--c:${c[0]};--cs:${c[1]}"><span class="big-ic" aria-hidden="true">${s.icon}</span><b>${s.name}</b><small>${s.desc}</small>
      <span class="mbar" aria-hidden="true"><i style="width:${p&&p.avg!=null?Math.max(4,Math.round(p.avg*100)):0}%"></i></span>
      <span class="meta">${p&&p.count?`${p.count} ${plural(p.count,'zadanie','zadania','zadań')} · skuteczność ${p.avg==null?'—':Math.round(p.avg*100)+'%'}`:'jeszcze nie ćwiczone'}</span></button>`}).join('')}</section>`;
}
/* oś liczbowa (matematyka) */
function lineSVG(q,ns,vals,locked,show){
  const L=q.line,x0=34,g=54,y=52;let s=`<svg viewBox="0 0 620 100" role="img" aria-label="Oś liczbowa">`;
  s+=`<line x1="8" y1="${y}" x2="604" y2="${y}" class="ax"/><path d="M604 ${y-7} L616 ${y} L604 ${y+7} Z" class="axh"/>`;
  for(let i=0;i<=10;i++){const x=x0+i*g;s+=`<line x1="${x}" y1="${y-9}" x2="${x}" y2="${y+9}" class="tk"/>`}
  L.labels.forEach(([i,v])=>{s+=`<text x="${x0+i*g}" y="${y+34}" class="lb">${Number(v).toLocaleString('pl-PL')}</text>`});
  if(L.point!=null){const x=x0+L.point*g;s+=`<circle cx="${x}" cy="${y}" r="7" class="pt"/><text x="${x}" y="${y-17}" class="pl">A</text>`;
    if(show)s+=`<text x="${x}" y="${y+34}" class="lb ans">${Number(q.fields[0].ans).toLocaleString('pl-PL')}</text>`}
  const k=q.fields.findIndex(fd=>fd.mark);
  if(k>=0){const sel=vals[k],ans=q.fields[k].ans;
    for(let i=0;i<=10;i++){const x=x0+i*g;let c='hit';if(sel===i)c+=' sel';if(show&&i===ans)c+=' right';if(show&&sel===i&&sel!==ans)c+=' wrong';
      const at=locked?'':` data-act="tick" data-ns="${ns}" data-k="${k}" data-t="${i}" tabindex="0" role="button" aria-label="Kreska numer ${i}"`;
      s+=`<g class="${c}"${at}><rect x="${x-26}" y="${y-30}" width="52" height="58" fill="transparent"/><circle cx="${x}" cy="${y}" r="8" class="mk"/></g>`}
    if(show)s+=`<text x="${x0+ans*g}" y="${y+34}" class="lb ans">${q.fields[k].show}</text>`}
  return s+'</svg>';
}
$('#main').addEventListener('keydown',e=>{const el=e.target;if((e.key==='Enter'||e.key===' ')&&el.dataset&&el.dataset.act==='tick'){e.preventDefault();act('tick',el)}});

/* matematyka: osobny moduł (rozdziały, ścieżka rozumowania, Kangur) osadzony w ramce */
function vEmbed(){return'<div id="embed-wrap"></div>'}
function mountEmbed(){
  const w=$('#embed-wrap');if(!w)return;
  const src=document.getElementById('math-src').textContent.replace(/<%%\/S/g,'</scr'+'ipt').replace(/<%%S/g,'<scr'+'ipt');
  const fr=document.createElement('iframe');fr.id='math-frame';fr.title='Matematyka';
  fr.srcdoc=src.replace('</head>','<style>.top .brand{display:none}</style></head>');
  w.appendChild(fr);fitEmbed();
}
function fitEmbed(){const fr=document.getElementById('math-frame');if(!fr)return;const h=document.querySelector('.top').getBoundingClientRect().bottom;fr.style.height=Math.max(320,innerHeight-h)+'px'}
if(typeof window!=='undefined'&&window.addEventListener)window.addEventListener('resize',fitEmbed);
render();

</script>
